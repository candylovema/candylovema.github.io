    <script>
        window.addEventListener('error', function(e) {
            var root = document.getElementById('root');
            if (root && (!root.children || root.children.length === 0)) {
                root.innerHTML = '<div style="padding:24px; color:#721c24; background-color:#f8d7da; border:1px solid #f5c6cb; border-radius:12px; margin:20px; font-family:sans-serif;">' +
                    '<h3 style="font-weight:bold; font-size:18px; margin-bottom:8px;">⚠️ 頁面載入異常 (Script Load Error)</h3>' +
                    '<p style="font-size:14px; margin-bottom:12px;">訊息：' + (e.message || '未知錯誤') + '</p>' +
                    '<p style="font-size:13px; color:#555;">請確認您的網路能連線至 CDN 服務（unpkg/cdnjs），或嘗試按 Ctrl+F5 強制重新整理。</p>' +
                    '</div>';
            }
        });

        const Icon = ({ name, size = 18, className = "" }) => {

        const cleanCodeStr = (s) => (s || '').toString().trim().toLowerCase().replace(/[\s\-_架倉]/g, '');

        const deduplicateWarehouses = (list) => {
            if (!Array.isArray(list)) return [];
            const map = new Map();
            list.forEach(w => {
                if (!w) return;
                const key = w.id || cleanCodeStr(w.code) || w.code;
                if (!map.has(key)) {
                    const shelves = (w.shelves || []).map(s => ({
                        ...s,
                        tiers: parseInt(s.tiers, 10) || parseInt(s.tier, 10) || 4
                    }));
                    const decors = (w.decors || []).map(d => ({
                        ...d,
                        rot: parseInt(d.rot, 10) || 0
                    }));
                    map.set(key, { ...w, shelves, decors, wallColor: w.wallColor || '#E6D5C3' });
                } else {
                    const existing = map.get(key);
                    const shelfMap = new Map();
                    (existing.shelves || []).forEach(s => {
                        const sKey = s.id || cleanCodeStr(s.code);
                        shelfMap.set(sKey, {
                            ...s,
                            tiers: parseInt(s.tiers, 10) || parseInt(s.tier, 10) || 4
                        });
                    });
                    (w.shelves || []).forEach(s => {
                        const sKey = s.id || cleanCodeStr(s.code);
                        const prev = shelfMap.get(sKey) || {};
                        const parsedTiers = parseInt(s.tiers, 10) || parseInt(s.tier, 10) || parseInt(prev.tiers, 10) || 4;
                        shelfMap.set(sKey, { ...prev, ...s, tiers: parsedTiers });
                    });
                    
                    const decorMap = new Map();
                    (existing.decors || []).forEach(d => {
                        const dKey = d.id || cleanCodeStr(d.name);
                        decorMap.set(dKey, d);
                    });
                    (w.decors || []).forEach(d => {
                        const dKey = d.id || cleanCodeStr(d.name);
                        decorMap.set(dKey, { ...decorMap.get(dKey), ...d });
                    });

                    existing.shelves = Array.from(shelfMap.values());
                    existing.decors = Array.from(decorMap.values());
                    existing.wallColor = w.wallColor || existing.wallColor || '#E6D5C3';
                }
            });
            return Array.from(map.values());
        };

        const saveStorage = (key, val) => {
            try {
                const str = typeof val === 'string' ? val : JSON.stringify(val);
                localStorage.setItem(key, str);
                return true;
            } catch (e) {
                console.warn(`Storage save warning for ${key}:`, e);
                return false;
            }
        };

        const loadStorage = (key, defaultVal = null) => {
            try {
                const item = localStorage.getItem(key);
                return (item !== null && item !== "undefined") ? JSON.parse(item) : defaultVal;
            } catch (e) {
                return defaultVal;
            }
        };

        const getBookLocationInfo = (book, warehouseList) => {
            if (!book || (!book.warehouseId && !book.shelfId)) {
                return { wh: null, sh: null, isAssigned: false };
            }

            const cleanWhId = cleanCodeStr(book.warehouseId);
            const cleanShId = cleanCodeStr(book.shelfId);

            let wh = warehouseList.find(w => 
                w.id === book.warehouseId || 
                w.code === book.warehouseId ||
                (cleanWhId && (cleanCodeStr(w.id) === cleanWhId || cleanCodeStr(w.code) === cleanWhId || cleanCodeStr(w.name).includes(cleanWhId)))
            );

            let sh = null;
            if (wh) {
                sh = wh.shelves.find(s => 
                    s.id === book.shelfId || 
                    s.code === book.shelfId ||
                    (cleanShId && (cleanCodeStr(s.id) === cleanShId || cleanCodeStr(s.code) === cleanShId || cleanCodeStr(s.name).includes(cleanShId)))
                );
            } else {
                for (const w of warehouseList) {
                    const foundS = w.shelves.find(s => 
                        s.id === book.shelfId || 
                        s.code === book.shelfId ||
                        (cleanShId && (cleanCodeStr(s.id) === cleanShId || cleanCodeStr(s.code) === cleanShId))
                    );
                    if (foundS) {
                        wh = w;
                        sh = foundS;
                        break;
                    }
                }
            }

            return { wh, sh, isAssigned: !!(wh && sh) };
        };

        const parseBookLocation = (b, warehouseList) => {
            let whId = b.warehouseId || '';
            let shId = b.shelfId || '';
            let tierNum = parseInt(b.tier, 10) || 1;

            const infoStr = (b.warehouseInfo || b.locationStr || b.location || '').toString();

            let foundWh = warehouseList.find(w => w.id === whId || w.code === whId);
            if (!foundWh && infoStr) {
                const cleanInfo = cleanCodeStr(infoStr);
                foundWh = warehouseList.find(w => {
                    const wc = cleanCodeStr(w.code);
                    const wi = cleanCodeStr(w.id);
                    const wn = cleanCodeStr(w.name);
                    return (wc && cleanInfo.includes(wc)) || (wi && cleanInfo.includes(wi)) || (wn && cleanInfo.includes(wn));
                });
            }

            let foundSh = null;
            if (foundWh) {
                whId = foundWh.id;
                foundSh = foundWh.shelves.find(s => s.id === shId || s.code === shId);
                if (!foundSh && infoStr) {
                    const cleanInfo = cleanCodeStr(infoStr);
                    foundSh = foundWh.shelves.find(s => {
                        const sc = cleanCodeStr(s.code);
                        const si = cleanCodeStr(s.id);
                        const sn = cleanCodeStr(s.name);
                        return (sc && cleanInfo.includes(sc)) || (si && cleanInfo.includes(si)) || (sn && cleanInfo.includes(sn));
                    });
                }
            }

            if (foundSh) {
                shId = foundSh.id;
            } else if (!foundWh) {
                whId = '';
                shId = '';
            }

            if (infoStr) {
                const tierMatch = infoStr.match(/(?:第|tier\s*)(\d+)/i) || infoStr.match(/(\d+)\s*層/i);
                if (tierMatch) {
                    tierNum = parseInt(tierMatch[1], 10) || 1;
                }
            }

            return { warehouseId: whId, shelfId: shId, tier: tierNum };
        };

                const r = cameraAngle.current.radius;
                const theta = cameraAngle.current.theta;
                const phi = cameraAngle.current.phi;
                const target = cameraTarget.current;

                cam.position.x = target.x + r * Math.sin(phi) * Math.sin(theta);
                cam.position.y = target.y + r * Math.cos(phi);

                    mouse.x = ((clientX - rect.left) / rect.width) * 2 - 1;

                    raycaster.setFromCamera(mouse, cameraRef.current);
                    const intersects = raycaster.intersectObject(floorPlaneMeshRef.current);

                };

                const handlePointerDown = (clientX, clientY) => {
                    if (!shelvesGroupRef.current || !decorsGroupRef.current || !rendererRef.current || !cameraRef.current) return;

                            const decorData = obj.userData.decorData;
                            if (onSelectDecorRef.current) onSelectDecorRef.current(decorData);
                            if (onSelectShelfRef.current) onSelectShelfRef.current(null);

                            activeObjectType.current = 'decor';
                            activeObjectId.current = decorData.id || decorData.name;

                            const floorPt = getFloorIntersection(clientX, clientY);
                            if (floorPt) {
                                dragPlaneIntersectionOffset.current = {
                                    x: floorPt.x - (parseFloat(decorData.x) || 0),
                                    z: floorPt.z - (parseFloat(decorData.z) || 0)
                                };
                            }
                            isDraggingObject.current = true;
                            isDraggingCamera.current = false;
                            previousMousePosition.current = { x: clientX, y: clientY };

                        }
                    }

                    isDraggingCamera.current = true;
                    isDraggingObject.current = false;
                    previousMousePosition.current = { x: clientX, y: clientY };
                };

                const handlePointerMove = (clientX, clientY) => {
                    if (isDraggingObject.current && activeObjectId.current && warehouseRef.current) {
                        const floorPt = getFloorIntersection(clientX, clientY);
                        if (floorPt) {
                            const curWh = warehouseRef.current;
                            const halfW = (curWh.width / 2);
                            const halfD = (curWh.depth / 2);

                            let newX = Math.round((floorPt.x - dragPlaneIntersectionOffset.current.x) * 10) / 10;
                            let newZ = Math.round((floorPt.z - dragPlaneIntersectionOffset.current.z) * 10) / 10;

                            newX = Math.max(-halfW, Math.min(halfW, newX));
                            newZ = Math.max(-halfD, Math.min(halfD, newZ));

                            if (activeObjectType.current === 'shelf') {
                                const curShelf = curWh.shelves.find(s => (s.id && s.id === activeObjectId.current) || (s.code && s.code === activeObjectId.current));
                                if (curShelf && (curShelf.x !== newX || curShelf.z !== newZ)) {
                                    if (onUpdateShelfRef.current) {
                                        onUpdateShelfRef.current({ ...curShelf, x: newX, z: newZ });
                                    }
                                }
                            } else if (activeObjectType.current === 'decor') {
                                const curDecor = (curWh.decors || []).find(d => (d.id && d.id === activeObjectId.current) || (d.name && d.name === activeObjectId.current));
                                if (curDecor && (curDecor.x !== newX || curDecor.z !== newZ)) {
                                    if (onUpdateDecorRef.current) {
                                        onUpdateDecorRef.current({ ...curDecor, x: newX, z: newZ });
                                    }
                                }
                            }
                        }
                        return;
                    }

                    if (!isDraggingCamera.current) return;
                    const deltaX = clientX - previousMousePosition.current.x;
                    const deltaY = clientY - previousMousePosition.current.y;

                    cameraAngle.current.theta -= deltaX * 0.008;
                    cameraAngle.current.phi = Math.max(0.08, Math.min(Math.PI / 2 - 0.02, cameraAngle.current.phi - deltaY * 0.008));

                    previousMousePosition.current = { x: clientX, y: clientY };
                    updateCameraPosition();
                };

                    isDraggingCamera.current = false;
                    isDraggingObject.current = false;
                    activeObjectId.current = null;
                };

                const handleMouseDown = (e) => handlePointerDown(e.clientX, e.clientY);
                const handleMouseMove = (e) => handlePointerMove(e.clientX, e.clientY);
                const handleMouseUp = () => handlePointerUp();

                        isDraggingObject.current = false;
                        const dist = Math.hypot(
                            e.touches[0].clientX - e.touches[1].clientX,
                            e.touches[0].clientY - e.touches[1].clientY
                        );
                        initialTouchDistance.current = dist;
                    }
                };

                const handleTouchMove = (e) => {
                    if (e.touches.length === 1) {
                        handlePointerMove(e.touches[0].clientX, e.touches[0].clientY);
                    } else if (e.touches.length === 2 && initialTouchDistance.current !== null && warehouseRef.current) {
                        const dist = Math.hypot(
                            e.touches[0].clientX - e.touches[1].clientX,
                            e.touches[0].clientY - e.touches[1].clientY
                        );
                        const delta = initialTouchDistance.current - dist;
                        const maxD = Math.max(warehouseRef.current.width, warehouseRef.current.depth);
                        cameraAngle.current.radius = Math.max(5, Math.min(maxD * 2.5, cameraAngle.current.radius + delta * 0.2));
                        initialTouchDistance.current = dist;
                        updateCameraPosition();
                    }
                };

                const handleTouchEnd = () => {
                    handlePointerUp();
                    initialTouchDistance.current = null;
                };

                const handleWheel = (e) => {
                    e.preventDefault();
                    if (!warehouseRef.current) return;
                    const maxD = Math.max(warehouseRef.current.width, warehouseRef.current.depth);
                    cameraAngle.current.radius = Math.max(5, Math.min(maxD * 2.5, cameraAngle.current.radius + e.deltaY * 0.05));
                    updateCameraPosition();
                };

                const domEl = renderer.domElement;
                domEl.addEventListener('mousedown', handleMouseDown);
                window.addEventListener('mousemove', handleMouseMove);
                window.addEventListener('mouseup', handleMouseUp);
                
                domEl.addEventListener('touchstart', handleTouchStart, { passive: true });
                window.addEventListener('touchmove', handleTouchMove, { passive: true });
                window.addEventListener('touchend', handleTouchEnd);
                domEl.addEventListener('wheel', handleWheel, { passive: false });

                const resizeObserver = new ResizeObserver(() => {
                    if (!mountRef.current || !rendererRef.current || !cameraRef.current) return;
                    const w = mountRef.current.clientWidth;
                    const h = mountRef.current.clientHeight;
                    if (w === 0 || h === 0) return;
                    cameraRef.current.aspect = w / h;
                    cameraRef.current.updateProjectionMatrix();
                    rendererRef.current.setSize(w, h);
                });
                resizeObserver.observe(container);

                let time = 0;
                const animate = () => {
                    time += 0.03;
                    if (pinMeshRef.current && pinMeshRef.current.visible) {
                        pinMeshRef.current.position.y += Math.sin(time * 3) * 0.012;
                        pinMeshRef.current.rotation.y += 0.02;
                    }
                    if (rendererRef.current && sceneRef.current && cameraRef.current) {
                        rendererRef.current.render(sceneRef.current, cameraRef.current);
                    }
                    animFrameRef.current = requestAnimationFrame(animate);
                };
                animate();

                return () => {
                    resizeObserver.disconnect();
                    window.removeEventListener('mousemove', handleMouseMove);
                    window.removeEventListener('mouseup', handleMouseUp);
                    window.removeEventListener('touchmove', handleTouchMove);
                    window.removeEventListener('touchend', handleTouchEnd);
                    if (animFrameRef.current) cancelAnimationFrame(animFrameRef.current);
                    if (domEl) {
                        domEl.removeEventListener('mousedown', handleMouseDown);
                        domEl.removeEventListener('touchstart', handleTouchStart);
                        domEl.removeEventListener('wheel', handleWheel);
                    }
                    if (rendererRef.current) {
                        rendererRef.current.dispose();
                    }
                };
            }, [updateCameraPosition]);

            useEffect(() => {
                if (!sceneRef.current || !shelvesGroupRef.current || !decorsGroupRef.current || !warehouse) return;

                const scene = sceneRef.current;
                const shelvesGroup = shelvesGroupRef.current;
                const decorsGroup = decorsGroupRef.current;

                while (shelvesGroup.children.length > 0) shelvesGroup.remove(shelvesGroup.children[0]);
                while (decorsGroup.children.length > 0) decorsGroup.remove(decorsGroup.children[0]);

                const oldFloor = scene.getObjectByName("warehouseFloor");
                if (oldFloor) scene.remove(oldFloor);

                const oldGrid = scene.getObjectByName("warehouseGrid");
                if (oldGrid) scene.remove(oldGrid);

                const oldWalls = scene.getObjectByName("warehouseWalls");
                if (oldWalls) scene.remove(oldWalls);

                const whWidth = Math.max(1, warehouse.width || 24);
                const whDepth = Math.max(1, warehouse.depth || 18);
                const whHeight = Math.max(2, warehouse.height || 4.5);
                const wallColorHex = warehouse.wallColor ? parseInt(warehouse.wallColor.replace('#', '0x')) : 0xE6D5C3;

                // 1. Floor
                const floorGeo = new THREE.PlaneGeometry(whWidth, whDepth);
                const floorMat = new THREE.MeshStandardMaterial({
                    color: 0xE6D5C3,
                    roughness: 0.8,
                    metalness: 0.1,
                    side: THREE.DoubleSide
                });
                const floorMesh = new THREE.Mesh(floorGeo, floorMat);
                floorMesh.rotation.x = Math.PI / 2;
                floorMesh.receiveShadow = true;
                floorMesh.name = "warehouseFloor";
                scene.add(floorMesh);

                // 2. Grid Helper
                const maxDim = Math.max(whWidth, whDepth);
                const divisions = Math.min(100, Math.max(12, Math.floor(maxDim / 2)));
                const gridHelper = new THREE.GridHelper(maxDim, divisions, 0x8C5A2B, 0xC4B29E);
                gridHelper.position.y = 0.01;
                gridHelper.name = "warehouseGrid";
                scene.add(gridHelper);

                // 3. Render 3D Walls (Back, Left, Right Walls)
                const wallGroup = new THREE.Group();
                wallGroup.name = "warehouseWalls";
                const wallMat = new THREE.MeshStandardMaterial({ color: wallColorHex, roughness: 0.7 });
                const wallThickness = 0.3;

                // Back Wall
                const backWallGeo = new THREE.BoxGeometry(whWidth + wallThickness*2, whHeight, wallThickness);
                const backWall = new THREE.Mesh(backWallGeo, wallMat);
                backWall.position.set(0, whHeight/2, -whDepth/2 - wallThickness/2);
                backWall.receiveShadow = true;
                wallGroup.add(backWall);

                // Left Wall
                const leftWallGeo = new THREE.BoxGeometry(wallThickness, whHeight, whDepth);
                const leftWall = new THREE.Mesh(leftWallGeo, wallMat);
                leftWall.position.set(-whWidth/2 - wallThickness/2, whHeight/2, 0);
                leftWall.receiveShadow = true;
                wallGroup.add(leftWall);

                // Right Wall
                const rightWallGeo = new THREE.BoxGeometry(wallThickness, whHeight, whDepth);
                const rightWall = new THREE.Mesh(rightWallGeo, wallMat);
                rightWall.position.set(whWidth/2 + wallThickness/2, whHeight/2, 0);
                rightWall.receiveShadow = true;
                wallGroup.add(rightWall);

                // Wooden Baseboard Trim
                const trimMat = new THREE.MeshStandardMaterial({ color: 0x4A3728, roughness: 0.5 });
                const bBoardGeo = new THREE.BoxGeometry(whWidth, 0.2, 0.05);
                const baseboard = new THREE.Mesh(bBoardGeo, trimMat);
                baseboard.position.set(0, 0.1, -whDepth/2 + 0.025);
                wallGroup.add(baseboard);

                scene.add(wallGroup);

                // 4. Render Shelves
                (warehouse.shelves || []).forEach(shelf => {
                    const shelfGroup = new THREE.Group();
                    const curX = parseFloat(shelf.x) || 0;
                    const curZ = parseFloat(shelf.z) || 0;
                    const curRot = parseInt(shelf.rot, 10) || 0;

                    shelfGroup.position.set(curX, 0, curZ);
                    shelfGroup.rotation.y = (curRot * Math.PI) / 180;
                    shelfGroup.userData = { shelfData: shelf };

                    const isSelected = selectedShelf && (selectedShelf.id === shelf.id || selectedShelf.code === shelf.code);
                    const shelfHeight = 2.4;
                    const frameColor = isSelected ? 0xF39C12 : 0x4A3728;

                    const postGeo = new THREE.BoxGeometry(0.08, shelfHeight, 0.08);
                    const postMat = new THREE.MeshStandardMaterial({ color: frameColor, roughness: 0.4, metalness: 0.3 });

                    const hW = (parseFloat(shelf.width) || 3.0) / 2;
                    const hD = (parseFloat(shelf.depth) || 0.9) / 2;
                    const hH = shelfHeight / 2;

                    [[-hW, hD], [hW, hD], [-hW, -hD], [hW, -hD]].forEach(([px, pz]) => {
                        const post = new THREE.Mesh(postGeo, postMat);
                        post.position.set(px, hH, pz);
                        post.castShadow = true;
                        shelfGroup.add(post);
                    });

                    const tierCount = parseInt(shelf.tiers, 10) || parseInt(shelf.tier, 10) || 4;
                    const tierGap = shelfHeight / tierCount;

                    for (let i = 0; i <= tierCount; i++) {
                        const plankGeo = new THREE.BoxGeometry(parseFloat(shelf.width) || 3.0, 0.05, parseFloat(shelf.depth) || 0.9);
                        const plankMat = new THREE.MeshStandardMaterial({
                            color: isSelected ? 0xF5B041 : 0x8C5A2B,
                            roughness: 0.6
                        });
                        const plank = new THREE.Mesh(plankGeo, plankMat);
                        const py = i * tierGap;
                        plank.position.set(0, py, 0);
                        plank.receiveShadow = true;
                        shelfGroup.add(plank);

                        if (i < tierCount) {
                            const bookStackGroup = new THREE.Group();
                            const booksInTier = 6 + Math.floor(Math.random() * 8);
                            let startX = -hW + 0.2;

                            for (let b = 0; b < booksInTier; b++) {
                                const bW = 0.08 + Math.random() * 0.06;
                                const bH = tierGap * 0.65 + Math.random() * 0.1;
                                const bD = (parseFloat(shelf.depth) || 0.9) * 0.7;

                                const bookGeo = new THREE.BoxGeometry(bW, bH, bD);
                                const bookColors = [0x8C5A2B, 0x2C241B, 0x1B4F72, 0x7D6608, 0x196F3D, 0x5B2C6F, 0x900C3F];
                                const bColor = bookColors[b % bookColors.length];

                                const bookMat = new THREE.MeshStandardMaterial({ color: bColor, roughness: 0.5 });
                                const bookMesh = new THREE.Mesh(bookGeo, bookMat);
                                bookMesh.position.set(startX + bW / 2, py + bH / 2 + 0.02, 0);
                                bookMesh.castShadow = true;
                                bookStackGroup.add(bookMesh);

                                startX += bW + 0.02;
                                if (startX > hW - 0.2) break;
                            }
                            shelfGroup.add(bookStackGroup);
                        }
                    }

                    const labelGeo = new THREE.BoxGeometry((parseFloat(shelf.width) || 3.0) * 0.6, 0.25, 0.05);
                    const labelMat = new THREE.MeshStandardMaterial({ color: 0x2C241B, roughness: 0.2 });
                    const labelMesh = new THREE.Mesh(labelGeo, labelMat);
                    labelMesh.position.set(0, shelfHeight + 0.15, hD);
                    shelfGroup.add(labelMesh);

                    if (isSelected) {
                        const bboxGeo = new THREE.BoxGeometry((parseFloat(shelf.width) || 3.0) + 0.2, shelfHeight + 0.3, (parseFloat(shelf.depth) || 0.9) + 0.2);
                        const bboxWire = new THREE.LineSegments(
                            new THREE.EdgesGeometry(bboxGeo),
                            new THREE.LineBasicMaterial({ color: 0xF39C12, linewidth: 3 })
                        );
                        bboxWire.position.y = shelfHeight / 2;
                        shelfGroup.add(bboxWire);
                    }

                    shelvesGroup.add(shelfGroup);
                });

                // 5. Render Furniture & Decors
                (warehouse.decors || []).forEach(decor => {
                    const isSelected = selectedDecor && (selectedDecor.id === decor.id || selectedDecor.name === decor.name);
                    const decorMesh = createDecorMesh(decor, isSelected);
                    decorMesh.position.set(parseFloat(decor.x) || 0, 0, parseFloat(decor.z) || 0);
                    decorMesh.rotation.y = ((parseInt(decor.rot, 10) || 0) * Math.PI) / 180;
                    decorMesh.userData = { decorData: decor };
                    decorsGroup.add(decorMesh);
                });

                if (highlightedLocation && pinMeshRef.current) {
                    const targetShelf = warehouse.shelves.find(s => s.id === highlightedLocation.shelfId || s.code === highlightedLocation.shelfId);
                    if (targetShelf) {
                        const shelfHeight = 2.4;
                        const tTiers = parseInt(targetShelf.tiers, 10) || parseInt(targetShelf.tier, 10) || 4;
                        const tierGap = shelfHeight / tTiers;
                        const tierY = (highlightedLocation.tier || 1) * tierGap;

                        pinMeshRef.current.position.set(parseFloat(targetShelf.x) || 0, tierY + 1.2, parseFloat(targetShelf.z) || 0);
                        pinMeshRef.current.visible = true;
                    } else {
                        pinMeshRef.current.visible = false;
                    }
                } else if (pinMeshRef.current) {
                    pinMeshRef.current.visible = false;
                }

            }, [warehouse, selectedShelf, selectedDecor, highlightedLocation]);

            const panCamera = (dir) => {
                const step = Math.max(1, Math.max(warehouse.width, warehouse.depth) * 0.03);
                const theta = cameraAngle.current.theta;
                const forwardX = -Math.sin(theta);
                const forwardZ = -Math.cos(theta);
                const rightX = Math.cos(theta);
                const rightZ = -Math.sin(theta);

                if (dir === 'up') {
                    cameraTarget.current.x += forwardX * step;
                    cameraTarget.current.z += forwardZ * step;
                } else if (dir === 'down') {
                    cameraTarget.current.x -= forwardX * step;
                    cameraTarget.current.z -= forwardZ * step;
                } else if (dir === 'left') {
                    cameraTarget.current.x -= rightX * step;
                    cameraTarget.current.z -= rightZ * step;
                } else if (dir === 'right') {
                    cameraTarget.current.x += rightX * step;
                    cameraTarget.current.z += rightZ * step;
                } else if (dir === 'zoomIn') {
                    cameraAngle.current.radius = Math.max(5, cameraAngle.current.radius * 0.85);
                } else if (dir === 'zoomOut') {
                    const maxD = Math.max(warehouse.width, warehouse.depth);
                    cameraAngle.current.radius = Math.min(maxD * 2.5, cameraAngle.current.radius * 1.15);
                } else if (dir === 'reset') {
                    cameraTarget.current = { x: 0, y: 0, z: 0 };
                    const dim = Math.max(warehouse.width, warehouse.depth);
                    cameraAngle.current = { theta: viewMode === '2D' ? 0 : Math.PI / 4, phi: viewMode === '2D' ? 0.18 : Math.PI / 3, radius: Math.max(35, dim * 1.15) };
                }
                updateCameraPosition();
            };

            return (
                <div className="w-full h-full relative canvas-container">
                    <div ref={mountRef} className="w-full h-full cursor-grab active:cursor-grabbing" />
                    
                    {/* Desktop Controls Overlay */}
                    <div className="hidden md:flex absolute bottom-4 left-4 glass-dark text-xs p-3 rounded-xl pointer-events-none flex-col gap-1 border border-white/10 font-sans shadow-lg">
                        <div className="font-bold text-amber-300 flex items-center gap-1.5 mb-0.5">
                            <Icon name="Compass" size={14} /> 3D 視角與擺設操作說明：
                        </div>
                        <div>• 點擊並拖曳 3D 書架 / 家具：可自由於地面擺放移位</div>
                        <div>• 單指/左鍵按住空白處拖曳：旋轉 3D 視角</div>
                        <div>• 滾輪/雙指捏合：放大與縮小視野</div>
                    </div>

                    {/* Selected Badge Overlay */}
                    {(selectedShelf || selectedDecor) && (
                        <div className="absolute top-16 left-4 z-20 pointer-events-none">
                            <div className="glass-panel px-3 py-1.5 rounded-xl border border-amber-800/40 text-amber-900 shadow-lg flex items-center gap-2 text-xs font-bold animate-pulse">
                                <span className="w-2.5 h-2.5 rounded-full bg-amber-600 animate-ping"></span>
                                {selectedShelf ? (
                                    <span>已選取書架【{selectedShelf.code} - {selectedShelf.name}】</span>
                                ) : (
                                    <span>已選取軟裝飾【{selectedDecor.name}】</span>
                                )}
                            </div>
                        </div>
                    )}

                    {/* Mobile Navigation Controls */}
                    <div className="absolute bottom-4 right-4 z-20 flex flex-col gap-2 items-end pointer-events-auto">
                        <div className="glass-panel p-2 rounded-2xl shadow-xl flex flex-col gap-1.5 items-center border border-borderwood">
                            <div className="text-[10px] font-bold text-amber-900 border-b border-borderwood/60 pb-1 w-full text-center">
                                📱 視角平移
                            </div>
                            <div className="grid grid-cols-3 gap-1">
                                <div />
                                <button onClick={() => panCamera('up')} className="p-2 bg-amber-800 text-white rounded-lg active:scale-95 shadow-sm"><Icon name="ArrowUp" size={14} /></button>
                                <div />
                                <button onClick={() => panCamera('left')} className="p-2 bg-amber-800 text-white rounded-lg active:scale-95 shadow-sm"><Icon name="ArrowLeft" size={14} /></button>
                                <button onClick={() => panCamera('reset')} title="視角歸位" className="p-2 bg-paper border border-borderwood text-amber-900 rounded-lg active:scale-95"><Icon name="RotateCcw" size={14} /></button>
                                <button onClick={() => panCamera('right')} className="p-2 bg-amber-800 text-white rounded-lg active:scale-95 shadow-sm"><Icon name="ArrowRight" size={14} /></button>
                                <div />
                                <button onClick={() => panCamera('down')} className="p-2 bg-amber-800 text-white rounded-lg active:scale-95 shadow-sm"><Icon name="ArrowDown" size={14} /></button>
                                <div />
                            </div>
                            <div className="flex gap-1.5 pt-1 border-t border-borderwood/60 w-full justify-center">
                                <button onClick={() => panCamera('zoomIn')} className="flex-1 py-1.5 bg-paper border border-borderwood text-amber-900 font-bold rounded-lg text-xs flex items-center justify-center gap-1 active:scale-95">
                                    <Icon name="ZoomIn" size={14} /> 放大
                                </button>
                                <button onClick={() => panCamera('zoomOut')} className="flex-1 py-1.5 bg-paper border border-borderwood text-amber-900 font-bold rounded-lg text-xs flex items-center justify-center gap-1 active:scale-95">
                                    <Icon name="ZoomOut" size={14} /> 縮小
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
            );
        };

        function App() {
            const [warehouses, setWarehouses] = useState(() => {
                const saved = loadStorage('lapen_warehouses_v3', null);
                return (Array.isArray(saved) && saved.length > 0) ? deduplicateWarehouses(saved) : deduplicateWarehouses(INITIAL_WAREHOUSES);
            });

            const [bookOverrides, setBookOverrides] = useState(() => {
                return loadStorage('lapen_book_overrides_v3', {});
            });

            const [books, setBooks] = useState(INITIAL_BOOKS);

            const [activeWarehouseId, setActiveWarehouseId] = useState('WH-A');
            const [selectedShelf, setSelectedShelf] = useState(null);
            const [selectedDecor, setSelectedDecor] = useState(null);
            const [highlightedLocation, setHighlightedLocation] = useState(null);
            const [viewMode, setViewMode] = useState('3D');

            const [isLeftSidebarOpen, setIsLeftSidebarOpen] = useState(true);
            const [isPanelMinimized, setIsPanelMinimized] = useState(false);

            const [searchQuery, setSearchQuery] = useState('');
            const [selectedCategory, setSelectedCategory] = useState('全部');
            const [selectedWarehouseFilter, setSelectedCategoryWarehouseFilter] = useState('ALL');
            const [sortBy, setSortBy] = useState('code_asc');

            const [isCsvModalOpen, setIsCsvModalOpen] = useState(false);
            const [csvTab, setCsvTab] = useState('GOOGLE_SHEETS');
            const [googleSheetUrl, setGoogleSheetUrl] = useState('https://docs.google.com/spreadsheets/d/1WB8sWMkP-6RH23lUvP-JUl7JnzxSQKzkszGUzh4XS6s/edit?usp=drivesdk');
            const [isSyncingSheets, setIsSyncingSheets] = useState(false);

            const [isPrintModalOpen, setIsPrintModalOpen] = useState(false);
            const [isAddShelfModalOpen, setIsAddShelfModalOpen] = useState(false);
            const [isAddDecorModalOpen, setIsAddDecorModalOpen] = useState(false);
            const [isAddWarehouseModalOpen, setIsAddWarehouseModalOpen] = useState(false);
            const [isEditWarehouseModalOpen, setIsEditWarehouseModalOpen] = useState(false);
            const [isAssignBookModalOpen, setIsAssignBookModalOpen] = useState(false);
            const [assignBookId, setAssignBookId] = useState('');
            const [assignBookTier, setAssignBookTier] = useState(1);
            const [assignBookSearch, setAssignBookSearch] = useState('');
            const [csvText, setCsvText] = useState('');
            const [toastMessage, setToastMessage] = useState(null);

            const [confirmDialog, setConfirmDialog] = useState({
                isOpen: false,
                title: '',
                message: '',
                onConfirm: null
            });

            const [mobileTab, setMobileTab] = useState('POS');
            const cloudSyncTimer = useRef(null);

            const activeWarehouse = useMemo(() => {
                if (!warehouses || warehouses.length === 0) return INITIAL_WAREHOUSES[0];
                const cleanActiveId = cleanCodeStr(activeWarehouseId);
                const found = warehouses.find(w => 
                    w.id === activeWarehouseId || 
                    w.code === activeWarehouseId || 
                    (cleanActiveId && (cleanCodeStr(w.id) === cleanActiveId || cleanCodeStr(w.code) === cleanActiveId))
                );
                return found || warehouses[0];
            }, [warehouses, activeWarehouseId]);

            useEffect(() => {
                if (activeWarehouse && activeWarehouse.id && activeWarehouseId !== activeWarehouse.id) {
                    setActiveWarehouseId(activeWarehouse.id);
                }
            }, [activeWarehouse, activeWarehouseId]);

            const showToast = (msg) => {
                setToastMessage(msg);
                setTimeout(() => setToastMessage(null), 3800);
            };

            const maxX = useMemo(() => Math.max(1, Math.round((activeWarehouse.width / 2) * 10) / 10), [activeWarehouse.width]);
            const minX = useMemo(() => -maxX, [maxX]);
            const maxZ = useMemo(() => Math.max(1, Math.round((activeWarehouse.depth / 2) * 10) / 10), [activeWarehouse.depth]);
            const minZ = useMemo(() => -maxZ, [maxZ]);

            const persistWarehouses = useCallback((newWhs, syncToCloud = true) => {
                const cleanWhs = deduplicateWarehouses(newWhs);
                setWarehouses(cleanWhs);
                saveStorage('lapen_warehouses_v3', cleanWhs);
                if (syncToCloud) {
                    if (cloudSyncTimer.current) clearTimeout(cloudSyncTimer.current);
                    cloudSyncTimer.current = setTimeout(() => {
                        syncWithGAS("SYNC_WAREHOUSES", { warehouses: cleanWhs });
                    }, 2000);
                }
            }, []);

            const handleUpdateShelf = useCallback((updatedShelf) => {
                if (!updatedShelf || !activeWarehouse) return;
                const targetWhId = activeWarehouse.id;

                const cleanShelf = {
                    ...updatedShelf,
                    tiers: Math.max(2, Math.min(8, parseInt(updatedShelf.tiers, 10) || parseInt(updatedShelf.tier, 10) || 4)),
                    x: Math.round((parseFloat(updatedShelf.x) || 0) * 10) / 10,
                    z: Math.round((parseFloat(updatedShelf.z) || 0) * 10) / 10,
                    rot: Math.round((parseInt(updatedShelf.rot, 10) || 0) % 360)
                };

                setSelectedShelf(cleanShelf);

                setWarehouses(prevWhs => {
                    const updatedWhs = prevWhs.map(wh => {
                        const isTarget = wh.id === targetWhId || wh.code === targetWhId;
                        if (!isTarget) return wh;
                        return {
                            ...wh,
                            shelves: (wh.shelves || []).map(s => {
                                const isMatch = (s.id && cleanShelf.id && s.id === cleanShelf.id);
                                return isMatch ? { ...s, ...cleanShelf } : s;
                            })
                        };
                    });

                    const dedupped = deduplicateWarehouses(updatedWhs);
                    saveStorage('lapen_warehouses_v3', dedupped);
                    return dedupped;
                });
            }, [activeWarehouse]);

            const handleUpdateDecor = useCallback((updatedDecor) => {
                if (!updatedDecor || !activeWarehouse) return;
                const targetWhId = activeWarehouse.id;

                const cleanDecor = {
                    ...updatedDecor,
                    x: Math.round((parseFloat(updatedDecor.x) || 0) * 10) / 10,
                    z: Math.round((parseFloat(updatedDecor.z) || 0) * 10) / 10,
                    rot: Math.round((parseInt(updatedDecor.rot, 10) || 0) % 360)
                };

                setSelectedDecor(cleanDecor);

                setWarehouses(prevWhs => {
                    const updatedWhs = prevWhs.map(wh => {
                        const isTarget = wh.id === targetWhId || wh.code === targetWhId;
                        if (!isTarget) return wh;
                        return {
                            ...wh,
                            decors: (wh.decors || []).map(d => {
                                const isMatch = (d.id && cleanDecor.id && d.id === cleanDecor.id);
                                return isMatch ? { ...d, ...cleanDecor } : d;
                            })
                        };
                    });

                    const dedupped = deduplicateWarehouses(updatedWhs);
                    saveStorage('lapen_warehouses_v3', dedupped);
                    return dedupped;
                });
            }, [activeWarehouse]);

            const shiftObjectPos = (dx, dz) => {
                if (selectedShelf) {
                    const nextX = Math.max(minX, Math.min(maxX, Math.round(((parseFloat(selectedShelf.x) || 0) + dx) * 10) / 10));
                    const nextZ = Math.max(minZ, Math.min(maxZ, Math.round(((parseFloat(selectedShelf.z) || 0) + dz) * 10) / 10));
                    handleUpdateShelf({ ...selectedShelf, x: nextX, z: nextZ });
                } else if (selectedDecor) {
                    const nextX = Math.max(minX, Math.min(maxX, Math.round(((parseFloat(selectedDecor.x) || 0) + dx) * 10) / 10));
                    const nextZ = Math.max(minZ, Math.min(maxZ, Math.round(((parseFloat(selectedDecor.z) || 0) + dz) * 10) / 10));
                    handleUpdateDecor({ ...selectedDecor, x: nextX, z: nextZ });
                }
            };

            const updateObjectRot = (deg) => {
                const cleanDeg = (parseInt(deg, 10) || 0) % 360;
                const finalDeg = cleanDeg < 0 ? cleanDeg + 360 : cleanDeg;
                if (selectedShelf) {
                    handleUpdateShelf({ ...selectedShelf, rot: finalDeg });
                } else if (selectedDecor) {
                    handleUpdateDecor({ ...selectedDecor, rot: finalDeg });
                }
            };

            const handleAddDecor = (e) => {
                e.preventDefault();
                const formData = new FormData(e.currentTarget);
                const type = formData.get('type') || 'desk';
                const name = formData.get('name') || '新擺設軟裝';
                const color = formData.get('color') || '#8C5A2B';
                const width = parseFloat(formData.get('width')) || 2.0;
                const depth = parseFloat(formData.get('depth')) || 1.0;
                const height = parseFloat(formData.get('height')) || 1.0;

                const newDecor = {
                    id: `DEC-${Date.now().toString().slice(-6)}`,
                    type,
                    name,
                    x: 0,
                    z: 0,
                    rot: 0,
                    width,
                    depth,
                    height,
                    color
                };

                const updatedWhs = warehouses.map(wh => {
                    if (wh.id !== activeWarehouse.id && wh.code !== activeWarehouse.code) return wh;
                    return { ...wh, decors: [...(wh.decors || []), newDecor] };
                });

                setSelectedDecor(newDecor);
                setSelectedShelf(null);
                persistWarehouses(updatedWhs, true);
                setIsAddDecorModalOpen(false);
                showToast(`已成功新增軟裝/家具【${name}】！可在右側微調`);
            };

            const confirmDeleteDecor = (decorId) => {
                setConfirmDialog({
                    isOpen: true,
                    title: "確定刪除此軟裝擺設？",
                    message: "刪除後此家具物件將從 3D 倉庫空間中移除。",
                    onConfirm: () => {
                        const updatedWhs = warehouses.map(wh => {
                            if (wh.id !== activeWarehouse.id && wh.code !== activeWarehouse.code) return wh;
                            return { ...wh, decors: (wh.decors || []).filter(d => d.id !== decorId) };
                        });

                        persistWarehouses(updatedWhs, true);
                        setSelectedDecor(null);
                        setConfirmDialog({ isOpen: false, title: '', message: '', onConfirm: null });
                        showToast("🗑️ 已成功移除該家具軟裝物件！");
                    }
                });
            };

            const handleSyncFromGoogleSheets = async (showSuccessToast = true, forceFetchWarehouses = false) => {
                setIsSyncingSheets(true);
                if (showSuccessToast) showToast("正在從 Google 試算表同步資料...");

                try {
                    const whRes = await syncWithGAS('FETCH_WAREHOUSES');
                    let currentWhs = warehouses;

                    if (whRes && whRes.status === 'success' && Array.isArray(whRes.data) && whRes.data.length > 0) {
                        currentWhs = deduplicateWarehouses(whRes.data);
                        persistWarehouses(currentWhs, false);
                    } else {
                        const savedWhs = loadStorage('lapen_warehouses_v3', null);
                        if (Array.isArray(savedWhs) && savedWhs.length > 0) {
                            currentWhs = deduplicateWarehouses(savedWhs);
                        }
                    }

                    const bkRes = await syncWithGAS('FETCH_BOOKS');
                    if (bkRes && bkRes.status === 'success' && Array.isArray(bkRes.data) && bkRes.data.length > 0) {
                        const overrides = loadStorage('lapen_book_overrides_v3', {});

                        const parsedBooks = bkRes.data.map(b => {
                            const parsedLoc = parseBookLocation(b, currentWhs);
                            const localOverride = overrides[b.id] || overrides[b.code];

                            return {
                                ...b,
                                code: b.isbn || b.code || b.id,
                                warehouseId: localOverride ? localOverride.warehouseId : parsedLoc.warehouseId,
                                shelfId: localOverride ? localOverride.shelfId : parsedLoc.shelfId,
                                tier: localOverride ? localOverride.tier : parsedLoc.tier
                            };
                        });
                        parsedBooks.sort((a, b) => (a.code || '').localeCompare(b.code || '', undefined, { numeric: true }));
                        setBooks(parsedBooks);
                        if (showSuccessToast) showToast(`⚡ 成功同步！已載入 ${parsedBooks.length} 本圖書與最新倉庫擺設！`);
                    } else if (showSuccessToast) {
                        showToast("雲端同步已完成！");
                    }
                } catch (err) {
                    if (showSuccessToast) showToast("雲端同步出現狀況，已載入本機快取資料。");
                } finally {
                    setIsSyncingSheets(false);
                }
            };

            const handleClearLocalCache = () => {
                setConfirmDialog({
                    isOpen: true,
                    title: "確定清除 Edge 本機舊暫存？",
                    message: "這將清除 Edge 瀏覽器內殘留的舊數據，並強制重新從 Google 試算表下載最新的圖書與倉庫軟裝擺設！",
                    onConfirm: async () => {
                        localStorage.removeItem('lapen_warehouses_v3');
                        localStorage.removeItem('lapen_book_overrides_v3');
                        setConfirmDialog({ isOpen: false, title: '', message: '', onConfirm: null });
                        showToast("🧹 已清除 Edge 本機暫存！正在向雲端抓取最新資料...");
                        await handleSyncFromGoogleSheets(true, true);
                    }
                });
            };

            const handlePushWarehousesToCloud = async () => {
                setIsSyncingSheets(true);
                showToast("正在將當前 3D 書架與家具擺設同步上傳至 Google 試算表...");
                try {
                    const res = await syncWithGAS("SYNC_WAREHOUSES", { warehouses });
                    if (res && res.status === 'success') {
                        showToast("✅ 成功將當前 3D 書架與軟裝座標同步儲存至 Google 試算表！");
                    } else {
                        showToast("已儲存於本機！雲端回應：" + (res?.msg || "已發送更新"));
                    }
                } catch (e) {
                    showToast("已儲存於本機！（雲端連線失敗）");
                } finally {
                    setIsSyncingSheets(false);
                }
            };

            const handleFileUpload = (e) => {
                const file = e.target.files[0];
                if (!file) return;

                const reader = new FileReader();
                reader.onload = (event) => {
                    const text = event.target.result;
                    setCsvText(text);
                    showToast("已載入 CSV 檔案！");
                };
                reader.readAsText(file);
            };

            useEffect(() => {
                handleSyncFromGoogleSheets(false, false);

                const handleVisibilityChange = () => {
                    if (document.visibilityState === 'visible') {
                        handleSyncFromGoogleSheets(false, false);
                    }
                };

                document.addEventListener('visibilitychange', handleVisibilityChange);
                return () => {
                    document.removeEventListener('visibilitychange', handleVisibilityChange);
                };
            }, []);

            const categories = useMemo(() => {
                const set = new Set(books.map(b => b.category).filter(Boolean));
                return ['全部', ...Array.from(set)];
            }, [books]);

            const filteredBooks = useMemo(() => {
                let list = books.filter(b => {
                    let matchWh = true;
                    if (selectedWarehouseFilter === 'CURRENT') {
                        matchWh = b.warehouseId === activeWarehouse.id;
                    } else if (selectedWarehouseFilter === 'UNASSIGNED') {
                        matchWh = !b.warehouseId || b.warehouseId === '';
                    } else if (selectedWarehouseFilter !== 'ALL') {
                        matchWh = b.warehouseId === selectedWarehouseFilter;
                    }

                    const matchCat = selectedCategory === '全部' || b.category === selectedCategory;
                    const q = searchQuery.toLowerCase().trim();
                    const matchQ = !q || (
                        (b.title && b.title.toLowerCase().includes(q)) ||
                        (b.author && b.author.toLowerCase().includes(q)) ||
                        (b.code && b.code.toLowerCase().includes(q)) ||
                        (b.category && b.category.toLowerCase().includes(q))
                    );
                    return matchWh && matchCat && matchQ;
                });

                if (sortBy === 'code_asc') {
                    list.sort((a, b) => (a.code || '').localeCompare(b.code || '', undefined, { numeric: true }));
                } else if (sortBy === 'code_desc') {
                    list.sort((a, b) => (b.code || '').localeCompare(a.code || '', undefined, { numeric: true }));
                } else if (sortBy === 'title') {
                    list.sort((a, b) => (a.title || '').localeCompare(b.title || '', 'zh-Hant'));
                } else if (sortBy === 'category') {
                    list.sort((a, b) => (a.category || '').localeCompare(b.category || '', 'zh-Hant'));
                }

                return list;
            }, [books, activeWarehouse.id, selectedWarehouseFilter, selectedCategory, searchQuery, sortBy]);

            const assignBookFilteredList = useMemo(() => {
                const searchStr = assignBookSearch.toLowerCase().trim();
                return books.filter(b => {
                    if (!searchStr) return true;
                    const cleanTitle = (b.title || '').replace(/\uFFFD/g, '').toLowerCase();
                    const cleanAuthor = (b.author || '').replace(/\uFFFD/g, '').toLowerCase();
                    const cleanCode = (b.code || '').toLowerCase();
                    return cleanTitle.includes(searchStr) || cleanAuthor.includes(searchStr) || cleanCode.includes(searchStr);
                });
            }, [books, assignBookSearch]);

            useEffect(() => {
                if (isAssignBookModalOpen && assignBookFilteredList.length > 0) {
                    if (!assignBookId || !assignBookFilteredList.some(b => b.id === assignBookId)) {
                        setAssignBookId(assignBookFilteredList[0].id);
                    }
                }
            }, [isAssignBookModalOpen, assignBookFilteredList, assignBookId]);

            const handleLocateBook = (book) => {
                const { wh, sh, isAssigned } = getBookLocationInfo(book, warehouses);

                if (!isAssigned) {

                    showToast(`已自動切換視角至【${wh.name}】！`);

                setHighlightedLocation({
                    warehouseId: wh ? wh.id : book.warehouseId,
                    shelfId: sh ? sh.id : book.shelfId,
                    tier: book.tier
                });

                if (sh) setSelectedShelf(sh);
                setSelectedDecor(null);
                showToast(`已 3D 聚焦至《${book.title}》位置：${wh ? wh.code : ''} - ${sh ? sh.code : '書架'} 第 ${book.tier || 1} 層`);
            };

            const handleAddWarehouse = (e) => {
                e.preventDefault();
                const formData = new FormData(e.currentTarget);
                const newWhId = `WH-${Date.now().toString().slice(-4)}`;
                const newWhCode = (formData.get('code') || '').toUpperCase().trim();
                const newWhName = (formData.get('name') || '').trim();
                const newWhAddress = (formData.get('address') || '').trim() || '台北市中正區';
                const wallColor = formData.get('wallColor') || '#E6D5C3';
                const width = parseFloat(formData.get('width')) || 24;
                const depth = parseFloat(formData.get('depth')) || 18;
                const height = parseFloat(formData.get('height')) || 4.5;

                const defaultShelves = [
                    { id: `SH-${newWhId}-01`, code: `${newWhCode.slice(0, 1)}1架`, name: '主要典藏特區架', x: -Math.floor(width/4), z: -Math.floor(depth/4), rot: 0, width: 3.2, depth: 0.9, tiers: 5, category: '綜合學術', color: '#8C5A2B' },
                    { id: `SH-${newWhId}-02`, code: `${newWhCode.slice(0, 1)}2架`, name: '新品與熱銷待揀貨架', x: Math.floor(width/4), z: Math.floor(depth/4), rot: 0, width: 3.2, depth: 0.9, tiers: 5, category: '暢銷綜合', color: '#6A432D' },
                ];

                const defaultDecors = [
                    { id: `DEC-${newWhId}-01`, type: 'desk', name: '理書管理桌', x: -Math.floor(width/3), z: Math.floor(depth/3), rot: 0, width: 2.2, depth: 1.0, height: 0.9, color: '#8C5A2B' }
                ];

                const newWarehouse = {
                    id: newWhId,
                    name: newWhName,
                    code: newWhCode,
                    address: newWhAddress,
                    width,
                    depth,
                    height,
                    wallColor,
                    shelves: defaultShelves,
                    decors: defaultDecors
                };

                const updatedWhs = [...warehouses, newWarehouse];
                persistWarehouses(updatedWhs, true);

                setActiveWarehouseId(newWhId);
                setSelectedShelf(null);
                setSelectedDecor(null);
                setHighlightedLocation(null);
                setIsAddWarehouseModalOpen(false);
                showToast(`成功建立新倉庫：${newWhName} (${newWhCode})！`);
            };

            const handleEditWarehouse = (e) => {
                e.preventDefault();
                const formData = new FormData(e.currentTarget);
                const newCode = (formData.get('code') || '').toUpperCase().trim();
                const name = (formData.get('name') || '').trim();
                const address = (formData.get('address') || '').trim();
                const wallColor = formData.get('wallColor') || activeWarehouse.wallColor || '#E6D5C3';
                const width = parseFloat(formData.get('width')) || 24;
                const depth = parseFloat(formData.get('depth')) || 18;
                const height = parseFloat(formData.get('height')) || 4.5;

                const updatedWhs = warehouses.map(w => {
                    if (w.id === activeWarehouse.id || w.code === activeWarehouse.code) {
                        return {
                            ...w,
                            code: newCode || w.code,
                            name: name || w.name,
                            address: address || w.address,
                            wallColor,
                            width,
                            depth,
                            height
                        };
                    }
                    return w;
                });

                persistWarehouses(updatedWhs, true);
                setIsEditWarehouseModalOpen(false);
                showToast(`成功更新倉庫【${newCode || activeWarehouse.code}】尺寸與牆面裝飾色彩！`);
            };

            const confirmDeleteWarehouse = (whId) => {
                if (warehouses.length <= 1) {
                    return showToast("⚠️ 系統至少需保留一個倉庫，無法刪除唯一倉庫！");
                }
                const targetWh = warehouses.find(w => w.id === whId);
                
                setConfirmDialog({
                    isOpen: true,
                    title: `確定刪除倉庫【${targetWh?.name || whId}】？`,
                    message: "刪除後該倉庫對應的書架與排架資訊將全數移除！此動作無法復原。",
                    onConfirm: () => {
                        const updatedWhs = warehouses.filter(w => w.id !== whId);
                        persistWarehouses(updatedWhs, true);

                        const nextWh = updatedWhs[0];
                        setActiveWarehouseId(nextWh.id);
                        setSelectedShelf(null);
                        setSelectedDecor(null);
                        setHighlightedLocation(null);
                        setIsEditWarehouseModalOpen(false);
                        setConfirmDialog({ isOpen: false, title: '', message: '', onConfirm: null });
                        showToast(`🗑️ 已成功刪除倉庫！已自動切換至【${nextWh.name}】`);
                    }
                });
            };

            const handleClosePanel = () => {
                persistWarehouses(warehouses, true);
                setSelectedShelf(null);
                setSelectedDecor(null);
                setHighlightedLocation(null);
                showToast("✅ 已關閉並儲存當前倉庫與軟裝擺設！");
            };

            const handleAddShelf = (e) => {
                e.preventDefault();
                const formData = new FormData(e.currentTarget);
                
                const width = parseFloat(formData.get('width')) || 3.0;
                const depth = parseFloat(formData.get('depth')) || 0.9;
                
                let inputX = parseFloat(formData.get('x'));
                let inputZ = parseFloat(formData.get('z'));
                if (isNaN(inputX)) inputX = 0;
                if (isNaN(inputZ)) inputZ = 0;

                const existingShelves = activeWarehouse.shelves || [];
                const maxWhW = (activeWarehouse.width / 2) - 1;
                const maxWhD = (activeWarehouse.depth / 2) - 1;

                inputX = Math.max(-maxWhW, Math.min(maxWhW, inputX));
                inputZ = Math.max(-maxWhD, Math.min(maxWhD, inputZ));

                const uniqueShelfId = `SH-${Date.now().toString().slice(-6)}`;
                const newShelf = {
                    id: uniqueShelfId,
                    code: formData.get('code') || `A${existingShelves.length + 1}架`,
                    name: formData.get('name') || '新增書架',
                    x: Math.round(inputX * 10) / 10,
                    z: Math.round(inputZ * 10) / 10,
                    rot: parseInt(formData.get('rot'), 10) || 0,
                    width,
                    depth,
                    tiers: Math.max(2, Math.min(8, parseInt(formData.get('tiers'), 10) || 5)),
                    category: formData.get('category') || '通用',
                    color: '#8C5A2B'
                };

                const updatedWhs = warehouses.map(wh => {
                    if (wh.id !== activeWarehouse.id && wh.code !== activeWarehouse.code) return wh;
                    return { ...wh, shelves: [...(wh.shelves || []), newShelf] };
                });

                setSelectedShelf(newShelf);
                setSelectedDecor(null);
                persistWarehouses(updatedWhs, true);
                setIsAddShelfModalOpen(false);
                setIsPanelMinimized(false);
                setHighlightedLocation(null);

                showToast(`成功新增書架：${newShelf.code} (${newShelf.name})！`);
            };

            const confirmDeleteShelf = (shelfId) => {
                setConfirmDialog({
                    isOpen: true,
                    title: "確定刪除此 3D 書架？",
                    message: "放置於此書架之書籍儲位將變更為待上架/未排架。",
                    onConfirm: () => {
                        const updatedWhs = warehouses.map(wh => {
                            if (wh.id !== activeWarehouse.id && wh.code !== activeWarehouse.code) return wh;
                            return { ...wh, shelves: wh.shelves.filter(s => s.id !== shelfId) };
                        });

                        persistWarehouses(updatedWhs, true);
                        setBooks(prev => prev.map(b => b.shelfId === shelfId ? { ...b, warehouseId: '', shelfId: '' } : b));
                        setSelectedShelf(null);
                        setHighlightedLocation(null);
                        setConfirmDialog({ isOpen: false, title: '', message: '', onConfirm: null });
                        showToast("已刪除書架，原書架書籍已移至待上架清單。");
                    }
                });
            };

            const handleAssignBookToShelf = (e) => {
                e.preventDefault();
                if (!assignBookId || !selectedShelf) return showToast("請選擇欲放入的圖書！");

                const targetBook = books.find(b => b.id === assignBookId);
                const tierNum = parseInt(assignBookTier, 10) || 1;

                setBooks(prev => prev.map(b => {
                    if (b.id === assignBookId) {
                        return {
                            ...b,
                            warehouseId: activeWarehouse.id,
                            shelfId: selectedShelf.id,
                            tier: tierNum
                        };
                    }
                    return b;
                }));

                const newOverrides = {
                    ...bookOverrides,
                    [assignBookId]: { warehouseId: activeWarehouse.id, shelfId: selectedShelf.id, tier: tierNum }
                };
                setBookOverrides(newOverrides);
                saveStorage('lapen_book_overrides_v3', newOverrides);

                const locationStr = `${activeWarehouse.name} (${activeWarehouse.code}) [${activeWarehouse.id}] | ${selectedShelf.name} (${selectedShelf.code}) [${selectedShelf.id}] | 第 ${tierNum} 層`;
                showToast(`已成功將《${targetBook ? targetBook.title : ''}》放入 ${selectedShelf.code} 第 ${tierNum} 層！`);
                
                syncWithGAS("UPDATE_BOOK_LOCATION", {
                    bookId: assignBookId,
                    bookTitle: targetBook ? targetBook.title : "",
                    locationStr: locationStr
                });

                setIsAssignBookModalOpen(false);
                setAssignBookId('');
            };

            const handleRemoveBookFromShelf = (bookId) => {
                const targetBook = books.find(b => b.id === bookId);
                setBooks(prev => prev.map(b => b.id === bookId ? { ...b, warehouseId: '', shelfId: '', tier: 1 } : b));

                const newOverrides = { ...bookOverrides };
                delete newOverrides[bookId];
                setBookOverrides(newOverrides);
                saveStorage('lapen_book_overrides_v3', newOverrides);

                showToast("已將圖書移出此書架（變更為待入庫）。");

                syncWithGAS("UPDATE_BOOK_LOCATION", {
                    bookId: bookId,
                    bookTitle: targetBook ? targetBook.title : "",
                    locationStr: "未排架/待入庫"
                });
            };

            const handleChangeBookTier = (bookId, newTier) => {
                const targetBook = books.find(b => b.id === bookId);
                const tierNum = parseInt(newTier, 10) || 1;

                setBooks(prev => prev.map(b => b.id === bookId ? { ...b, tier: tierNum } : b));

                const newOverrides = {
                    ...bookOverrides,
                    [bookId]: { warehouseId: targetBook.warehouseId, shelfId: targetBook.shelfId, tier: tierNum }
                };
                setBookOverrides(newOverrides);
                saveStorage('lapen_book_overrides_v3', newOverrides);

                showToast(`已調整圖書儲位至第 ${tierNum} 層。`);

                const locationStr = `${activeWarehouse.name} (${activeWarehouse.code}) [${activeWarehouse.id}] | ${selectedShelf.name} (${selectedShelf.code}) [${selectedShelf.id}] | 第 ${tierNum} 層`;
                syncWithGAS("UPDATE_BOOK_LOCATION", {
                    bookId: bookId,
                    bookTitle: targetBook ? targetBook.title : "",
                    locationStr: locationStr
                });
            };

            return (
                <div className="flex flex-col h-screen w-screen overflow-hidden bg-cream font-sans">
                    {/* Header */}
                    <header className="h-16 border-b border-borderwood bg-white/80 backdrop-blur-md px-4 md:px-6 flex justify-between items-center z-20 shrink-0 shadow-sm">
                        <div className="flex items-center gap-3">
                            <button 
                                onClick={() => setIsLeftSidebarOpen(!isLeftSidebarOpen)} 
                                className="p-2 rounded-xl bg-paper border border-borderwood text-amber-900 hover:bg-amber-800 hover:text-white transition"
                                title={isLeftSidebarOpen ? "收折左側欄位" : "展開左側圖書索引"}
                            >
                                <Icon name={isLeftSidebarOpen ? "ChevronLeft" : "Menu"} size={18} />
                            </button>
                            <div className="w-8 h-8 md:w-9 md:h-9 bg-amber-800 rounded-xl flex items-center justify-center text-white font-serif font-black text-lg md:text-xl shadow-md">
                                文
                            </div>
                            <div>
                                <h1 className="text-base md:text-xl font-black text-amber-900 font-serif-title tracking-wider">
                                    文史哲出版社有限公司
                                </h1>
                                <p className="hidden sm:block text-[10px] tracking-widest text-amber-800 font-bold uppercase">
                                    3D 多倉庫暨書架擺設與軟裝飾管理系統 (GAS 雲端雙向同步)
                                </p>
                            </div>

                            <Icon name="CheckCircle2" size={16} className="text-amber-400 shrink-0" />
                            <span>{toastMessage}</span>
                        </div>
                    )}
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
