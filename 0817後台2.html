            ShoppingCart: { icon: ShoppingCart, color: 'text-cyan-500' },
            FileText: { icon: FileText, color: 'text-amber-500' },

            ExternalLink: { icon: ExternalLink, color: 'opacity-70' }
        };

        const GAS_URL = "https://script.google.com/macros/s/AKfycby8wbBkSBv50d1K1RW98_Fwk9E4Ld7WavjetW47IN-RPtJEdaeDJs3WKXrl0nRUsPVr/exec";

        const formatImageUrl = (url) => {
            const transparentFallback = 'data:image/gif;base64,R0lGODlhAQABAAD/ACwAAAAAAQABAAACADs=';
            if (!url) return transparentFallback;
            let strUrl = String(url).trim();
            if (!strUrl || strUrl === '') return transparentFallback;
            if (strUrl.startsWith('data:image')) return strUrl;
            
            let driveId = null;
            if (strUrl.includes('drive.google.com')) {
                const match = strUrl.match(/\/d\/([a-zA-Z0-9_-]+)/) || strUrl.match(/id=([a-zA-Z0-9_-]+)/);
                if (match) driveId = match[1];
            } else if (/^[a-zA-Z0-9_-]{20,}$/.test(strUrl) && !strUrl.includes("/")) {
                driveId = strUrl;
            }

            if (driveId) {
                return `https://drive.google.com/thumbnail?id=${driveId}&sz=w1000`;
            }
            return strUrl;
        };

        const defaultSettings = {
            systemName: '文史哲出版社', systemSubName: 'Digital CMS', logoUrl: '', subLogoUrl: '', userAvatarUrl: '',
            adminPanelName: 'ADMIN PANEL', sidebarSubText: 'Digital CMS', onlineStatusText: 'Online',
            loginBgColor: '#09090b', loginCardBgColor: '#ffffff', loginTextColor: '#27272a',
            sidebarBgColor: '#09090b', sidebarActiveColor: '#4f46e5', sidebarTextColor: '#a1a1aa', sidebarUserColor: '#ffffff',
            adminPanelColor: '#a1a1aa', onlineStatusColor: '#34d399',
            mainBgColor: '#F4F4F5', mainTextColor: '#27272a', cardBgColor: '#ffffff', cardTextColor: '#3f3f46', kpiBgColor: '#ffffff',
            menuDashName: '營運分析中心', menuMarketingName: '行銷與推薦', menuBooksName: '總商品庫庫存',
            menuOrdersName: '銷售與物流', menuCsName: '智能客戶關係', menuExtName: '外部系統鏈接',
            menuNotesName: '工作記事本', menuAuditName: '異動履歷中心',
            menuDashIcon: 'LayoutDashboard', menuMarketingIcon: 'Sparkles', menuBooksIcon: 'Database',
            menuOrdersIcon: 'Truck', menuCsIcon: 'Bot', menuNotesIcon: 'FileText', menuAuditIcon: 'History', menuExtIcon: 'ExternalLink'
        };

        const defaultUI = {
            themeColor: '#8C5A2B', darkThemeColor: '#2C241B', lightBgColor: '#FDFBF7', bgLightColor: '#F9F6F0',
            textDarkColor: '#4A3728', borderColor: '#E6D5C3', accentColor: '#C4B29E', footerBgColor: '#1A1412',
            bodyFont: 'Noto Sans TC', titleFont: 'Noto Serif TC', frontendLogoUrl: '', frontendName: '文史哲出版社',
            menuAbout: '關於我們', menuPresident: '關於社長', menuContact: '聯繫我們', menuNewArrivals: '新書上市',
            menuSearch: '書籍檢索', menuCart: '我的書包', menuAdmin: '臉書(FB)入口',
            heroHeading1: '傳承千年智慧', heroHeading2: '點亮數位未來', heroSubheading: '致力於出版高品質文學、歷史、哲學著作。讓深厚底蘊更貼近當代讀者。'
        };

        function App() {
            const [isAuthenticated, setIsAuthenticated] = useState(() => sessionStorage.getItem('lapen_cms_auth') === 'true');
            const [sessionToken, setSessionToken] = useState(() => sessionStorage.getItem('lapen_cms_token') || '');
            const [activeUser, setActiveUser] = useState(() => sessionStorage.getItem('lapen_cms_user') || '');

            const [books, setBooks] = useState([]);
            const [choiceBooks, setChoiceBooks] = useState([]); 
            const [carousels, setCarousels] = useState([]);
            const [orders, setOrders] = useState([]); 
            const [aiLogs, setAiLogs] = useState([]); 
            const [kpis, setKpis] = useState([]); 
            const [notes, setNotes] = useState([]); 
            const [auditLogs, setAuditLogs] = useState([]);
            const [settings, setSettings] = useState(defaultSettings); 
            const [ui, setUi] = useState(defaultUI); 
            
            const [activeTab, setActiveTab] = useState('dashboard');
            const [settingSubTab, setSettingSubTab] = useState('backend'); 
            const [isSidebarOpen, setIsSidebarOpen] = useState(true);
            const [notification, setNotification] = useState(null);
            const [bookSearchQuery, setBookSearchQuery] = useState('');
            const [auditSearchQuery, setAuditSearchQuery] = useState('');
            const [auditActionFilter, setAuditActionFilter] = useState('全部');
            const [adminVisibleCount, setAdminVisibleCount] = useState(20);

            const [isLoggingIn, setIsLoggingIn] = useState(false);
            const [loadStatus, setLoadStatus] = useState({
                kpis: true, orders: true, cs: true, carousels: true, choices: true, books: true, notes: true, audit: true
            });

            const [modalMaximized, setModalMaximized] = useState({});
            const toggleMaximize = (key) => setModalMaximized(prev => ({ ...prev, [key]: !prev[key] }));

            const [showBookModal, setShowBookModal] = useState(false);
            const [editingBook, setEditingBook] = useState(null);
            const [modalType, setModalType] = useState('book');
            const [showCarouselModal, setShowCarouselModal] = useState(false);
            const [editingCarousel, setEditingCarousel] = useState(null);
            const [showOrderModal, setShowOrderModal] = useState(false);
            const [editingOrder, setEditingOrder] = useState(null);
            const [showCSModal, setShowCSModal] = useState(false);
            const [editingCSLog, setEditingCSLog] = useState(null);
            const [csResponseText, setCsResponseText] = useState('');
            const [isAIGenerating, setIsAIGenerating] = useState(false);

            const [showNoteModal, setShowNoteModal] = useState(false);
            const [editingNote, setEditingNote] = useState(null);
            const [noteSearchQuery, setNoteSearchQuery] = useState('');
            const [noteCategoryFilter, setNoteCategoryFilter] = useState('全部');
            
            const [modalBookTitle, setModalBookTitle] = useState('');
            const [modalBookAuthor, setModalBookAuthor] = useState('');
            const [modalBookYear, setModalBookYear] = useState('');
            const [modalBookCategory, setModalBookCategory] = useState('');
            const [modalBookIntro, setModalBookIntro] = useState('');
            const [modalBookReview, setModalBookReview] = useState('');
            const [isGeneratingBookAI, setIsGeneratingBookAI] = useState(false);

            const [showKpiModal, setShowKpiModal] = useState(false);
            const [editingKpi, setEditingKpi] = useState(null);
            const [selectedKpiIcon, setSelectedKpiIcon] = useState('TrendingUp'); 
            const [iframeModal, setIframeModal] = useState({ isOpen: false, url: '', title: '' });

            const [deleteModal, setDeleteModal] = useState({
                isOpen: false, type: '', id: null, title: '', isDeleting: false
            });

            const [expandedMenus, setExpandedMenus] = useState({
                group_dash: true, group_marketing: false, group_books: false, group_orders: false, group_cs: false, group_notes: false, group_audit: false, group_external: false, group_settings: false
            });

            const toggleMenu = (menuId) => setExpandedMenus(prev => ({ ...prev, [menuId]: !prev[menuId] }));

            const showMsg = (text) => {
                setNotification(text);
                setTimeout(() => setNotification(null), 3500);
            };

            const formatDate = (dateStr) => {
                if (!dateStr) return '-';
                const d = new Date(dateStr);
                if (isNaN(d.getTime())) return String(dateStr); 
                const yyyy = d.getFullYear(); const mm = String(d.getMonth() + 1).padStart(2, '0'); const dd = String(d.getDate()).padStart(2, '0');
                const hh = String(d.getHours()).padStart(2, '0'); const min = String(d.getMinutes()).padStart(2, '0');
                if (yyyy === 1899) return `${hh}:${min}`;
                return hh === '00' && min === '00' ? `${yyyy}/${mm}/${dd}` : `${yyyy}/${mm}/${dd} ${hh}:${min}`;
            };

            useEffect(() => {
                if (showBookModal) {
                    setModalBookTitle(editingBook?.title || '');
                    setModalBookAuthor(editingBook?.author || '');
                    setModalBookYear(editingBook?.year || '');
                    setModalBookCategory(editingBook?.category || '');
                    setModalBookIntro(editingBook?.intro || '');
                    setModalBookReview(editingBook?.["心得"] || editingBook?.review || editingBook?.notes || '');
                }
            }, [showBookModal, editingBook]);

            const syncWithGAS = async (action, payloadData = null) => {
                try {
                    const currentOrigin = window.location.origin;
                    const safeOrigin = currentOrigin.includes("usercontent.goog") 
                        ? "https://candylovema.github.io" 
                        : currentOrigin;

                    const payloadObj = { 
                        action: action, 
                        payload: payloadData,
                        origin: safeOrigin,
                        sessionToken: sessionToken
                    };

                    const params = new URLSearchParams();
                    params.append("action", action);
                    if (sessionToken) params.append("sessionToken", sessionToken);
                    params.append("origin", safeOrigin);

                    let payloadStr = "";
                    if (payloadData !== null && payloadData !== undefined) {
                        payloadStr = typeof payloadData === "string" ? payloadData : JSON.stringify(payloadData);
                        if (payloadStr.length < 2000) {
                            params.append("payload", payloadStr);
                        }
                    }

                    const requestUrl = `${GAS_URL}?${params.toString()}`;

                    let response = await fetch(requestUrl, {
                        method: "POST",
                        headers: { "Content-Type": "text/plain;charset=utf-8" },
                        body: JSON.stringify(payloadObj)
                    });
                    
                    let data = await response.json();
                    
                    if (data && data.status === 'error' && data.msg && data.msg.includes("Method Not Allowed")) {
                        const retryParams = new URLSearchParams();
                        retryParams.append("action", action);
                        if (sessionToken) retryParams.append("sessionToken", sessionToken);
                        retryParams.append("origin", safeOrigin);
                        if (payloadStr) retryParams.append("payload", payloadStr);

                        const retryUrl = `${GAS_URL}?${retryParams.toString()}`;
                        response = await fetch(retryUrl, { method: "GET" });
                        data = await response.json();
                    }

                    if (data && data.status === 'error') {
                        console.error("後端拒絕請求:", data.msg);
                        showMsg("拒絕存取: " + data.msg); 
                        if (data.msg.includes("驗證失敗") || data.msg.includes("未授權") || data.msg.includes("過期")) {
                            handleLogout();
                        }
                    }
                    
                    return data;
                } catch (e) {
                    console.error("GAS Sync Error:", e);
                    showMsg("網路安全通道異常: " + e.toString()); 
                    return { status: 'error', msg: e.toString() };
                }
            };

            const handleLogin = async (e) => {
                e.preventDefault();
                if (isLoggingIn) return;
                setIsLoggingIn(true);
                showMsg('正在向雲端安全性通道驗證身分...');

                const username = e.target.username.value;
                const password = e.target.password.value;

                try {
                    const res = await syncWithGAS('LOGIN', { user: username, password: password });
                    if (res && res.status === 'success' && res.sessionToken) {
                        sessionStorage.setItem('lapen_cms_auth', 'true');
                        sessionStorage.setItem('lapen_cms_token', res.sessionToken);
                        sessionStorage.setItem('lapen_cms_user', username);
                        
                        setIsAuthenticated(true);
                        setSessionToken(res.sessionToken);
                        setActiveUser(username);
                        showMsg('身分驗證通過， Session 令牌已安全儲存！');
                    } else {
                        showMsg('登入失敗：' + (res?.msg || '帳號或密碼錯誤'));
                    }
                } catch (err) {
                    showMsg('驗證發生異常：' + err.toString());
                } finally {
                    setIsLoggingIn(false);
                }
            };

            const handleLogout = () => {
                sessionStorage.clear();
                setIsAuthenticated(false);
                setSessionToken('');
                setActiveUser('');
                setBooks([]);
                setChoiceBooks([]);
                setCarousels([]);
                setOrders([]);
                setAiLogs([]);
                setNotes([]);
                setAuditLogs([]);
                showMsg('Session 令牌已安全銷毀，您已成功登出。');
            };

            useEffect(() => {
                if (!isAuthenticated || !sessionToken) return;

                syncWithGAS('FETCH_SETTINGS').then(res => { if (res?.data) setSettings(prev => ({...prev, ...res.data})); }).catch(() => {});
                syncWithGAS('FETCH_UI').then(res => { if (res?.data) setUi(res.data); }).catch(() => {});
                syncWithGAS('FETCH_KPIS').then(res => { if(res?.data) setKpis(res.data); setLoadStatus(prev => ({...prev, kpis: false})); }).catch(() => setLoadStatus(prev => ({...prev, kpis: false})));
                syncWithGAS('FETCH_ORDERS').then(res => { if(res?.data) setOrders(res.data); setLoadStatus(prev => ({...prev, orders: false})); }).catch(() => setLoadStatus(prev => ({...prev, orders: false})));
                syncWithGAS('FETCH_CS_LOGS').then(res => { if(res?.data) setAiLogs(res.data); setLoadStatus(prev => ({...prev, cs: false})); }).catch(() => setLoadStatus(prev => ({...prev, cs: false})));
                syncWithGAS('FETCH_CAROUSELS').then(res => { if(res?.data) setCarousels(res.data); setLoadStatus(prev => ({...prev, carousels: false})); }).catch(() => setLoadStatus(prev => ({...prev, carousels: false})));
                syncWithGAS('FETCH_CHOICES').then(res => { if(res?.data) setChoiceBooks(res.data); setLoadStatus(prev => ({...prev, choices: false})); }).catch(() => setLoadStatus(prev => ({...prev, choices: false})));
                syncWithGAS('FETCH_BOOKS').then(res => { if(res?.data) setBooks(res.data); setLoadStatus(prev => ({...prev, books: false})); }).catch(() => setLoadStatus(prev => ({...prev, books: false})));
                syncWithGAS('FETCH_NOTES').then(res => { if(res?.data) setNotes(res.data); setLoadStatus(prev => ({...prev, notes: false})); }).catch(() => setLoadStatus(prev => ({...prev, notes: false})));
                syncWithGAS('FETCH_AUDIT_LOGS').then(res => { if(res?.data) setAuditLogs(res.data); setLoadStatus(prev => ({...prev, audit: false})); }).catch(() => setLoadStatus(prev => ({...prev, audit: false})));
            }, [isAuthenticated, sessionToken]);

            const handleSaveBookDual = async (e) => {
                e.preventDefault();
                const formData = new FormData(e.target);
                const isNew = !editingBook;
                const bookData = {
                    id: editingBook?.id || 'BK-' + Date.now(),
                    title: sanitizeForSpreadsheet(formData.get('title')), 
                    category: sanitizeForSpreadsheet(formData.get('category')), 
                    price: parseInt(formData.get('price')) || 0, 
                    stock: parseInt(formData.get('stock')) || 0,
                    cover: sanitizeForSpreadsheet(formData.get('cover') || ''), 
                    author: sanitizeForSpreadsheet(formData.get('author') || ''), 
                    year: sanitizeForSpreadsheet(formData.get('year') || ''),
                    intro: sanitizeForSpreadsheet(modalBookIntro || formData.get('intro') || ''),
                    "心得": sanitizeForSpreadsheet(modalBookReview || formData.get('心得') || '')
                };

                let changeDetails = isNew 
                    ? `新增書籍: [${bookData.title}] (作者: ${bookData.author || '未填'}, 類別: ${bookData.category}, 定價: NT$${bookData.price}, 庫存: ${bookData.stock})` 
                    : `修改書籍: [${bookData.title}] - 類別: ${bookData.category}, 價格: NT$${bookData.price}, 庫存: ${bookData.stock}, 作者: ${bookData.author || '-'}`;

                showMsg('正在連動更新 Book_ALL 與 Choice 兩端資料，並寫入異動履歷...');

                // Local dual-sync update
                setBooks(prevBooks => {
                    const exists = prevBooks.some(b => String(b.id) === String(bookData.id) || b.title === bookData.title);
                    if (exists) {
                        return prevBooks.map(b => (String(b.id) === String(bookData.id) || b.title === bookData.title) ? { ...b, ...bookData } : b);
                    }
                    return [{ ...bookData }, ...prevBooks];
                });

                setChoiceBooks(prevChoice => {
                    const existsInChoice = prevChoice.some(b => String(b.id) === String(bookData.id) || b.title === bookData.title);
                    if (existsInChoice) {
                        return prevChoice.map(b => (String(b.id) === String(bookData.id) || b.title === bookData.title) ? { ...b, ...bookData } : b);
                    }
                    if (modalType === 'choice') {
                        return [{ ...bookData }, ...prevChoice];
                    }
                    return prevChoice;
                });

                // Add audit entry locally
                const newAuditEntry = {
                    id: 'LOG-' + Date.now(),
                    timestamp: new Date().toISOString(),
                    action: isNew ? '新增書籍' : '修改書籍',
                    bookId: bookData.id,
                    bookTitle: bookData.title,
                    operator: activeUser || 'Admin',
                    details: changeDetails
                };
                setAuditLogs(prevLogs => [newAuditEntry, ...prevLogs]);

                // Cloud dual-sync update
                const res = await syncWithGAS('UPDATE_BOOK_DUAL', {
                    book: bookData,
                    isNew: isNew,
                    operator: activeUser || 'Admin',
                    changes: changeDetails
                });

                if (res.status === 'success') {
                    setShowBookModal(false); 
                    setEditingBook(null);
                    showMsg('✨ 已成功於 Book_ALL 與 Choice 兩端同步變更，並留下異動履歷！');
                } else {
                    showMsg('雲端同步提示：' + (res.msg || '已儲存於本機'));
                }
            };

            const confirmSecureDelete = async () => {
                const { type, id, title } = deleteModal;
                setDeleteModal(prev => ({ ...prev, isDeleting: true }));

                try {
                    if (type === 'book' || type === 'choice') {
                        setBooks(prev => prev.filter(b => String(b.id) !== String(id) && b.title !== title));
                        setChoiceBooks(prev => prev.filter(b => String(b.id) !== String(id) && b.title !== title));

                        const delLog = {
                            id: 'LOG-' + Date.now(),
                            timestamp: new Date().toISOString(),
                            action: '刪除書籍',
                            bookId: id || title,
                            bookTitle: title,
                            operator: activeUser || 'Admin',
                            details: `從庫存與推薦清單中同步刪除了書籍: [${title}]`
                        };
                        setAuditLogs(prev => [delLog, ...prev]);

                        await syncWithGAS('DELETE_BOOK_DUAL', { id, title, operator: activeUser });

                                        </div>
                                        <div className="space-y-1">
                                            <label className="text-[10px] font-black opacity-60 uppercase">定價</label>
                                            <input name="price" type="number" defaultValue={editingBook?.price || ''} required className="w-full bg-black/5 border border-black/10 p-3.5 rounded-2xl text-sm font-mono font-bold outline-none" />
                                        </div>
                                    </div>
                                    <div className="space-y-1">
                                        <label className="text-[10px] font-black opacity-60 uppercase">庫存數量</label>
                                        <input name="stock" type="number" defaultValue={editingBook?.stock || 0} required className="w-full bg-black/5 border border-black/10 p-3.5 rounded-2xl text-sm font-mono font-bold outline-none" />
                                    </div>
                                    <div className="space-y-1">
                                        <label className="text-[10px] font-black opacity-60 uppercase">封面網址</label>
                                        <input name="cover" defaultValue={editingBook?.cover || ''} className="w-full bg-black/5 border border-black/10 p-3.5 rounded-2xl text-sm font-bold outline-none" placeholder="圖片網址/Drive ID" />
                                    </div>
                                    <div className="pt-4">
                                        <button className="w-full text-white py-4 rounded-2xl font-bold shadow-xl transition-all bg-indigo-600 hover:bg-indigo-700">
                                            儲存變更 (Choice 與 Book_ALL 自動同步)
                                        </button>
                                    </div>
                                </form>
                            </div>
                        </div>
                    )}

                    {notification && <div className="fixed bottom-12 right-12 bg-zinc-900 text-white px-8 py-5 rounded-2xl shadow-2xl animate-in font-bold text-sm z-[200] flex items-center gap-3 border border-zinc-700"><CheckCircle size={20} className="text-emerald-400" /> {notification}</div>}
                </div> 
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
