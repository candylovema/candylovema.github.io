    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo, useRef } = React;

        const lib = window.lucideReact || window.LucideReact || {};
        const FallbackIcon = () => <span className="inline-block w-4 h-4 bg-zinc-300 rounded-full animate-pulse"></span>;
        
        const LayoutDashboard = lib.LayoutDashboard || FallbackIcon;
        const BookOpen = lib.BookOpen || FallbackIcon;
        const MessageSquare = lib.MessageSquare || FallbackIcon;
        const Truck = lib.Truck || FallbackIcon;
        const Database = lib.Database || FallbackIcon;
        const Globe = lib.Globe || FallbackIcon;
        const Menu = lib.Menu || FallbackIcon;
        const ChevronRight = lib.ChevronRight || FallbackIcon;
        const ChevronDown = lib.ChevronDown || FallbackIcon;
        const ExternalLink = lib.ExternalLink || FallbackIcon;
        const Plus = lib.Plus || FallbackIcon;
        const Edit2 = lib.Edit2 || FallbackIcon;
        const Trash2 = lib.Trash2 || FallbackIcon;
        const Zap = lib.Zap || FallbackIcon;
        const Clock = lib.Clock || FallbackIcon;
        const Save = lib.Save || FallbackIcon;
        const X = lib.X || FallbackIcon;
        const User = lib.User || FallbackIcon;
        const CheckCircle = lib.CheckCircle || FallbackIcon;
        const Search = lib.Search || FallbackIcon;
        const Sparkles = lib.Sparkles || FallbackIcon;
        const FileEdit = lib.FileEdit || FallbackIcon;
        const Star = lib.Star || FallbackIcon;
        const ShieldCheck = lib.ShieldCheck || FallbackIcon;
        const Phone = lib.Phone || FallbackIcon;
        const Mail = lib.Mail || FallbackIcon;
        const TrendingUp = lib.TrendingUp || FallbackIcon;
        const ShoppingCart = lib.ShoppingCart || FallbackIcon;
        const SettingsIcon = lib.Settings || FallbackIcon;
        const Palette = lib.Palette || FallbackIcon;
        const MapPin = lib.MapPin || FallbackIcon;
        const FileText = lib.FileText || FallbackIcon;
        const ShieldAlert = lib.AlertTriangle || FallbackIcon;
        const Wand2 = lib.Wand2 || Sparkles;

        const availableIcons = {
            LayoutDashboard: { icon: LayoutDashboard, color: 'text-blue-500' },
            TrendingUp: { icon: TrendingUp, color: 'text-blue-500' },
            Database: { icon: Database, color: 'text-indigo-500' },
            Truck: { icon: Truck, color: 'text-emerald-500' },
            BookOpen: { icon: BookOpen, color: 'text-red-500' },
            User: { icon: User, color: 'text-purple-500' },
            MessageSquare: { icon: MessageSquare, color: 'text-pink-500' },
            Bot: { icon: Zap, color: 'text-pink-600' },
            Zap: { icon: Zap, color: 'text-orange-500' },
            Sparkles: { icon: Sparkles, color: 'text-yellow-500' },
            Star: { icon: Star, color: 'text-yellow-400' },
            ShoppingCart: { icon: ShoppingCart, color: 'text-cyan-500' },
            ExternalLink: { icon: ExternalLink, color: 'opacity-70' }
        };

        // 🟢 已更新為最新的 Apps Script API 部署網址
        const GAS_URL = "https://script.google.com/macros/s/AKfycbwSdI3L8H_7SKm3LPet8V84kSc6KEwpBxFeHdFIQaJfI3ElMkRtZCnOgWzRE8BC2uNH/exec";

        const sanitizeForSpreadsheet = (val) => {
            if (val === undefined || val === null) return "";
            let str = String(val).trim();
            if (/^[=\+\-\@]/.test(str)) {
                return "'" + str; 
            }
            return str;
        };

        const formatImageUrl = (url) => {
            const transparentFallback = 'data:image/gif;base64,R0lGODlhAQABAAD/ACwAAAAAAQABAAACADs=';
            if (!url) return transparentFallback;
            let strUrl = String(url).trim();
            if (!strUrl || strUrl === '') return transparentFallback;
            if (strUrl.startsWith('data:image')) return strUrl;
            
            let driveId = null;
            if (strUrl.includes('drive.google.com')) {
                const match = strUrl.match(/\/d\/([a-zA-Z0-9_-]+)/) || strUrl.match(/id=([a-zA-Z0-9_-]+)/);
                if (match) driveId = match[1];
            } else if (/^[a-zA-Z0-9_-]{20,}$/.test(strUrl) && !strUrl.includes("/")) {
                driveId = strUrl;
            }

            if (driveId) {
                return `https://drive.google.com/thumbnail?id=${driveId}&sz=w1000`;
            }
            return strUrl;
        };

        const defaultSettings = {
            systemName: '文史哲出版社', systemSubName: 'Digital CMS', logoUrl: '', subLogoUrl: '', userAvatarUrl: '',
            adminPanelName: 'ADMIN PANEL', sidebarSubText: 'Digital CMS', onlineStatusText: 'Online',
            loginBgColor: '#09090b', loginCardBgColor: '#ffffff', loginTextColor: '#27272a',
            sidebarBgColor: '#09090b', sidebarActiveColor: '#4f46e5', sidebarTextColor: '#a1a1aa', sidebarUserColor: '#ffffff',
            adminPanelColor: '#a1a1aa', onlineStatusColor: '#34d399',
            mainBgColor: '#F4F4F5', mainTextColor: '#27272a', cardBgColor: '#ffffff', cardTextColor: '#3f3f46', kpiBgColor: '#ffffff',
            menuDashName: '營運分析中心', menuMarketingName: '行銷與推薦', menuBooksName: '總商品庫庫存',
            menuOrdersName: '銷售與物流', menuCsName: '智能客戶關係', menuExtName: '外部系統鏈接',
            menuDashIcon: 'LayoutDashboard', menuMarketingIcon: 'Sparkles', menuBooksIcon: 'Database',
            menuOrdersIcon: 'Truck', menuCsIcon: 'Zap', menuExtIcon: 'ExternalLink'
        };

        const defaultUI = {
            themeColor: '#8C5A2B', darkThemeColor: '#2C241B', lightBgColor: '#FDFBF7', bgLightColor: '#F9F6F0',
            textDarkColor: '#4A3728', borderColor: '#E6D5C3', accentColor: '#C4B29E', footerBgColor: '#1A1412',
            bodyFont: 'Noto Sans TC', titleFont: 'Noto Serif TC', frontendLogoUrl: '', frontendName: '文史哲出版社',
            menuAbout: '關於我們', menuPresident: '關於社長', menuContact: '聯繫我們', menuNewArrivals: '新書上市',
            menuSearch: '書籍檢索', menuCart: '我的書包', menuAdmin: '臉書(FB)入口'
        };

        function App() {
            const [isAuthenticated, setIsAuthenticated] = useState(() => sessionStorage.getItem('lapen_cms_auth') === 'true');
            const [sessionToken, setSessionToken] = useState(() => sessionStorage.getItem('lapen_cms_token') || '');
            const [activeUser, setActiveUser] = useState(() => sessionStorage.getItem('lapen_cms_user') || '');

            const [books, setBooks] = useState([]);
            const [choiceBooks, setChoiceBooks] = useState([]); 
            const [carousels, setCarousels] = useState([]);
            const [orders, setOrders] = useState([]); 
            const [aiLogs, setAiLogs] = useState([]); 
            const [kpis, setKpis] = useState([]); 
            const [settings, setSettings] = useState(defaultSettings); 
            const [ui, setUi] = useState(defaultUI); 
            
            const [activeTab, setActiveTab] = useState('dashboard');
            const [settingSubTab, setSettingSubTab] = useState('backend'); 
            const [isSidebarOpen, setIsSidebarOpen] = useState(true);
            const [notification, setNotification] = useState(null);
            const [bookSearchQuery, setBookSearchQuery] = useState('');
            const [adminVisibleCount, setAdminVisibleCount] = useState(25);

            const [isLoggingIn, setIsLoggingIn] = useState(false);
            const [loadStatus, setLoadStatus] = useState({
                kpis: true, orders: true, cs: true, carousels: true, choices: true, books: true
            });

            const [showBookModal, setShowBookModal] = useState(false);
            const [editingBook, setEditingBook] = useState(null);
            const [modalType, setModalType] = useState('book');
            const [showCarouselModal, setShowCarouselModal] = useState(false);
            const [editingCarousel, setEditingCarousel] = useState(null);
            const [showOrderModal, setShowOrderModal] = useState(false);
            const [editingOrder, setEditingOrder] = useState(null);
            const [showCSModal, setShowCSModal] = useState(false);
            const [editingCSLog, setEditingCSLog] = useState(null);
            const [csResponseText, setCsResponseText] = useState('');
            const [isAIGenerating, setIsAIGenerating] = useState(false);
            
            // AI Modal State
            const [modalBookTitle, setModalBookTitle] = useState('');
            const [modalBookAuthor, setModalBookAuthor] = useState('');
            const [modalBookYear, setModalBookYear] = useState('');
            const [modalBookCategory, setModalBookCategory] = useState('');
            const [modalBookIntro, setModalBookIntro] = useState('');
            const [modalBookReview, setModalBookReview] = useState('');
            const [isGeneratingBookAI, setIsGeneratingBookAI] = useState(false);

            const [showKpiModal, setShowKpiModal] = useState(false);
            const [editingKpi, setEditingKpi] = useState(null);
            const [selectedKpiIcon, setSelectedKpiIcon] = useState('TrendingUp'); 
            const [iframeModal, setIframeModal] = useState({ isOpen: false, url: '', title: '' });

            const [deleteModal, setDeleteModal] = useState({
                isOpen: false, type: '', id: null, title: '', isDeleting: false
            });

            const [expandedMenus, setExpandedMenus] = useState({
                group_dash: true, group_marketing: false, group_books: true, group_orders: false, group_cs: false, group_settings: false
            });

            const toggleMenu = (menuId) => setExpandedMenus(prev => ({ ...prev, [menuId]: !prev[menuId] }));

            const showMsg = (text) => {
                setNotification(text);
                setTimeout(() => setNotification(null), 3500);
            };

            const formatDate = (dateStr) => {
                if (!dateStr) return '-';
                const d = new Date(dateStr);
                if (isNaN(d.getTime())) return String(dateStr); 
                const yyyy = d.getFullYear(); const mm = String(d.getMonth() + 1).padStart(2, '0'); const dd = String(d.getDate()).padStart(2, '0');
                const hh = String(d.getHours()).padStart(2, '0'); const min = String(d.getMinutes()).padStart(2, '0');
                if (yyyy === 1899) return `${hh}:${min}`;
                return hh === '00' && min === '00' ? `${yyyy}/${mm}/${dd}` : `${yyyy}/${mm}/${dd} ${hh}:${min}`;
            };

            useEffect(() => {
                if (showBookModal) {
                    setModalBookTitle(editingBook?.title || '');
                    setModalBookAuthor(editingBook?.author || '');
                    setModalBookYear(editingBook?.year || '');
                    setModalBookCategory(editingBook?.category || '');
                    setModalBookIntro(editingBook?.intro || '');
                    setModalBookReview(editingBook?.["心得"] || editingBook?.review || editingBook?.notes || '');
                }
            }, [showBookModal, editingBook]);

            const syncWithGAS = async (action, payloadData = null) => {
                try {
                    const currentOrigin = window.location.origin;
                    const safeOrigin = currentOrigin.includes("usercontent.goog") 
                        ? "https://candylovema.github.io" 
                        : currentOrigin;

                    const payloadObj = { 
                        action: action, 
                        payload: payloadData,
                        origin: safeOrigin,
                        sessionToken: sessionToken
                    };

                    const params = new URLSearchParams();
                    params.append("action", action);
                    if (sessionToken) params.append("sessionToken", sessionToken);
                    params.append("origin", safeOrigin);

                    let payloadStr = "";
                    if (payloadData !== null && payloadData !== undefined) {
                        payloadStr = typeof payloadData === "string" ? payloadData : JSON.stringify(payloadData);
                        if (payloadStr.length < 1500) {
                            params.append("payload", payloadStr);
                        }
                    }

                    const requestUrl = `${GAS_URL}?${params.toString()}`;

                    // 超時機制 (Timeout Handling) 避免前端卡死
                    const controller = new AbortController();
                    const timeoutId = setTimeout(() => controller.abort(), 20000); // 20 秒門檻

                    let response = await fetch(requestUrl, {
                        method: "POST",
                        headers: { "Content-Type": "text/plain;charset=utf-8" },
                        body: JSON.stringify(payloadObj),
                        signal: controller.signal
                    });
                    clearTimeout(timeoutId);
                    
                    let data = await response.json();
                    
                    if (data && data.status === 'error' && data.msg && data.msg.includes("Method Not Allowed")) {
                        const retryParams = new URLSearchParams();
                        retryParams.append("action", action);
                        if (sessionToken) retryParams.append("sessionToken", sessionToken);
                        retryParams.append("origin", safeOrigin);
                        if (payloadStr) retryParams.append("payload", payloadStr);

                        const retryUrl = `${GAS_URL}?${retryParams.toString()}`;
                        response = await fetch(retryUrl, { method: "GET" });
                        data = await response.json();
                    }

                    if (data.status === 'error') {
                        console.error("後端拒絕請求:", data.msg);
                        showMsg("拒絕存取: " + data.msg); 
                        if (data.msg.includes("過期") || data.msg.includes("請重新登入")) {
                            handleLogout();
                        }
                    }
                    
                    return data;
                } catch (e) {
                    console.error("GAS Sync Error:", e);
                    if (e.name === 'AbortError') {
                        showMsg("請求超時：伺服器處理時間較長，請再試一次或重新整理。");
                    } else {
                        showMsg("網絡連線異常: " + e.toString()); 
                    }
                    return { status: 'error', msg: e.toString() };
                }
            };

            const handleGenerateBookAI = async () => {
                if (!modalBookTitle.trim()) {
                    showMsg('請先填寫書籍標題，以供 AI 生成介紹與心得！');
                    return;
                }
                setIsGeneratingBookAI(true);
                showMsg('✨ AI 正在讀取文史哲典籍庫，為您撰寫介紹與導讀...');

                try {
                    const res = await syncWithGAS('GENERATE_BOOK_AI', {
                        title: modalBookTitle,
                        author: modalBookAuthor,
                        year: modalBookYear,
                        category: modalBookCategory
                    });

                    if (res && res.status === 'success' && res.data) {
                        if (res.data.intro) setModalBookIntro(res.data.intro);
                        if (res.data.review) setModalBookReview(res.data.review);
                        showMsg('✨ AI 成功生成「內容介紹」與「編輯心得」！');
                    } else {
                        throw new Error(res.msg || '未取得有效 AI 回應');
                    }
                } catch (err) {
                    console.error('Gemini API 生成失敗:', err);
                    showMsg('AI 生成失敗：' + (err.message || '請重新嘗試'));
                } finally {
                    setIsGeneratingBookAI(false);
                }
            };

            const handleGenerateAI = async () => {
                if (!editingCSLog) return;
                setIsAIGenerating(true);
                showMsg('✨ AI 正在撰寫親切且具文化底蘊的客服回覆...');

                try {
                    const res = await syncWithGAS('GENERATE_CS_AI', {
                        user: editingCSLog.user,
                        query: editingCSLog.query
                    });

                    if (res && res.status === 'success' && res.data && res.data.response) {
                        setCsResponseText(res.data.response);
                        showMsg('✨ AI 回覆草稿已擬定完成！');
                    } else {
                        throw new Error(res.msg || 'AI 擬稿失敗');
                    }
                } catch (err) {
                    console.error('CS AI 生成失敗:', err);
                    showMsg('AI 生成失敗：' + (err.message || '請重新嘗試'));
                } finally {
                    setIsAIGenerating(false);
                }
            };

            const handleLogin = async (e) => {
                e.preventDefault();
                if (isLoggingIn) return;
                setIsLoggingIn(true);
                showMsg('正在向雲端安全性通道驗證身分...');

                const username = e.target.username.value;
                const password = e.target.password.value;

                try {
                    const res = await syncWithGAS('LOGIN', { user: username, password: password });
                    if (res && res.status === 'success' && res.sessionToken) {
                        sessionStorage.setItem('lapen_cms_auth', 'true');
                        sessionStorage.setItem('lapen_cms_token', res.sessionToken);
                        sessionStorage.setItem('lapen_cms_user', username);
                        
                        setIsAuthenticated(true);
                        setSessionToken(res.sessionToken);
                        setActiveUser(username);
                        showMsg('身分驗證通過，Session 令牌已安全簽發！');
                    } else {
                        showMsg('登入失敗：' + (res.msg || '帳號或密碼錯誤'));
                    }
                } catch (err) {
                    showMsg('驗證發生異常：' + err.toString());
                } finally {
                    setIsLoggingIn(false);
                }
            };

            const handleLogout = () => {
                sessionStorage.clear();
                setIsAuthenticated(false);
                setSessionToken('');
                setActiveUser('');
                setBooks([]);
                setChoiceBooks([]);
                setCarousels([]);
                setOrders([]);
                setAiLogs([]);
                showMsg('Session 已安全銷毀，您已成功登出。');
            };

            useEffect(() => {
                if (!isAuthenticated || !sessionToken) return;

                // 並行非同步載入各模組，防止單一卡住影響全部
                syncWithGAS('FETCH_SETTINGS').then(res => {
                    if (res && res.data) setSettings(prev => ({...prev, ...res.data}));
                }).catch(() => {});

                syncWithGAS('FETCH_UI').then(res => {
                    if (res && res.data) setUi(prev => ({...prev, ...res.data}));
                }).catch(() => {});

                syncWithGAS('FETCH_KPIS').then(res => { 
                    if(res?.data) setKpis(res.data); 
                    setLoadStatus(prev => ({...prev, kpis: false})); 
                }).catch(() => setLoadStatus(prev => ({...prev, kpis: false})));
                
                syncWithGAS('FETCH_ORDERS').then(res => { 
                    if(res?.data) setOrders(res.data); 
                    setLoadStatus(prev => ({...prev, orders: false})); 
                }).catch(() => setLoadStatus(prev => ({...prev, orders: false})));
                
                syncWithGAS('FETCH_CS_LOGS').then(res => { 
                    if(res?.data) setAiLogs(res.data); 
                    setLoadStatus(prev => ({...prev, cs: false})); 
                }).catch(() => setLoadStatus(prev => ({...prev, cs: false})));
                
                syncWithGAS('FETCH_CAROUSELS').then(res => { 
                    if(res?.data) setCarousels(res.data); 
                    setLoadStatus(prev => ({...prev, carousels: false})); 
                }).catch(() => setLoadStatus(prev => ({...prev, carousels: false})));
                
                syncWithGAS('FETCH_CHOICES').then(res => { 
                    if(res?.data) setChoiceBooks(res.data); 
                    setLoadStatus(prev => ({...prev, choices: false})); 
                }).catch(() => setLoadStatus(prev => ({...prev, choices: false})));
                
                // 全館書籍 (Book_ALL) 高效讀取
                syncWithGAS('FETCH_BOOKS').then(res => { 
                    if(res?.data && Array.isArray(res.data)) {
                        setBooks(res.data); 
                    }
                    setLoadStatus(prev => ({...prev, books: false})); 
                }).catch(err => {
                    console.error("載入書籍失敗:", err);
                    setLoadStatus(prev => ({...prev, books: false})); 
                });
            }, [isAuthenticated, sessionToken]);

            const excelCategories = useMemo(() => {
                const cats = (books || []).map(b => b.category).filter(c => c && c.trim() !== "");
                return [...new Set(cats)].sort();
            }, [books]);

            const filteredAdminBooks = useMemo(() => {
                const query = (bookSearchQuery || '').toLowerCase().trim();
                const targetList = activeTab === 'choice' ? (choiceBooks || []) : (books || []); 
                if (!query) return targetList;
                return targetList.filter(b => 
                    (b.title && b.title.toLowerCase().includes(query)) ||
                    (b.id && b.id.toString().toLowerCase().includes(query)) ||
                    (b.author && b.author.toLowerCase().includes(query)) ||
                    (b.category && b.category.toLowerCase().includes(query))
                );
            }, [books, choiceBooks, bookSearchQuery, activeTab]);

            const visibleAdminBooks = useMemo(() => {
                return (filteredAdminBooks || []).slice(0, adminVisibleCount);
            }, [filteredAdminBooks, adminVisibleCount]);

            const handleSaveBook = async (e) => {
                e.preventDefault();
                const formData = new FormData(e.target);
                const bookData = {
                    title: sanitizeForSpreadsheet(formData.get('title')), 
                    category: sanitizeForSpreadsheet(formData.get('category')), 
                    price: parseInt(formData.get('price')) || 0, 
                    stock: parseInt(formData.get('stock')) || 0,
                    cover: sanitizeForSpreadsheet(formData.get('cover') || ''), 
                    author: sanitizeForSpreadsheet(formData.get('author') || ''), 
                    year: sanitizeForSpreadsheet(formData.get('year') || ''),
                    intro: sanitizeForSpreadsheet(modalBookIntro || formData.get('intro') || ''),
                    "心得": sanitizeForSpreadsheet(modalBookReview || formData.get('心得') || '')
                };
                
                const isChoice = modalType === 'choice';
                const currentList = isChoice ? choiceBooks : books;
                const setList = isChoice ? setChoiceBooks : setBooks;
                const updateAction = isChoice ? 'UPDATE_CHOICE' : 'UPDATE_BOOK';
                const addAction = isChoice ? 'ADD_CHOICE' : 'ADD_BOOK';

                showMsg('正在向雲端寫入書籍變更...');
                const res = await syncWithGAS(editingBook ? updateAction : addAction, editingBook ? { ...editingBook, ...bookData } : { ...bookData, id: Date.now() });
                
                if (res.status === 'success') {
                    if (editingBook) {
                        setList(currentList.map(b => b.id === editingBook.id ? { ...editingBook, ...bookData } : b));
                    } else {
                        setList([{ ...bookData, id: Date.now() }, ...currentList]);
                    }
                    setShowBookModal(false); setEditingBook(null);
                    showMsg(`${isChoice ? '精選推薦' : '書籍庫存'}已成功更新！`);
                }
            };

            const openDeleteModal = (type, id, title) => {
                setDeleteModal({ isOpen: true, type, id, title, isDeleting: false });
            };

            const confirmSecureDelete = async () => {
                const { type, id } = deleteModal;
                setDeleteModal(prev => ({ ...prev, isDeleting: true }));

                let res = { status: 'error', msg: '未知錯誤' };
                try {
                    if (type === 'book') {
                        res = await syncWithGAS('DELETE_BOOK', { id });
                        if (res.status === 'success') setBooks(books.filter(b => b.id !== id));
                    } else if (type === 'choice') {
                        res = await syncWithGAS('DELETE_CHOICE', { id });
                        if (res.status === 'success') setChoiceBooks(choiceBooks.filter(b => b.id !== id));
                    } else if (type === 'carousel') {
                        res = await syncWithGAS('DELETE_CAROUSEL', { id });
                        if (res.status === 'success') setCarousels(carousels.filter(c => c.id !== id));
                    } else if (type === 'kpi') {
                        res = await syncWithGAS('DELETE_KPI', { id });
                        if (res.status === 'success') setKpis(kpis.filter(k => k.id !== id));
                    }

                    if (res.status === 'success') {
                        showMsg('資料已成功安全刪除');
                    } else {
                        showMsg('刪除失敗：' + res.msg);
                    }
                } catch (e) {
                    showMsg('刪除出錯：' + e.toString());
                } finally {
                    setDeleteModal({ isOpen: false, type: '', id: null, title: '', isDeleting: false });
                }
            };

            const handleSaveOrder = async (e) => {
                e.preventDefault();
                const formData = new FormData(e.target);
                const newId = sanitizeForSpreadsheet(formData.get('orderId')); 
                const updated = {
                    ...editingOrder, 
                    newId: newId, 
                    customer: sanitizeForSpreadsheet(formData.get('customer')), 
                    phone: sanitizeForSpreadsheet(formData.get('phone')), 
                    email: sanitizeForSpreadsheet(formData.get('email')), 
                    address: sanitizeForSpreadsheet(formData.get('address')),
                    items: sanitizeForSpreadsheet(formData.get('items')), 
                    total: parseInt(formData.get('total')) || 0, 
                    payment: sanitizeForSpreadsheet(formData.get('payment')), 
                    status: sanitizeForSpreadsheet(formData.get('status')),
                    memo: sanitizeForSpreadsheet(formData.get('memo') || '') 
                };
                
                const res = await syncWithGAS('UPDATE_ORDER', updated); 
                if(res.status === 'success') {
                    setOrders(orders.map(o => o.id === editingOrder.id ? { ...updated, id: newId || updated.id } : o));

            const handleSaveCarousel = async (e) => {

                    title: sanitizeForSpreadsheet(formData.get('title')), 
                    description: sanitizeForSpreadsheet(formData.get('description')), 
                    image: sanitizeForSpreadsheet(formData.get('image') || ''), 
                    status: sanitizeForSpreadsheet(formData.get('status')) 
                };
                
                const res = await syncWithGAS(editingCarousel ? 'UPDATE_CAROUSEL' : 'ADD_CAROUSEL', editingCarousel ? { ...editingCarousel, ...slideData } : { ...slideData, id: Date.now() });
                
                if (res.status === 'success') {
                    if (editingCarousel) setCarousels(carousels.map(c => c.id === editingCarousel.id ? { ...editingCarousel, ...slideData } : c));

            };

                const combinedUnit = `${inputUnit}||${selectedKpiIcon}`;
                const kpiData = { 
                    title: sanitizeForSpreadsheet(formData.get('title')), 
                    value: sanitizeForSpreadsheet(formData.get('value')), 
                    unit: combinedUnit 
                };
                
                const res = await syncWithGAS(editingKpi ? 'UPDATE_KPI' : 'ADD_KPI', editingKpi ? { ...editingKpi, ...kpiData } : { ...kpiData, id: Date.now() });

                if (res.status === 'success') {
                    if (editingKpi) setKpis(kpis.map(k => k.id === editingKpi.id ? { ...editingKpi, ...kpiData } : k));
                    else setKpis([...kpis, { ...kpiData, id: Date.now() }]);
                    setEditingKpi(null); setShowKpiModal(false); showMsg('KPI 指標已更新');

                const newUi = { ...ui };

                    if (key in defaultUI) {
                        newUi[key] = safeVal;
                    } else {
                        newSettings[key] = safeVal;

                const resUi = await syncWithGAS('UPDATE_UI', newUi);

                    setSettings(newSettings);

                                        <textarea 
                                            value={csResponseText}
                                            onChange={(e) => setCsResponseText(e.target.value)}
                                            placeholder="輸入要回覆給讀者的內容..." 
                                            className="w-full bg-black/5 border border-black/10 p-3 rounded-xl text-xs h-32 resize-none font-bold outline-none leading-relaxed"
                                            style={{ color: 'inherit' }}
                                        />
                                    </div>
                                    <button className="w-full text-white py-3 rounded-xl font-bold shadow-md transition-all text-xs" style={{ backgroundColor: settings.sidebarActiveColor }} onClick={handleSaveCS}>
                                        送出回覆
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}

                    {notification && <div className="fixed bottom-8 right-8 bg-zinc-900 text-white px-6 py-4 rounded-2xl shadow-2xl animate-in font-bold text-xs z-[200] flex items-center gap-2 border border-zinc-700"><CheckCircle size={16} className="text-emerald-400" /> {notification}</div>}
                </div> 
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
