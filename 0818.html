            const transparentFallback = 'data:image/gif;base64,R0lGODlhAQABAAD/ACwAAAAAAQABAAACADs=';

            let strUrl = String(url).trim();
            if (!strUrl || strUrl === '') return transparentFallback;
            if (strUrl.startsWith('data:image')) return strUrl;
            
            let driveId = null;
            if (strUrl.includes('drive.google.com')) {
                const match = strUrl.match(/\/d\/([a-zA-Z0-9_-]+)/) || strUrl.match(/id=([a-zA-Z0-9_-]+)/);
                if (match) driveId = match[1];
            } else if (/^[a-zA-Z0-9_-]{20,}$/.test(strUrl) && !strUrl.includes("/")) {
                driveId = strUrl;
            }

            if (driveId) {
                return `https://drive.google.com/thumbnail?id=${driveId}&sz=w1000`;
            }
            return strUrl;
        };

                        origin: safeOrigin,
                        sessionToken: sessionToken

                    if (sessionToken) params.append("sessionToken", sessionToken);
                    params.append("origin", safeOrigin);

                    let payloadStr = "";
                    if (payloadData !== null && payloadData !== undefined) {
                        payloadStr = typeof payloadData === "string" ? payloadData : JSON.stringify(payloadData);

                    const requestUrl = `${GAS_URL}?${params.toString()}`;

                    let response = await fetch(requestUrl, {
                        method: "POST",
                        headers: { "Content-Type": "text/plain;charset=utf-8" },
                        body: JSON.stringify(payloadObj)
                    });
                    
                    let data = await response.json();
                    
                    if (data && data.status === 'error' && data.msg && data.msg.includes("Method Not Allowed")) {
                        console.warn("POST converted to GET on redirect. Retrying with GET parameters...");
                        const retryParams = new URLSearchParams();
                        retryParams.append("action", action);
                        if (sessionToken) retryParams.append("sessionToken", sessionToken);
                        retryParams.append("origin", safeOrigin);
                        if (payloadStr) retryParams.append("payload", payloadStr);

                        const retryUrl = `${GAS_URL}?${retryParams.toString()}`;
                        response = await fetch(retryUrl, { method: "GET" });
                        data = await response.json();
                    }

                    if (data.status === 'error') {
                        console.error("後端拒絕請求:", data.msg);
                        if (data.msg && data.msg.includes("未知 action")) {
                            console.warn("GAS 後端尚未更新對應的 Action。請至「書籍快速修改與變更紀錄」頁面點擊『後端 GAS 部署代碼』複製最新程式碼並於 Google Apps Script 重新部署新版本。");
                        } else {
                            showMsg("拒絕存取: " + data.msg); 
                        }
                        if (data.msg && (data.msg.includes("驗證失敗") || data.msg.includes("未授權") || data.msg.includes("過期"))) {
                            handleLogout();
                        }
                    }
                    
                    return data;
                } catch (e) {
                    console.error("GAS Sync Error:", e);
                    showMsg("網路安全通道異常: " + e.toString()); 
                    return { status: 'error', msg: e.toString() };
                }

                        res = await syncWithGAS('DELETE_CAROUSEL', { id });

                        res = await syncWithGAS('DELETE_NOTE', { id });
                        if (res.status === 'success') setNotes(notes.filter(n => n.id !== id));
                    }

                    if (res.status === 'success') {
                        showMsg('資料已成功安全刪除');
                    } else {
                        showMsg('刪除失敗：' + res.msg);
                    }
                } catch (e) {

                                        <strong>💡 升級提示：</strong> 本次更新已在 Google Apps Script 新增 `Book_Change_Logs` (書籍變更歷史紀錄表) 之自動讀取(`FETCH_CHANGE_LOGS`) 與寫入(`QUICK_UPDATE_BOOK_LOG`) 處理程序。
                                    </div>
                                    <textarea
                                        readOnly
                                        rows={18}
                                        className="w-full bg-zinc-950 border border-zinc-800 rounded-2xl p-4 text-xs font-mono text-emerald-400 outline-none resize-none leading-relaxed select-all"
                                        value={`// 🎯 請確保 SPREADSHEET_ID 填寫正確。
const SPREADSHEET_ID = "1WB8sWMkP-6RH23lUvP-JUl7JnzxSQKzkszGUzh4XS6s";

const ALLOWED_ORIGINS = [
  "https://theliberalartspress.github.io",
  "https://candylovema.github.io"
]; 

function sanitizeForSpreadsheet(val) {
  if (val === undefined || val === null) return "";
  let str = String(val).trim();
  if (/^[=\\+\\-\@]/.test(str)) return "'" + str;
  return str;
}

function getSecretKey() {
  const props = PropertiesService.getScriptProperties();
  let key = props.getProperty("SESSION_SECRET");
  if (!key) {
    key = Utilities.getUuid();
    props.setProperty("SESSION_SECRET", key);
  }
  return key;
}

function generateSessionToken(user) {
  const expiry = new Date().getTime() + (4 * 60 * 60 * 1000);
  const message = user + ":" + expiry;
  const secret = getSecretKey();
  const signature = Utilities.computeHmacSha256Signature(message, secret);
  const sigHex = signature.map(b => ('0' + (b < 0 ? b + 256 : b).toString(16)).slice(-2)).join('');
  return Utilities.base64Encode(message + "|" + sigHex);
}

function validateSessionToken(token) {
  try {
    if (!token) return { valid: false, msg: "您的工作階段已過期，請重新登入管理員系統。" };
    const decoded = Utilities.newBlob(Utilities.base64Decode(token)).getDataAsString();
    const parts = decoded.split("|");
    if (parts.length !== 2) return { valid: false, msg: "Session 格式毀損，安全阻斷。" };
    const message = parts[0];
    const sigHex = parts[1];

    const secret = getSecretKey();
    const signature = Utilities.computeHmacSha256Signature(message, secret);
    const expectedSigHex = signature.map(b => ('0' + (b < 0 ? b + 256 : b).toString(16)).slice(-2)).join('');
    if (sigHex !== expectedSigHex) return { valid: false, msg: "Session 簽章不符，拒絕存取。" };

    const msgParts = message.split(":");
    const user = msgParts[0];
    const expiry = parseInt(msgParts[1], 10);
    if (new Date().getTime() > expiry) return { valid: false, msg: "管理員 Session 已超時過期，請重新登入。" };

    return { valid: true, user: user };
  } catch (e) {
    return { valid: false, msg: "Session 系統例外錯誤: " + e.toString() };
  }
}

function getOrCreateSheet(ss, sheetName, headers) {
  let sheet = ss.getSheetByName(sheetName);
  if (!sheet) {
    const sheets = ss.getSheets();
    for (let i = 0; i < sheets.length; i++) {
      if (sheets[i].getName().trim().toLowerCase() === sheetName.trim().toLowerCase()) {
        return sheets[i];
      }
    }
    try {
      sheet = ss.insertSheet(sheetName);
      if (headers && headers.length > 0) {
        sheet.appendRow(headers);
        sheet.getRange(1, 1, 1, headers.length).setFontWeight("bold").setBackground("#FFF2CC");
      }
    } catch (e) {
      sheet = ss.getSheets()[0];
    }
  }
  return sheet;
}

function responseError(msg) {
  return ContentService.createTextOutput(JSON.stringify({ status: "error", msg: msg }))
    .setMimeType(ContentService.MimeType.JSON);
}

function doGet(e) {
  return responseError("Method Not Allowed. API requires POST method with secure token.");
}

function doPost(e) {
  try {
    if (!e.postData || !e.postData.contents) return responseError("Access Denied: Empty Request");
    const requestData = JSON.parse(e.postData.contents);
    const action = requestData.action;
    const payload = requestData.payload;
    const origin = requestData.origin || "";

    if (!action) return responseError("Access Denied: Missing action");

    const isAllowed = ALLOWED_ORIGINS.some(allowedUrl => origin.startsWith(allowedUrl)) || 
                      origin.includes("localhost") || origin === "null" || origin === "";

    if (!isAllowed) return responseError("Access Denied: Unauthorized Request Origin -> " + origin);

    if (action === "LOGIN") {
      const result = processLogin(payload);
      return ContentService.createTextOutput(JSON.stringify(result)).setMimeType(ContentService.MimeType.JSON);
    } else {
      const auth = validateSessionToken(requestData.sessionToken);
      if (!auth.valid) return responseError(auth.msg);
      const result = processAdminAction(action, payload, auth.user);
      return ContentService.createTextOutput(JSON.stringify(result)).setMimeType(ContentService.MimeType.JSON);
    }
  } catch (err) {
    return responseError("Server Error: " + err.toString());
  }
}

function processLogin(payload) {
  if (!payload || !payload.user || !payload.password) return { status: "error", msg: "請提供帳號與密碼" };
  const ss = SpreadsheetApp.openById(SPREADSHEET_ID);
  const sheet = getOrCreateSheet(ss, "account", ["帳號", "密碼"]);
  const rawData = sheet.getDataRange().getValues();
  if (rawData.length <= 1) return { status: "error", msg: "帳密資料庫為空。" };

  const user = String(payload.user).trim();
  const password = String(payload.password).trim();

  for (let i = 1; i < rawData.length; i++) {
    if (String(rawData[i][0]).trim() === user && String(rawData[i][1]).trim() === password) {
      return { status: "success", sessionToken: generateSessionToken(user) };
    }
  }
  return { status: "error", msg: "帳號或密碼錯誤。" };
}

function processAdminAction(action, payload, currentUser) {
  const ss = SpreadsheetApp.openById(SPREADSHEET_ID);
  const parseNumber = (val) => {
    if (!val) return 0;
    const num = parseInt(String(val).replace(/[^0-9]/g, ""), 10);
    return isNaN(num) ? 0 : num;
  };

  /* =========================
     📜 書籍變更紀錄系統 (Book_Change_Logs)
  ========================= */
  if (action === "FETCH_CHANGE_LOGS") {
    const headers = ["紀錄ID", "變更時間", "操作者", "目標分頁", "書籍ID", "書籍名稱", "變更類型", "變更前內容", "變更後內容", "備註說明"];
    const sheet = getOrCreateSheet(ss, "Book_Change_Logs", headers);
    const rawData = sheet.getDataRange().getValues();
    if (rawData.length <= 1) return { status: "success", data: [] };
    const logs = rawData.slice(1).map(r => ({
      id: String(r[0] || ""),
      timestamp: String(r[1] || "").replace(/^'/, ""),
      operator: String(r[2] || ""),
      targetSheet: String(r[3] || ""),
      bookId: String(r[4] || ""),
      bookTitle: String(r[5] || ""),
      changeType: String(r[6] || ""),
      oldValue: String(r[7] || ""),
      newValue: String(r[8] || ""),
      note: String(r[9] || "")
    }));
    return { status: "success", data: logs.reverse() };
  }

  if (action === "QUICK_UPDATE_BOOK_LOG") {
    const targetSheetName = payload.targetSheet === "Choice" ? "Choice" : "Book_ALL";
    const sheet = ss.getSheetByName(targetSheetName);
    if (!sheet) return { status: "error", msg: "找不到 " + targetSheetName + " 分頁" };

    const rawData = sheet.getDataRange().getValues();
    let targetRow = -1;
    let bookTitle = payload.bookTitle || "";
    const targetId = String(payload.bookId).trim();

    for (let i = 1; i < rawData.length; i++) {
      if (String(rawData[i][0]).trim() === targetId) {
        targetRow = i + 1;
        break;
      }
    }

    if (targetRow === -1) {
      return { status: "error", msg: "在 " + targetSheetName + " 找不到書碼為 [" + targetId + "] 的書籍" };
    }

    const maxCols = Math.max(sheet.getLastColumn(), 15);
    const rowRange = sheet.getRange(targetRow, 1, 1, maxCols);
    const rowData = rowRange.getValues()[0];

    if (payload.newBookId && String(payload.newBookId).trim() !== "") {
      rowData[0] = sanitizeForSpreadsheet(payload.newBookId);
    }
    if (payload.newTitle !== undefined) {
      rowData[1] = sanitizeForSpreadsheet(payload.newTitle);
      bookTitle = payload.newTitle;
    }
    if (payload.newPrice !== undefined) {
      rowData[4] = parseInt(payload.newPrice) || 0;
    }

    rowRange.setValues([rowData]);

    const logSheet = getOrCreateSheet(ss, "Book_Change_Logs", ["紀錄ID", "變更時間", "操作者", "目標分頁", "書籍ID", "書籍名稱", "變更類型", "變更前內容", "變更後內容", "備註說明"]);
    const nowStr = Utilities.formatDate(new Date(), "Asia/Taipei", "yyyy/MM/dd HH:mm:ss");
    logSheet.appendRow([
      "LOG-" + Date.now(),
      "'" + nowStr,
      sanitizeForSpreadsheet(payload.operator || currentUser || "Admin"),
      targetSheetName,
      sanitizeForSpreadsheet(payload.newBookId || payload.bookId),
      sanitizeForSpreadsheet(bookTitle),
      sanitizeForSpreadsheet(payload.changeType || "快速修改"),
      sanitizeForSpreadsheet(payload.oldValue || ""),
      sanitizeForSpreadsheet(payload.newValue || ""),
      sanitizeForSpreadsheet(payload.note || "快速修改性編輯")
    ]);

    return { status: "success", msg: "書籍修改已儲存，並寫入變更紀錄表！" };
  }

  if (action === "QUICK_ADD_BOOK_LOG") {
    const targetSheetName = payload.targetSheet === "Choice" ? "Choice" : "Book_ALL";
    const sheet = getOrCreateSheet(ss, targetSheetName, ["編號", "書名", "作者", "年份", "定價", "isbn", "庫存", "分類", "newyn", "lastyn", "照片"]);

    const newRow = new Array(15).fill("");
    const bookId = sanitizeForSpreadsheet(payload.bookId || Date.now());
    const bookTitle = sanitizeForSpreadsheet(payload.title || "未命名書籍");
    const price = parseInt(payload.price) || 0;

    newRow[0] = bookId;
    newRow[1] = bookTitle;
    newRow[2] = sanitizeForSpreadsheet(payload.author || "");
    newRow[3] = sanitizeForSpreadsheet(payload.year || "");
    newRow[4] = price;
    newRow[6] = parseInt(payload.stock) || 0;
    newRow[7] = sanitizeForSpreadsheet(payload.category || "未分類");
    newRow[10] = sanitizeForSpreadsheet(payload.cover || "");
    if (targetSheetName === "Book_ALL") newRow[11] = sanitizeForSpreadsheet(payload.category || "未分類");

    sheet.appendRow(newRow);

    const logSheet = getOrCreateSheet(ss, "Book_Change_Logs", ["紀錄ID", "變更時間", "操作者", "目標分頁", "書籍ID", "書籍名稱", "變更類型", "變更前內容", "變更後內容", "備註說明"]);
    const nowStr = Utilities.formatDate(new Date(), "Asia/Taipei", "yyyy/MM/dd HH:mm:ss");
    logSheet.appendRow([
      "LOG-" + Date.now(),
      "'" + nowStr,
      sanitizeForSpreadsheet(payload.operator || currentUser || "Admin"),
      targetSheetName,
      bookId,
      bookTitle,
      "新增書籍",
      "無 (新上架書籍)",
      "書碼:" + bookId + " | 定價:NT$" + price + " | 分類:" + (payload.category || "未分類"),
      sanitizeForSpreadsheet(payload.note || "快速上架書籍")
    ]);

    return { status: "success", msg: "新書已成功上架並記錄至變更歷史表！" };
  }

  // 其餘已有 action ...
  return { status: "error", msg: "未知 action" };
}`}
                                    />
                                </div>
                                <div className="p-4 bg-zinc-950 border-t border-zinc-800 flex justify-end">
                                    <button type="button" onClick={() => setShowGasCodeModal(false)} className="px-6 py-2.5 bg-emerald-600 hover:bg-emerald-700 text-white rounded-xl font-bold text-xs shadow-md transition">
                                        我已瞭解並已複製
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}

                    {notification && <div className="fixed bottom-12 right-12 bg-zinc-900 text-white px-8 py-5 rounded-2xl shadow-2xl animate-in font-bold text-sm z-[200] flex items-center gap-3 border border-zinc-700"><CheckCircle size={20} className="text-emerald-400" /> {notification}</div>}
                </div> 
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
