    ========================================================================================
    🟢【後端 Google Apps Script (Code.gs) 擴充邏輯】
    若需執行雙向同步與異動歷史紀錄，請複製下方程式碼至 Google Apps Script Code.gs 中：

    function processAdminAction(action, payload) {
      const ss = SpreadsheetApp.openById(SPREADSHEET_ID);

      /* =========================
         📜 異動紀錄系統 (AuditLog)
      ========================= */
      if (action === "FETCH_AUDIT_LOGS") {
        const sheet = getOrCreateSheet(ss, "AuditLog", ["時間", "操作者", "書籍ID", "書籍名稱", "變更項目", "原數值", "新數值", "影響分頁"]);
        const rawData = sheet.getDataRange().getValues();
        if (rawData.length <= 1) return { status: "success", data: [] };
        const logs = rawData.slice(1).map(r => ({
          timestamp: String(r[0] || "").replace(/^'/, ""),
          user: String(r[1] || ""),
          bookId: String(r[2] || ""),
          bookTitle: String(r[3] || ""),
          field: String(r[4] || ""),
          oldVal: String(r[5] || ""),
          newVal: String(r[6] || ""),
          targetSheet: String(r[7] || "")
        }));
        return { status: "success", data: logs.reverse() };
      }

      if (action === "ADD_AUDIT_LOG") {
        const sheet = getOrCreateSheet(ss, "AuditLog", ["時間", "操作者", "書籍ID", "書籍名稱", "變更項目", "原數值", "新數值", "影響分頁"]);
        sheet.appendRow([
          "'" + (payload.timestamp || new Date().toLocaleString("zh-TW")),
          sanitizeForSpreadsheet(payload.user || "Admin"),
          sanitizeForSpreadsheet(payload.bookId || ""),
          sanitizeForSpreadsheet(payload.bookTitle || ""),
          sanitizeForSpreadsheet(payload.field || ""),
          sanitizeForSpreadsheet(payload.oldVal || ""),
          sanitizeForSpreadsheet(payload.newVal || ""),
          sanitizeForSpreadsheet(payload.targetSheet || "Book_ALL & Choice")
        ]);
        return { status: "success", msg: "紀錄已寫入" };
      }

      /* =========================
         🔄 雙向同步更新書籍 (UPDATE_BOOK_DUAL)
      ========================= */
      if (action === "UPDATE_BOOK_DUAL") {
        const targetSheets = payload.targetSheets || ["Book_ALL", "Choice"];
        let updatedSheets = [];
        
        targetSheets.forEach(sheetName => {
          const sheet = ss.getSheetByName(sheetName);
          if (!sheet) return;
          const rawData = sheet.getDataRange().getValues();
          for (let i = 1; i < rawData.length; i++) {
            if (String(rawData[i][0]) === String(payload.id)) {
              const rowData = sheet.getRange(i + 1, 1, 1, sheet.getLastColumn()).getValues()[0];
              while (rowData.length < 15) rowData.push("");
              
              if (payload.title !== undefined) rowData[1] = sanitizeForSpreadsheet(payload.title);
              if (payload.author !== undefined) rowData[2] = sanitizeForSpreadsheet(payload.author);
              if (payload.year !== undefined) rowData[3] = sanitizeForSpreadsheet(payload.year);
              if (payload.price !== undefined) rowData[4] = parseInt(payload.price, 10) || 0;
              if (payload.stock !== undefined) rowData[6] = parseInt(payload.stock, 10) || 0;
              if (payload.category !== undefined) {
                rowData[7] = sanitizeForSpreadsheet(payload.category);
                if (sheetName === "Book_ALL") rowData[11] = sanitizeForSpreadsheet(payload.category);
              }
              if (payload.cover !== undefined) rowData[10] = sanitizeForSpreadsheet(payload.cover);
              if (payload.intro !== undefined) rowData[13] = sanitizeForSpreadsheet(payload.intro);
              if (payload["心得"] !== undefined) rowData[14] = sanitizeForSpreadsheet(payload["心得"]);

              sheet.getRange(i + 1, 1, 1, rowData.length).setValues([rowData]);
              updatedSheets.push(sheetName);
              break;
            }
          }
        });

        if (payload.logs && Array.isArray(payload.logs)) {
          const auditSheet = getOrCreateSheet(ss, "AuditLog", ["時間", "操作者", "書籍ID", "書籍名稱", "變更項目", "原數值", "新數值", "影響分頁"]);
          payload.logs.forEach(log => {
            auditSheet.appendRow([
              "'" + (log.timestamp || new Date().toLocaleString("zh-TW")),
              sanitizeForSpreadsheet(log.user || "Admin"),
              sanitizeForSpreadsheet(payload.id || ""),
              sanitizeForSpreadsheet(payload.title || ""),
              sanitizeForSpreadsheet(log.field || ""),
              sanitizeForSpreadsheet(log.oldVal || ""),
              sanitizeForSpreadsheet(log.newVal || ""),
              sanitizeForSpreadsheet(updatedSheets.join(" & ") || "未找到對應紀錄")
            ]);
          });
        }

        return { status: "success", msg: "更新成功 (影響分頁: " + updatedSheets.join(", ") + ")" };
      }

      if (action === "BATCH_UPDATE_BOOKS") {
        const items = payload.items || [];
        const targetSheets = payload.targetSheets || ["Book_ALL", "Choice"];
        let count = 0;
        
        items.forEach(item => {
          targetSheets.forEach(sheetName => {
            const sheet = ss.getSheetByName(sheetName);
            if (!sheet) return;
            const rawData = sheet.getDataRange().getValues();
            for (let i = 1; i < rawData.length; i++) {
              if (String(rawData[i][0]) === String(item.id)) {
                if (item.price !== undefined) sheet.getRange(i + 1, 5).setValue(parseInt(item.price, 10) || 0);
                if (item.stock !== undefined) sheet.getRange(i + 1, 7).setValue(parseInt(item.stock, 10) || 0);
                if (item.category !== undefined) {
                  sheet.getRange(i + 1, 8).setValue(sanitizeForSpreadsheet(item.category));
                  if (sheetName === "Book_ALL") sheet.getRange(i + 1, 12).setValue(sanitizeForSpreadsheet(item.category));
                }
                count++;
                break;
              }
            }
          });
        });

        return { status: "success", msg: "已批次更新 " + count + " 筆紀錄" };
      }

      // ... 原有其他 action 處理程序 ...
    }
    -->

            const transparentFallback = 'data:image/gif;base64,R0lGODlhAQABAAD/ACwAAAAAAQABAAACADs=';

            let strUrl = String(url).trim();

            if (strUrl.startsWith('data:image')) return strUrl;
            
            let driveId = null;
            if (strUrl.includes('drive.google.com')) {

            } else if (/^[a-zA-Z0-9_-]{20,}$/.test(strUrl) && !strUrl.includes("/")) {

                return `https://drive.google.com/thumbnail?id=${driveId}&sz=w1000`;

        function App() {

            // 內頁視窗全螢幕控制狀態
            const [modalMaximized, setModalMaximized] = useState({});
            const toggleMaximize = (key) => setModalMaximized(prev => ({ ...prev, [key]: !prev[key] }));

            // 彈窗 Modal States
            const [showBookModal, setShowBookModal] = useState(false);
            const [editingBook, setEditingBook] = useState(null);
            const [modalType, setModalType] = useState('book');
            const [showCarouselModal, setShowCarouselModal] = useState(false);

            const [csResponseText, setCsResponseText] = useState('');
            const [isAIGenerating, setIsAIGenerating] = useState(false);

            // 記事本 state
            const [showNoteModal, setShowNoteModal] = useState(false);
            const [editingNote, setEditingNote] = useState(null);
            const [noteSearchQuery, setNoteSearchQuery] = useState('');
            const [noteCategoryFilter, setNoteCategoryFilter] = useState('全部');
            
            // AI 生成書籍導讀 state
            const [modalBookTitle, setModalBookTitle] = useState('');
            const [modalBookAuthor, setModalBookAuthor] = useState('');
            const [modalBookYear, setModalBookYear] = useState('');
            const [modalBookCategory, setModalBookCategory] = useState('');

            const [batchCategoryValue, setBatchCategoryValue] = useState('');

            const toggleMenu = (menuId) => setExpandedMenus(prev => ({ ...prev, [menuId]: !prev[menuId] }));

            const showMsg = (text) => {
                setNotification(text);
                setTimeout(() => setNotification(null), 3800);
            };

            const formatDate = (dateStr) => {
                if (!dateStr) return '-';
                const d = new Date(dateStr);
                if (isNaN(d.getTime())) return String(dateStr); 
                const yyyy = d.getFullYear(); const mm = String(d.getMonth() + 1).padStart(2, '0'); const dd = String(d.getDate()).padStart(2, '0');
                const hh = String(d.getHours()).padStart(2, '0'); const min = String(d.getMinutes()).padStart(2, '0');
                if (yyyy === 1899) return `${hh}:${min}`;
                return hh === '00' && min === '00' ? `${yyyy}/${mm}/${dd}` : `${yyyy}/${mm}/${dd} ${hh}:${min}`;
            };

            const syncWithGAS = async (action, payloadData = null) => {
                try {
                    const currentOrigin = window.location.origin;
                    const safeOrigin = currentOrigin.includes("usercontent.goog") ? "https://candylovema.github.io" : currentOrigin;

                    const payloadObj = { 
                        action: action, 
                        payload: payloadData,
                        origin: safeOrigin,
                        sessionToken: sessionToken
                    };

                    const params = new URLSearchParams();
                    params.append("action", action);
                    if (sessionToken) params.append("sessionToken", sessionToken);
                    params.append("origin", safeOrigin);

                    let payloadStr = "";
                    if (payloadData !== null && payloadData !== undefined) {
                        payloadStr = typeof payloadData === "string" ? payloadData : JSON.stringify(payloadData);
                        if (payloadStr.length < 2000) params.append("payload", payloadStr);
                    }

                    const requestUrl = `${GAS_URL}?${params.toString()}`;

                    let response = await fetch(requestUrl, {
                        method: "POST",
                        headers: { "Content-Type": "text/plain;charset=utf-8" },
                        body: JSON.stringify(payloadObj)
                    });
                    
                    let data = await response.json();
                    
                    if (data && data.status === 'error' && data.msg && data.msg.includes("Method Not Allowed")) {
                        const retryParams = new URLSearchParams();
                        retryParams.append("action", action);
                        if (sessionToken) retryParams.append("sessionToken", sessionToken);
                        retryParams.append("origin", safeOrigin);
                        if (payloadStr) retryParams.append("payload", payloadStr);

                        const retryUrl = `${GAS_URL}?${retryParams.toString()}`;
                        response = await fetch(retryUrl, { method: "GET" });
                        data = await response.json();
                    }

                    if (data.status === 'error') {
                        console.error("後端拒絕請求:", data.msg);
                        showMsg("拒絕存取: " + data.msg); 
                        if (data.msg.includes("驗證失敗") || data.msg.includes("未授權") || data.msg.includes("過期")) {
                            handleLogout();
                        }
                    }
                    
                    return data;
                } catch (e) {
                    console.error("GAS Sync Error:", e);
                    showMsg("網路安全通道異常: " + e.toString()); 
                    return { status: 'error', msg: e.toString() };
                }
            };

            useEffect(() => {
                if (!isAuthenticated || !sessionToken) return;

                syncWithGAS('FETCH_SETTINGS').then(res => {
                    if (res && res.data) setSettings(prev => ({...prev, ...res.data}));
                }).catch(() => {});

                syncWithGAS('FETCH_UI').then(res => {
                    if (res && res.data) setUi(prev => ({...prev, ...res.data}));
                }).catch(() => {});

                syncWithGAS('FETCH_KPIS').then(res => { 
                    if(res?.data) setKpis(res.data); 
                    setLoadStatus(prev => ({...prev, kpis: false})); 
                }).catch(() => setLoadStatus(prev => ({...prev, kpis: false})));
                
                syncWithGAS('FETCH_ORDERS').then(res => { 
                    if(res?.data) setOrders(res.data); 
                    setLoadStatus(prev => ({...prev, orders: false})); 
                }).catch(() => setLoadStatus(prev => ({...prev, orders: false})));
                
                syncWithGAS('FETCH_CS_LOGS').then(res => { 
                    if(res?.data) setAiLogs(res.data); 
                    setLoadStatus(prev => ({...prev, cs: false})); 
                }).catch(() => setLoadStatus(prev => ({...prev, cs: false})));
                
                syncWithGAS('FETCH_CAROUSELS').then(res => { 
                    if(res?.data) setCarousels(res.data); 
                    setLoadStatus(prev => ({...prev, carousels: false})); 
                }).catch(() => setLoadStatus(prev => ({...prev, carousels: false})));
                
                syncWithGAS('FETCH_CHOICES').then(res => { 
                    if(res?.data) setChoiceBooks(res.data); 
                    setLoadStatus(prev => ({...prev, choices: false})); 
                }).catch(() => setLoadStatus(prev => ({...prev, choices: false})));
                
                syncWithGAS('FETCH_BOOKS').then(res => { 
                    if(res?.data) setBooks(res.data); 
                    setLoadStatus(prev => ({...prev, books: false})); 
                }).catch(() => setLoadStatus(prev => ({...prev, books: false})));

                syncWithGAS('FETCH_NOTES').then(res => {
                    if(res?.data) setNotes(res.data);
                    setLoadStatus(prev => ({...prev, notes: false}));
                }).catch(() => setLoadStatus(prev => ({...prev, notes: false})));

                syncWithGAS('FETCH_AUDIT_LOGS').then(res => {
                    if(res?.data) setAuditLogs(res.data);
                    setLoadStatus(prev => ({...prev, auditLogs: false}));
                }).catch(() => setLoadStatus(prev => ({...prev, auditLogs: false})));
            }, [isAuthenticated, sessionToken]);

            // 數據計算與合併清單
            const allCombinedBooks = useMemo(() => {
                const bookMap = new Map();
                (books || []).forEach(b => {
                    bookMap.set(String(b.id), { ...b, inBookAll: true, inChoice: false });
                });
                (choiceBooks || []).forEach(c => {
                    const idStr = String(c.id);
                    if (bookMap.has(idStr)) {
                        bookMap.set(idStr, { ...bookMap.get(idStr), inChoice: true });
                    } else {
                        bookMap.set(idStr, { ...c, inBookAll: false, inChoice: true });
                    }
                });
                return Array.from(bookMap.values());
            }, [books, choiceBooks]);

            const allCategories = useMemo(() => {
                const cats = allCombinedBooks.map(b => b.category).filter(c => c && c.trim() !== "");
                return ['全部', ...new Set(cats)].sort();
            }, [allCombinedBooks]);

            const filteredPriceBooks = useMemo(() => {
                const query = priceSearchQuery.toLowerCase().trim();
                return allCombinedBooks.filter(b => {
                    const matchQuery = !query || 
                        (b.title && b.title.toLowerCase().includes(query)) ||
                        (b.id && String(b.id).toLowerCase().includes(query)) ||
                        (b.author && b.author.toLowerCase().includes(query));
                    const matchCategory = priceCategoryFilter === '全部' || b.category === priceCategoryFilter;
                    return matchQuery && matchCategory;
                });
            }, [allCombinedBooks, priceSearchQuery, priceCategoryFilter]);

            const filteredAuditLogs = useMemo(() => {
                const query = auditSearchQuery.toLowerCase().trim();
                return (auditLogs || []).filter(l => {
                    return !query || 
                        (l.bookTitle && l.bookTitle.toLowerCase().includes(query)) ||
                        (l.bookId && String(l.bookId).toLowerCase().includes(query)) ||
                        (l.field && l.field.toLowerCase().includes(query)) ||
                        (l.user && l.user.toLowerCase().includes(query));
                });
            }, [auditLogs, auditSearchQuery]);

            const handleSaveSingleBookSettings = async (book, newFields) => {
                const changes = [];
                const nowStr = new Date().toLocaleString("zh-TW");

                if (newFields.price !== undefined && Number(newFields.price) !== Number(book.price)) {
                    changes.push({ field: '定價', oldVal: `NT$ ${book.price}`, newVal: `NT$ ${newFields.price}`, user: activeUser, timestamp: nowStr });
                }
                if (newFields.stock !== undefined && Number(newFields.stock) !== Number(book.stock)) {
                    changes.push({ field: '庫存', oldVal: `${book.stock}本`, newVal: `${newFields.stock}本`, user: activeUser, timestamp: nowStr });
                }
                if (newFields.category !== undefined && newFields.category !== book.category) {
                    changes.push({ field: '分類', oldVal: book.category, newVal: newFields.category, user: activeUser, timestamp: nowStr });
                }
                if (newFields.title !== undefined && newFields.title !== book.title) {
                    changes.push({ field: '書名', oldVal: book.title, newVal: newFields.title, user: activeUser, timestamp: nowStr });
                }

                if (changes.length === 0) {
                    showMsg('未有任何欄位變更');
                    return;
                }

                showMsg(`正在向雲端寫入變更並記錄歷史...`);

                const sheetsToUpdate = syncTargetSheet === 'DUAL' ? ["Book_ALL", "Choice"] : [syncTargetSheet];
                const payload = {
                    ...book,
                    ...newFields,
                    targetSheets: sheetsToUpdate,
                    logs: changes
                };

                const res = await syncWithGAS('UPDATE_BOOK_DUAL', payload);

                if (res.status === 'success') {
                    const updatedBook = { ...book, ...newFields };
                    if (sheetsToUpdate.includes("Book_ALL")) {
                        setBooks(prev => prev.map(b => String(b.id) === String(book.id) ? updatedBook : b));
                    }
                    if (sheetsToUpdate.includes("Choice")) {
                        setChoiceBooks(prev => prev.map(c => String(c.id) === String(book.id) ? updatedBook : c));
                    }

                    const newLogEntries = changes.map(c => ({
                        timestamp: nowStr,
                        user: activeUser,
                        bookId: String(book.id),
                        bookTitle: newFields.title || book.title,
                        field: c.field,
                        oldVal: c.oldVal,
                        newVal: c.newVal,
                        targetSheet: sheetsToUpdate.join(" & ")
                    }));
                    setAuditLogs(prev => [...newLogEntries, ...prev]);

                    showMsg(`✅ 已同步寫入 (${sheetsToUpdate.join(" & ")}) 並建立 ${changes.length} 筆修改紀錄`);
                } else {
                    showMsg(`❌ 變更失敗: ${res.msg}`);
                }
            };

            const handleApplyBatchChanges = async () => {
                if (selectedBookIds.length === 0) {
                    showMsg('請先勾選欲批次調整的書籍');
                    return;
                }

                if (!batchPriceValue && !batchCategoryValue && !batchStockValue) {
                    showMsg('請輸入欲調整的批次數值或分類');
                    return;
                }

                const targetBooks = allCombinedBooks.filter(b => selectedBookIds.includes(String(b.id)));
                const updatedItems = [];
                const newAuditLogs = [];
                const nowStr = new Date().toLocaleString("zh-TW");
                const sheetsToUpdate = syncTargetSheet === 'DUAL' ? ["Book_ALL", "Choice"] : [syncTargetSheet];

                targetBooks.forEach(book => {
                    let newPrice = book.price;
                    let newStock = book.stock;
                    let newCat = book.category;

                    if (batchPriceValue !== '') {
                        const val = parseFloat(batchPriceValue);
                        if (!isNaN(val)) {
                            if (batchPriceType === 'fixed') newPrice = Math.max(0, Math.round(val));
                            else if (batchPriceType === 'amount_add') newPrice = Math.max(0, Math.round(book.price + val));
                            else if (batchPriceType === 'amount_sub') newPrice = Math.max(0, Math.round(book.price - val));
                            else if (batchPriceType === 'percent_add') newPrice = Math.max(0, Math.round(book.price * (1 + val / 100)));
                            else if (batchPriceType === 'percent_sub') newPrice = Math.max(0, Math.round(book.price * (1 - val / 100)));
                        }
                    }

                    if (batchStockValue !== '') {
                        const stVal = parseInt(batchStockValue, 10);
                        if (!isNaN(stVal)) newStock = Math.max(0, stVal);
                    }

                    if (batchCategoryValue.trim() !== '') {
                        newCat = batchCategoryValue.trim();
                    }

                    if (newPrice !== book.price) {
                        newAuditLogs.push({
                            timestamp: nowStr, user: activeUser, bookId: String(book.id), bookTitle: book.title,
                            field: '價格(批次)', oldVal: `NT$ ${book.price}`, newVal: `NT$ ${newPrice}`, targetSheet: sheetsToUpdate.join(" & ")
                        });
                    }
                    if (newStock !== book.stock) {
                        newAuditLogs.push({
                            timestamp: nowStr, user: activeUser, bookId: String(book.id), bookTitle: book.title,
                            field: '庫存(批次)', oldVal: `${book.stock}本`, newVal: `${newStock}本`, targetSheet: sheetsToUpdate.join(" & ")
                        });
                    }
                    if (newCat !== book.category) {
                        newAuditLogs.push({
                            timestamp: nowStr, user: activeUser, bookId: String(book.id), bookTitle: book.title,
                            field: '分類(批次)', oldVal: book.category, newVal: newCat, targetSheet: sheetsToUpdate.join(" & ")
                        });
                    }

                    updatedItems.push({ id: book.id, price: newPrice, stock: newStock, category: newCat });
                });

                showMsg(`正在批次同步 ${updatedItems.length} 本書籍至雲端...`);

                const res = await syncWithGAS('BATCH_UPDATE_BOOKS', {
                    items: updatedItems,
                    targetSheets: sheetsToUpdate
                });

                if (res.status === 'success') {
                    newAuditLogs.forEach(log => {
                        syncWithGAS('ADD_AUDIT_LOG', log);
                    });

                    const updatedMap = new Map(updatedItems.map(i => [String(i.id), i]));
                    if (sheetsToUpdate.includes("Book_ALL")) {
                        setBooks(prev => prev.map(b => updatedMap.has(String(b.id)) ? { ...b, ...updatedMap.get(String(b.id)) } : b));
                    }
                    if (sheetsToUpdate.includes("Choice")) {
                        setChoiceBooks(prev => prev.map(c => updatedMap.has(String(c.id)) ? { ...c, ...updatedMap.get(String(c.id)) } : c));
                    }

                    setAuditLogs(prev => [...newAuditLogs, ...prev]);
                    setSelectedBookIds([]);
                    setBatchPriceValue('');
                    setBatchCategoryValue('');
                    setBatchStockValue('');
                    showMsg(`🎉 成功批次完成 ${updatedItems.length} 本書籍價格與設定調整！`);
                } else {
                    showMsg(`❌ 批次更新失敗: ${res.msg}`);
                }
            };

            const toggleSelectBook = (idStr) => {
                setSelectedBookIds(prev => prev.includes(idStr) ? prev.filter(x => x !== idStr) : [...prev, idStr]);
            };

            const toggleSelectAllBooks = () => {
                if (selectedBookIds.length === filteredPriceBooks.length) {
                    setSelectedBookIds([]);
                } else {
                    setSelectedBookIds(filteredPriceBooks.map(b => String(b.id)));
                }
            };

            const handleLogin = async (e) => {
                e.preventDefault();
                if (isLoggingIn) return;
                setIsLoggingIn(true);
                showMsg('正在向雲端安全性通道驗證身分...');

                const username = e.target.username.value;
                const password = e.target.password.value;

                try {
                    const res = await syncWithGAS('LOGIN', { user: username, password: password });
                    if (res && res.status === 'success' && res.sessionToken) {
                        sessionStorage.setItem('lapen_cms_auth', 'true');
                        sessionStorage.setItem('lapen_cms_token', res.sessionToken);
                        sessionStorage.setItem('lapen_cms_user', username);
                        
                        setIsAuthenticated(true);
                        setSessionToken(res.sessionToken);
                        setActiveUser(username);
                        showMsg('身分驗證通過，Session 令牌已安全儲存！');
                    } else {
                        showMsg('登入失敗：' + (res.msg || '帳號或密碼錯誤'));
                    }
                } catch (err) {
                    showMsg('驗證發生異常：' + err.toString());
                } finally {
                    setIsLoggingIn(false);
                }
            };

            const handleLogout = () => {
                sessionStorage.clear();
                setIsAuthenticated(false);
                setSessionToken('');
                setActiveUser('');
                setBooks([]); setChoiceBooks([]); setCarousels([]); setOrders([]); setAiLogs([]); setNotes([]); setAuditLogs([]);
                showMsg('Session 令牌已安全銷毀，您已成功登出。');
            };

            const adminMenuConfig = [
                { id: 'group_dash', title: settings.menuDashName, icon: availableIcons[settings.menuDashIcon]?.icon || LayoutDashboard, items: [{ tab: 'dashboard', name: '營運儀表板' }] },
                { id: 'group_marketing', title: settings.menuMarketingName, icon: availableIcons[settings.menuMarketingIcon]?.icon || Sparkles, items: [
                    { tab: 'carousel', name: '首頁熱賣輪播 (Carousels)' },
                    { tab: 'choice', name: '編輯推薦書單 (Choice)' } 
                ]},
                { id: 'group_books', title: settings.menuBooksName, icon: availableIcons[settings.menuBooksIcon]?.icon || Database, items: [
                    { tab: 'books', name: '全部書籍管理 (Book_ALL)' },
                    { tab: 'price_editor', name: '💰 書籍價格與設定雙向同步' },
                    { tab: 'audit_logs', name: '📜 修改異動歷史紀錄' }
                ]},
                { id: 'group_orders', title: settings.menuOrdersName, icon: availableIcons[settings.menuOrdersIcon]?.icon || Truck, items: [{ tab: 'orders', name: '訂單處理中心 (Orders)' }] },
                { id: 'group_cs', title: settings.menuCsName, icon: availableIcons[settings.menuCsIcon]?.icon || Bot, items: [{ tab: 'ai', name: 'AI 客服信箱 (CS Logs)' }] },
                { id: 'group_notes', title: settings.menuNotesName || '工作記事本', icon: FileText, items: [{ tab: 'notes', name: '雲端筆記中心 (Notes)' }] },
                { id: 'group_settings', title: '系統外觀設定', icon: SettingsIcon, items: [{ tab: 'settings', name: '全域設定與顏色 (Setting)' }] }
            ];

            const settingSubTabs = [
                { id: 'backend', label: '🖥️ 後台管理外觀' },
                { id: 'frontend_colors', label: '🎨 前台視覺配色與字體' },
                { id: 'frontend_text', label: '📝 前台選單與迎賓' },
                { id: 'frontend_footer', label: '🏢 聯絡資訊與故事' },
                { id: 'frontend_search', label: '🔍 檢索與狀態提示' }
            ];

            if (!isAuthenticated) {
                return (
                    <div className="min-h-screen flex flex-col items-center justify-center p-4 relative overflow-hidden transition-colors duration-500" style={{ backgroundColor: settings.loginBgColor }}>
                        <div className="absolute top-[-10%] left-[-10%] w-[50%] h-[50%] bg-indigo-600/30 blur-[120px] rounded-full pointer-events-none"></div>
                        <div className="absolute bottom-[-10%] right-[-10%] w-[50%] h-[50%] bg-emerald-600/20 blur-[120px] rounded-full pointer-events-none"></div>
                        
                        <div className="glass-card p-10 md:p-12 rounded-[2.5rem] w-full max-w-md shadow-[0_20px_60px_rgba(0,0,0,0.5)] animate-in z-10" style={{ backgroundColor: settings.loginCardBgColor, color: settings.loginTextColor }}>
                            <div className="text-center mb-10">
                                <div className="bg-gradient-to-br from-zinc-800 to-zinc-950 w-20 h-20 rounded-[1.5rem] flex items-center justify-center text-white mx-auto mb-6 shadow-2xl border border-zinc-700 overflow-hidden relative">
                                    {settings.logoUrl ? (
                                        <img src={formatImageUrl(settings.logoUrl)} className="w-full h-full object-cover absolute inset-0 z-10" alt="Logo" />
                                    ) : (
                                        <ShieldCheck size={36} className="text-indigo-400" />
                                    )}
                                </div>
                                <h2 className="text-3xl font-black tracking-tight" style={{ color: settings.loginTextColor }}>{settings.systemName}</h2>
                                <p className="text-sm mt-3 font-bold uppercase tracking-[0.3em]" style={{ color: settings.loginTextColor, opacity: 0.85 }}>{settings.systemSubName}</p>
                            </div>
                            
                            <form onSubmit={handleLogin} className="space-y-6">
                                <div className="space-y-2">
                                    <label className="text-[10px] font-black uppercase tracking-widest ml-1" style={{ color: settings.loginTextColor, opacity: 0.7 }}>管理員帳號</label>
                                    <input name="username" type="text" placeholder="您的管理員用戶名稱" className="w-full bg-transparent border p-4 rounded-2xl outline-none font-bold transition-colors shadow-sm text-sm" required style={{ color: settings.loginTextColor, borderColor: 'rgba(128,128,128,0.2)' }} />
                                </div>

                                <div className="space-y-2">
                                    <label className="text-[10px] font-black uppercase tracking-widest ml-1" style={{ color: settings.loginTextColor, opacity: 0.7 }}>通行密碼</label>
                                    <input name="password" type="password" placeholder="••••••••" className="w-full bg-transparent border p-4 rounded-2xl outline-none font-bold transition-colors shadow-sm tracking-widest" required style={{ color: settings.loginTextColor, borderColor: 'rgba(128,128,128,0.2)' }} />
                                </div>

                                <button disabled={isLoggingIn} className="w-full text-white py-4 rounded-2xl font-bold transition-all duration-300 shadow-xl flex justify-center items-center gap-2 text-lg mt-4 hover:scale-105 border border-white/10 disabled:opacity-50" style={{ backgroundColor: settings.sidebarActiveColor }}>
                                    {isLoggingIn ? <Clock className="animate-spin" size={18} /> : null}
                                    {isLoggingIn ? '正在安全校驗身分...' : '安全登入'} <ChevronRight size={18}/>
                                </button>
                                
                                <div className="text-center pt-4">
                                    <button type="button" onClick={() => { window.open('index.html', '_self'); }} className="text-xs font-bold transition-colors hover:opacity-100" style={{ color: settings.loginTextColor, opacity: 0.6 }}>← 返回前台官網</button>
                                </div>
                            </form>
                        </div>
                        <div className="absolute bottom-6 text-[10px] font-bold tracking-widest uppercase" style={{ color: settings.loginTextColor, opacity: 0.5 }}>Secured by SSL with Session Tokens</div>
                    </div>
                );
            }

            return (
                <div className="flex h-screen overflow-hidden font-sans relative" style={{ backgroundColor: settings.mainBgColor, color: settings.mainTextColor }}>
                    {!isSidebarOpen && (
                        <button type="button" onClick={() => setIsSidebarOpen(true)} className="fixed top-4 left-4 z-[60] w-14 h-14 rounded-full shadow-2xl flex items-center justify-center overflow-hidden hover:scale-105 transition-all border-2 border-white/20 cursor-pointer" style={{ backgroundColor: (settings.userAvatarUrl || settings.logoUrl) ? 'transparent' : settings.sidebarActiveColor }} title="展開側邊欄">
                            {(settings.userAvatarUrl || settings.logoUrl) ? (
                                <img src={formatImageUrl(settings.userAvatarUrl || settings.logoUrl)} className="w-full h-full object-cover" alt="Expand" />
                            ) : (
                                <Menu size={24} className="text-white" />
                            )}
                        </button>
                    )}

                    <aside className={`flex-shrink-0 transition-all z-30 shadow-2xl flex flex-col ${isSidebarOpen ? '' : '-translate-x-full absolute md:relative'}`} style={{ width: isSidebarOpen ? '260px' : '0px', backgroundColor: settings.sidebarBgColor }}>
                        <div className="flex items-center gap-3 h-20 shrink-0 border-b border-white/5 cursor-pointer hover:bg-white/5 transition-colors pr-4" onClick={() => setIsSidebarOpen(false)} title="點擊收起側邊欄">
                            <div className="h-full aspect-square text-white flex items-center justify-center overflow-hidden shrink-0 shadow-sm p-0" style={{ backgroundColor: settings.logoUrl ? 'transparent' : settings.sidebarActiveColor }}>
                                {settings.logoUrl ? (
                                    <img src={formatImageUrl(settings.logoUrl)} className="w-full h-full object-cover" alt="Logo" onError={(e)=>{e.target.style.display='none'}} />
                                ) : (
                                    <BookOpen size={24} className="text-white" />
                                )}
                            </div>
                            <div className="overflow-hidden flex flex-col justify-center gap-1 py-2">
                                {settings.subLogoUrl ? (
                                    <img src={formatImageUrl(settings.subLogoUrl)} className="h-6 object-contain object-left" alt="SubLogo" />
                                ) : (
                                    <span className="font-black tracking-widest uppercase text-base block truncate" style={{ color: settings.adminPanelColor || settings.sidebarTextColor }}>{settings.adminPanelName || 'ADMIN PANEL'}</span>
                                )}
                                <span className="text-xs font-bold tracking-widest uppercase mt-1" style={{ color: settings.sidebarTextColor, opacity: 0.85 }}>{settings.sidebarSubText || 'Digital CMS'}</span>
                            </div>
                        </div>

                        <nav className="p-4 space-y-2 overflow-y-auto flex-1 sidebar-scroll">
                            {adminMenuConfig.map(menuGroup => (
                                <div key={menuGroup.id} className="mb-2">
                                    <button type="button" onClick={() => toggleMenu(menuGroup.id)} className="w-full flex items-center justify-between p-3 rounded-xl transition-all hover:bg-white/5" style={expandedMenus[menuGroup.id] ? { backgroundColor: 'rgba(255,255,255,0.05)', color: '#ffffff' } : { color: settings.sidebarTextColor }}>
                                        <div className="flex items-center gap-3">
                                            <menuGroup.icon size={18} style={{ color: expandedMenus[menuGroup.id] ? settings.sidebarActiveColor : settings.sidebarTextColor }} />
                                            <span className="font-bold text-sm tracking-wide">{menuGroup.title}</span>

                                                        {isActive && <span className="w-1.5 h-1.5 rounded-full bg-white"></span>}
                                                        {item.name}
                                                        {item.isExternal && <ExternalLink size={12} className="ml-auto opacity-50" />}
                                                    </button>
                                                )
                                            })}
                                        </div>
                                    )}
                                </div>
                            ))}
                        </nav>
                        <div className="p-4 border-t border-white/5 shrink-0" style={{ backgroundColor: 'rgba(0,0,0,0.2)' }}>

                                <div className="w-10 h-10 rounded-full flex items-center justify-center font-bold text-sm text-white border border-white/20 shrink-0 overflow-hidden shadow-sm" style={{ backgroundColor: settings.userAvatarUrl ? 'transparent' : settings.sidebarActiveColor }}>
                                    {settings.userAvatarUrl ? (
                                        <img src={formatImageUrl(settings.userAvatarUrl)} className="w-full h-full object-cover" alt="User" onError={(e)=>{e.target.style.display='none'}} />
                                    ) : (
                                        activeUser.charAt(0).toUpperCase()
                                    )}
                                </div>
                                <div className="overflow-hidden">
                                    <div className="text-xs font-bold leading-tight truncate" style={{ color: settings.sidebarUserColor || settings.sidebarTextColor }}>{activeUser}</div>

                                </div>

                            <button type="button" onClick={() => { window.open('index.html', '_blank'); }} className="w-full flex items-center justify-center gap-2 p-3 rounded-xl bg-white/5 hover:bg-white/10 transition text-xs font-bold shadow-sm" style={{ color: settings.sidebarTextColor }}><Globe size={14} /> 前往前台官網</button>

                            <div className="flex items-center gap-4">

                                                                </button>
                                                                <button type="button" onClick={() => openDeleteModal('note', n.id, n.title)} className="p-1.5 rounded-lg hover:bg-black/10 text-red-500" title="刪除">
                                                                    <Trash2 size={14} />
                                                                </button>
                                                            </div>
                                                        </div>

                                                        <h4 className="text-lg font-black mb-2 line-clamp-1">{n.title}</h4>
                                                        <p className="text-xs opacity-80 whitespace-pre-wrap line-clamp-6 leading-relaxed flex-1 font-medium">{n.content || '（無內文）'}</p>

                                                        {n.tags && (
                                                            <div className="flex flex-wrap gap-1 mt-4 pt-3 border-t border-black/5">
                                                                {String(n.tags).split(',').map((tag, idx) => (
                                                                    <span key={idx} className="text-[10px] font-bold opacity-60 bg-black/5 px-2 py-0.5 rounded-md">#{tag.trim()}</span>
                                                                ))}
                                                            </div>
                                                        )}

                                                        <div className="mt-4 pt-2 text-[10px] opacity-40 font-bold flex justify-between items-center border-t border-black/5">
                                                            <span>作者: {n.author || activeUser}</span>
                                                            <span>{formatDate(n.updatedAt || n.date)}</span>
                                                        </div>
                                                    </div>
                                                );
                                            })}
                                        </div>
                                    ) : (
                                        <div className="p-20 text-center font-bold rounded-[2rem] border-dashed border-2 border-black/10 opacity-60 flex flex-col items-center justify-center gap-3">
                                            <FileText size={36} className="opacity-30" />
                                            <span>目前沒有任何記事內容，點擊右上角新增您的第一篇工作筆記！</span>
                                        </div>
                                    )}
                                </div>
                            )}

                            {(activeTab === 'books' || activeTab === 'choice') && (
                                <div className="animate-in flex flex-col relative h-full min-h-[500px]">
                                    <div className="mb-6 flex flex-wrap justify-between items-center gap-4 shrink-0">
                                        <div className="flex items-center gap-3 p-3 rounded-2xl shadow-[0_2px_10px_rgb(0,0,0,0.02)] border border-black/5 w-full max-w-md" style={{ backgroundColor: settings.cardBgColor, color: settings.cardTextColor }}>
                                            <Search size={18} className="opacity-50 ml-2 shrink-0" />
                                            <input 
                                                type="text" 
                                                placeholder={`在 ${activeTab === 'choice' ? '編輯推薦' : '全部庫存 (Book_ALL)'} 中搜尋書碼、書名...`} 
                                                value={bookSearchQuery} 
                                                onChange={e => {
                                                    setBookSearchQuery(e.target.value);
                                                    setAdminVisibleCount(20); 
                                                }} 
                                                className="w-full bg-transparent outline-none text-sm font-bold placeholder-black/30 p-1"
                                                style={{ color: 'inherit' }}
                                            />
                                            {bookSearchQuery && <button type="button" onClick={()=>{setBookSearchQuery(''); setAdminVisibleCount(20);}} className="opacity-50 hover:opacity-100 px-2 bg-black/5 rounded-full p-1"><X size={12}/></button>}
                                        </div>
                                        <div className="text-xs font-bold opacity-60">
                                            共 {filteredAdminBooks.length} 筆書籍（已顯示 {visibleAdminBooks.length} 筆）
                                        </div>
                                    </div>

                                    {loadStatus.books && activeTab === 'books' ? (
                                        <div className="flex flex-col items-center justify-center p-20 opacity-50"><Database size={32} className="animate-bounce mb-4" style={{ color: settings.sidebarActiveColor }} /><p className="font-bold text-xs" style={{ color: settings.mainTextColor }}>正在從雲端載入全館書籍...</p></div>
                                    ) : (
                                        <div className="rounded-[2rem] border border-black/5 shadow-[0_8px_30px_rgb(0,0,0,0.04)] overflow-hidden flex flex-col" style={{ backgroundColor: settings.cardBgColor, color: settings.cardTextColor }}>
                                            <div className="overflow-x-auto pb-4 sidebar-scroll">
                                                <table className="w-full text-left border-collapse min-w-[850px] table-fixed">
                                                    <thead className="border-b border-black/10" style={{ backgroundColor: 'rgba(0,0,0,0.03)' }}>
                                                        <tr className="text-[10px] font-black uppercase tracking-[0.15em] opacity-60">
                                                            <th className="p-4 pl-6 w-[18%]">操作</th>
                                                            <th className="p-4 w-[28%]">書籍詳情 (書碼)</th>
                                                            <th className="p-4 w-[18%]">作者 / 年份</th>
                                                            <th className="p-4 w-[14%]">類別</th>
                                                            <th className="p-4 w-[11%]">庫存</th>
                                                            <th className="p-4 w-[11%] pr-6">價格</th>
                                                        </tr>
                                                    </thead>
                                                    <tbody className="text-sm font-bold divide-y divide-black/5">
                                                        {visibleAdminBooks.map(b => (
                                                            <tr key={b.id} className="hover:bg-black/5 transition-colors group">
                                                                <td className="p-4 pl-6 whitespace-nowrap">
                                                                    <div className="flex items-center gap-2">
                                                                        <button type="button" onClick={() => { setModalType(activeTab); setEditingBook(b); setShowBookModal(true); }} className="opacity-90 hover:opacity-100 p-2 px-3 rounded-xl transition-all bg-indigo-50 hover:bg-indigo-100 text-indigo-600 flex items-center gap-1.5 text-xs shadow-sm font-bold" title="編輯並可使用 AI 生成介紹與心得">
                                                                            <Wand2 size={14}/> AI 編輯
                                                                        </button>
                                                                        <button type="button" onClick={() => openDeleteModal(activeTab === 'choice' ? 'choice' : 'book', b.id, b.title)} className="opacity-50 hover:opacity-100 hover:text-red-500 p-2 rounded-xl transition-all bg-black/5" title="刪除"><Trash2 size={16}/></button>
                                                                    </div>
                                                                </td>
                                                                <td className="p-4 flex items-center gap-4 overflow-hidden">
                                                                    <img src={formatImageUrl(b.cover)} className="w-10 h-14 object-cover rounded-lg shadow-sm border border-black/10 bg-white shrink-0 group-hover:scale-105 transition-transform" onError={(e)=>e.target.src='https://via.placeholder.com/40x50?text=?'}/>
                                                                    <div className="flex-1 min-w-0">
                                                                        <div className="truncate text-sm font-black">{b.title}</div>
                                                                        <div className="text-[10px] font-mono mt-1 bg-black/5 inline-block px-2 py-0.5 rounded opacity-70">#{b.id}</div>
                                                                    </div>
                                                                </td>
                                                                <td className="p-4 whitespace-nowrap overflow-hidden">
                                                                    <div className="text-sm opacity-90 truncate">{b.author || '-'}</div>
                                                                    <div className="text-[10px] mt-0.5 opacity-50 truncate">{b.year || '-'} 年</div>
                                                                </td>
                                                                <td className="p-4 font-normal whitespace-nowrap overflow-hidden"><span className="bg-black/5 px-3 py-1.5 rounded-full text-[11px] font-bold border border-black/10 inline-block whitespace-nowrap truncate" style={{ color: 'inherit' }}>{b.category}</span></td>
                                                                <td className="p-4 whitespace-nowrap overflow-hidden"><span className={`${b.stock < 10 ? 'text-red-500 bg-red-500/10 border-red-500/20' : 'opacity-80 bg-black/5 border-black/10'} px-3 py-1.5 rounded-full text-[11px] border inline-block whitespace-nowrap truncate`}>{b.stock} 本</span></td>
                                                                <td className="p-4 font-mono whitespace-nowrap opacity-90 overflow-hidden pr-6">NT$ {b.price}</td>
                                                            </tr>
                                                        ))}
                                                    </tbody>
                                                </table>
                                            </div>
                                        </div>
                                    )}
                                </div>
                            )}

                            {activeTab === 'orders' && (
                                <div className="rounded-[2rem] border border-black/5 shadow-[0_8px_30px_rgb(0,0,0,0.04)] overflow-hidden animate-in flex flex-col relative h-full min-h-[500px]" style={{ backgroundColor: settings.cardBgColor, color: settings.cardTextColor }}>
                                    {loadStatus.orders ? (
                                        <div className="flex justify-center items-center h-48 opacity-60"><Clock size={20} className="animate-spin mr-2"/> 載入訂單中...</div>
                                    ) : (
                                        <div className="overflow-x-auto pb-4 sidebar-scroll">
                                            <table className="w-full text-left border-collapse min-w-[900px]">
                                                <thead className="border-b border-black/10" style={{ backgroundColor: 'rgba(0,0,0,0.03)' }}>
                                                    <tr className="text-[10px] font-black uppercase tracking-[0.15em] opacity-60">
                                                        <th className="p-4 pl-6 w-[20%]">單號 / 日期</th>
                                                        <th className="p-4 w-[20%]">客戶資訊</th>
                                                        <th className="p-4 w-[30%]">購買摘要</th>
                                                        <th className="p-4 w-[15%]">帳務明細</th>
                                                        <th className="p-4 w-[15%] text-right pr-6">狀態管理</th>
                                                    </tr>
                                                </thead>
                                                <tbody className="text-sm font-bold divide-y divide-black/5">{orders.map(o => (
                                                    <tr key={o.id} className="hover:bg-black/5 transition-colors">
                                                        <td className="p-4 pl-6 whitespace-nowrap">
                                                            <button type="button" onClick={() => { setEditingOrder(o); setShowOrderModal(true); }} className="font-mono text-[13px] bg-black/5 hover:bg-black/10 opacity-80 hover:opacity-100 px-3 py-1.5 rounded-lg transition-colors flex items-center gap-1.5 group whitespace-nowrap" style={{ color: 'inherit' }}>#{o.id} <FileEdit size={12} className="opacity-50 group-hover:opacity-100"/></button>
                                                            <div className="text-[10px] opacity-60 mt-2 font-sans pl-1 whitespace-nowrap">{formatDate(o.date)}</div>
                                                        </td>
                                                        <td className="p-4 whitespace-nowrap">
                                                            <div className="text-base opacity-90">{o.customer}</div>
                                                            <div className="text-[11px] opacity-70 font-normal mt-1 flex items-center gap-1"><Phone size={10}/> {o.phone}</div>
                                                            <div className="text-[11px] opacity-50 font-normal mt-0.5 flex items-center gap-1"><Mail size={10}/> {o.email || '未提供'}</div>
                                                        </td>
                                                        <td className="p-4 text-xs font-normal opacity-80 leading-relaxed max-w-[250px]">
                                                            <div className="line-clamp-2" title={o.items}>{o.items}</div>
                                                            {o.memo && <div className="mt-1 truncate font-bold" title={o.memo} style={{ color: settings.sidebarActiveColor }}>備註: {o.memo}</div>}
                                                        </td>
                                                        <td className="p-4 whitespace-nowrap">
                                                            <div className="font-mono font-black text-base whitespace-nowrap" style={{ color: 'inherit' }}>NT$ {o.total}</div>
                                                            <div className="text-[10px] font-bold mt-1 bg-black/5 opacity-80 inline-block px-2 py-0.5 rounded whitespace-nowrap">{o.payment || '未指定'}</div>
                                                        </td>
                                                        <td className="p-4 text-right pr-6 whitespace-nowrap">
                                                            <select value={o.status} onChange={async (e)=>{ const ns = e.target.value; setOrders(orders.map(x=>x.id===o.id?{...x, status: ns}:x)); await syncWithGAS('UPDATE_ORDER_STATUS', {id: o.id, status: ns}); showMsg(`單號 ${o.id} 已切換為 ${ns}`); }} className="border-2 border-black/10 bg-transparent rounded-xl px-3 py-2 text-xs font-bold outline-none cursor-pointer transition-colors" style={{ color: 'inherit' }}>
                                                                <option>處理中</option><option>已派送</option><option>已完成</option><option>已取消</option>
                                                            </select>
                                                        </td>
                                                    </tr>
                                                ))}
                                                {orders.length === 0 && <tr><td colSpan="5" className="p-20 text-center opacity-50 border-dashed border-2 border-black/10 m-4 rounded-xl">尚無訂單紀錄</td></tr>}
                                                </tbody>
                                            </table>
                                        </div>
                                    )}
                                </div>
                            )}

                            {activeTab === 'ai' && (
                                <div className="animate-in">
                                    {loadStatus.cs ? (
                                        <div className="text-sm font-bold animate-pulse text-center p-10 opacity-60">同步客訴紀錄中...</div>
                                    ) : aiLogs.length > 0 ? (
                                        <div className="grid grid-cols-1 lg:grid-cols-2 gap-6">
                                            {aiLogs.map(log => (
                                                <div key={log.id} className="p-8 rounded-[2rem] border border-black/5 shadow-[0_8px_30px_rgb(0,0,0,0.04)] relative overflow-hidden flex flex-col" style={{ backgroundColor: settings.cardBgColor, color: settings.cardTextColor }}>
                                                    <div className={`absolute top-0 left-0 w-1.5 h-full ${log.status === '已回覆' ? 'bg-emerald-400' : 'bg-indigo-500'}`}></div>
                                                    <div className="flex justify-between items-start mb-6 pl-2">
                                                        <div className="flex items-center gap-4">
                                                            <div className="bg-black/5 w-12 h-12 rounded-2xl flex items-center justify-center opacity-60 border border-black/10"><User size={20}/></div>
                                                            <div><p className="font-black text-lg opacity-90">{log.user}</p><p className="text-[10px] font-bold opacity-50 tracking-wider uppercase mt-0.5">{formatDate(log.timestamp)} • {log.platform}</p></div>
                                                        </div>
                                                        <span className={`text-[10px] font-black px-4 py-1.5 rounded-full tracking-widest border ${log.status === '已回覆' ? 'border-emerald-500/50 text-emerald-500 bg-emerald-500/10' : 'border-red-500/50 text-red-500 bg-red-500/10 animate-pulse shadow-sm shadow-red-500/20'}`}>{log.status}</span>
                                                    </div>
                                                    <div className="text-sm bg-black/5 p-5 rounded-2xl mb-6 font-bold border border-black/10 leading-relaxed opacity-80 relative ml-2 whitespace-pre-wrap">
                                                        <div className="absolute -left-2 -top-2 text-zinc-400 rounded-full" style={{ backgroundColor: settings.cardBgColor }}><MessageSquare size={16}/></div>
                                                        {log.query}
                                                    </div>
                                                    <div className="mt-auto ml-2">
                                                        {log.response ? (
                                                            <div className="text-xs bg-indigo-50 text-indigo-900 p-5 rounded-2xl border border-indigo-100 font-bold leading-relaxed relative group whitespace-pre-wrap">
                                                                {log.response}
                                                                <button type="button" onClick={() => { setEditingCSLog(log); setCsResponseText(log.response); setShowCSModal(true); }} className="absolute top-3 right-3 opacity-0 group-hover:opacity-100 bg-white border border-indigo-100 px-3 py-1.5 rounded-lg shadow-sm text-[10px] text-indigo-600 hover:bg-indigo-600 hover:text-white transition-all flex items-center gap-1"><Edit2 size={10}/> 修改回覆</button>
                                                            </div>
                                                        ) : (
                                                            <button type="button" onClick={() => { setEditingCSLog(log); setCsResponseText(''); setShowCSModal(true); }} className="w-full text-white py-3.5 rounded-2xl text-xs font-bold shadow-lg opacity-90 hover:opacity-100 transition-all active:scale-95 flex items-center justify-center gap-2" style={{ backgroundColor: settings.sidebarActiveColor }}>
                                                                <MessageSquare size={14}/> 擬定回覆
                                                            </button>
                                                        )}
                                                    </div>
                                                </div>
                                            ))}
                                        </div>
                                    ) : (
                                        <div className="p-20 text-center font-bold rounded-[2rem] border-dashed border-2 border-black/10 opacity-50" style={{ backgroundColor: settings.cardBgColor, color: settings.cardTextColor }}>目前沒有任何讀者反映。</div>
                                    )}
                                </div>
                            )}
                        </div>
                    </main>

                    {/* Notifications */}
                    {notification && (
                        <div className="fixed bottom-12 right-12 bg-zinc-900 text-white px-8 py-5 rounded-2xl shadow-2xl animate-in font-bold text-sm z-[200] flex items-center gap-3 border border-zinc-700">
                            <CheckCircle size={20} className="text-emerald-400" /> {notification}
                        </div>
                    )}
                </div> 
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
