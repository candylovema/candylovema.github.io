        const parseCSVText = (text) => {
            if (!text) return [];
            const lines = text.split(/\r?\n/);
            return lines.map(line => {
                const result = [];
                let current = '';
                let inQuotes = false;
                for (let i = 0; i < line.length; i++) {
                    const char = line[i];
                    if (char === '"') {
                        if (inQuotes && line[i + 1] === '"') {
                            current += '"';
                            i++;
                        } else {
                            inQuotes = !inQuotes;
                        }
                    } else if (char === ',' && !inQuotes) {
                        result.push(current.trim());
                        current = '';
                    } else {
                        current += char;
                    }
                }
                result.push(current.trim());
                return result;
            }).filter(row => row.some(cell => cell !== ''));
        };

                for (const kw of keywords) {
                    if (header.includes(kw.toLowerCase())) return i;
                }
            }
            return -1;

            { id: 'BK-1043', code: '978-957-549-043', title: '明清小說審美思潮', author: '蔡宗陽', year: '1999', category: '文學小說', warehouseId: 'WH-A', shelfId: 'SH-A05', tier: 4, stock: 55, price: 460, intro: '明清小說美學價值探討。' },

            { id: 'BK-1045', code: '978-957-549-045', title: '中國史學史綱', author: '莊吉發', year: '2002', category: '歷史學', warehouseId: 'WH-A', shelfId: 'SH-A03', tier: 3, stock: 40, price: 650, intro: '貫穿歷代史官制度與史學思想。' },
            { id: 'BK-1046', code: '978-957-549-046', title: '故宮滿文檔案考釋', author: '莊吉發', year: '2005', category: '滿學', warehouseId: 'WH-B', shelfId: 'SH-B03', tier: 2, stock: 18, price: 880, intro: '故宮藏滿文書檔之翻譯與考證。' },
            { id: 'BK-1047', code: '978-957-549-047', title: '台灣文史考輯 (待入庫備貨)', author: '文史哲編輯部', year: '2024', category: '歷史學', warehouseId: '', shelfId: '', tier: 1, stock: 100, price: 420, intro: '新近印製完成，待倉管人員指定儲位。' },
            { id: 'BK-1048', code: '978-957-549-048', title: '國學導讀講義 (待入庫備貨)', author: '高明', year: '2025', category: '國學大師叢書', warehouseId: '', shelfId: '', tier: 1, stock: 80, price: 390, intro: '高明教授國學講義新版。' },
            { id: 'BK-1049', code: '978-957-549-049', title: '現代西方哲學概論', author: '韓秋紅', year: '2018', category: '哲學宗教', warehouseId: 'WH-C', shelfId: 'SH-C02', tier: 2, stock: 35, price: 520, intro: '從叔本華到羅蒂之哲學流派講義。' },
            { id: 'BK-1050', code: '978-957-549-050', title: '綜合閩南臺灣話基本字典', author: '吳守禮', year: '1987', category: '語言文字', warehouseId: 'WH-A', shelfId: 'SH-A06', tier: 1, stock: 25, price: 1100, intro: '吳守禮教授編著工具書。' }
        ];

        const ThreeWarehouseView = ({ warehouse, selectedShelf, highlightedLocation, onSelectShelf, viewMode }) => {
            const mountRef = useRef(null);
            const sceneRef = useRef(null);
            const rendererRef = useRef(null);
            const cameraRef = useRef(null);
            const shelvesGroupRef = useRef(null);
            const pinMeshRef = useRef(null);
            const animFrameRef = useRef(null);

            const isDragging = useRef(false);
            const previousMousePosition = useRef({ x: 0, y: 0 });
            const cameraAngle = useRef({ theta: Math.PI / 4, phi: Math.PI / 3, radius: 35 });

            const updateCameraPosition = useCallback(() => {
                if (!cameraRef.current) return;
                const cam = cameraRef.current;
                const r = cameraAngle.current.radius;
                const theta = cameraAngle.current.theta;
                const phi = cameraAngle.current.phi;

                cam.position.x = r * Math.sin(phi) * Math.sin(theta);
                cam.position.y = r * Math.cos(phi);
                cam.position.z = r * Math.sin(phi) * Math.cos(theta);
                cam.lookAt(0, 1.5, 0);
            }, []);

            useEffect(() => {
                if (viewMode === '2D') {
                    cameraAngle.current = { theta: 0, phi: 0.001, radius: 28 };
                } else {
                    cameraAngle.current = { theta: Math.PI / 4, phi: Math.PI / 3, radius: 32 };
                }
                updateCameraPosition();
            }, [viewMode, updateCameraPosition]);

            useEffect(() => {
                if (!highlightedLocation || !warehouse) return;
                const targetShelf = warehouse.shelves.find(s => s.id === highlightedLocation.shelfId);
                if (targetShelf) {
                    onSelectShelf(targetShelf);
                    const targetX = targetShelf.x;
                    const targetZ = targetShelf.z;
                    
                    const targetTheta = Math.atan2(targetX, targetZ) + Math.PI / 6;
                    cameraAngle.current.theta = targetTheta;
                    cameraAngle.current.radius = 22;
                    updateCameraPosition();
                }
            }, [highlightedLocation, warehouse, onSelectShelf, updateCameraPosition]);

            useEffect(() => {
                const container = mountRef.current;
                if (!container) return;

                const width = container.clientWidth;
                const height = container.clientHeight;

                const scene = new THREE.Scene();
                scene.background = new THREE.Color(0xFDFBF7);
                scene.fog = new THREE.FogExp2(0xFDFBF7, 0.012);
                sceneRef.current = scene;

                const camera = new THREE.PerspectiveCamera(45, width / height, 0.1, 1000);
                cameraRef.current = camera;
                updateCameraPosition();

                const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
                renderer.setSize(width, height);
                renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
                renderer.shadowMap.enabled = true;
                renderer.shadowMap.type = THREE.PCFSoftShadowMap;
                rendererRef.current = renderer;

                container.innerHTML = '';
                container.appendChild(renderer.domElement);

                const ambientLight = new THREE.AmbientLight(0xffffff, 0.7);
                scene.add(ambientLight);

                const dirLight = new THREE.DirectionalLight(0xfff5ea, 0.8);
                dirLight.position.set(15, 30, 15);
                dirLight.castShadow = true;
                dirLight.shadow.mapSize.width = 2048;
                dirLight.shadow.mapSize.height = 2048;
                scene.add(dirLight);

                const pointLight = new THREE.PointLight(0x8C5A2B, 0.5, 50);
                pointLight.position.set(0, 10, 0);
                scene.add(pointLight);

                const shelvesGroup = new THREE.Group();
                scene.add(shelvesGroup);
                shelvesGroupRef.current = shelvesGroup;

                const pinGroup = new THREE.Group();
                const pinGeo = new THREE.ConeGeometry(0.4, 1.0, 8);
                pinGeo.rotateX(Math.PI);
                const pinMat = new THREE.MeshStandardMaterial({ color: 0xE74C3C, emissive: 0x900C3F, roughness: 0.3 });
                const pinMesh = new THREE.Mesh(pinGeo, pinMat);
                pinGroup.add(pinMesh);
                pinGroup.visible = false;
                scene.add(pinGroup);
                pinMeshRef.current = pinGroup;

                const handleMouseDown = (e) => {
                    isDragging.current = true;
                    previousMousePosition.current = { x: e.clientX, y: e.clientY };
                };

                const handleMouseMove = (e) => {
                    if (!isDragging.current) return;
                    const deltaX = e.clientX - previousMousePosition.current.x;
                    const deltaY = e.clientY - previousMousePosition.current.y;

                    cameraAngle.current.theta -= deltaX * 0.008;
                    cameraAngle.current.phi = Math.max(0.1, Math.min(Math.PI / 2 - 0.05, cameraAngle.current.phi - deltaY * 0.008));

                    previousMousePosition.current = { x: e.clientX, y: e.clientY };
                    updateCameraPosition();
                };

                const handleMouseUp = () => {
                    isDragging.current = false;
                };

                const handleWheel = (e) => {
                    e.preventDefault();
                    cameraAngle.current.radius = Math.max(10, Math.min(60, cameraAngle.current.radius + e.deltaY * 0.03));
                    updateCameraPosition();
                };

                const raycaster = new THREE.Raycaster();
                const mouse = new THREE.Vector2();

                const handleClick = (e) => {
                    if (!shelvesGroupRef.current) return;
                    const rect = renderer.domElement.getBoundingClientRect();
                    mouse.x = ((e.clientX - rect.left) / rect.width) * 2 - 1;
                    mouse.y = -((e.clientY - rect.top) / rect.height) * 2 + 1;

                    raycaster.setFromCamera(mouse, camera);
                    const intersects = raycaster.intersectObjects(shelvesGroupRef.current.children, true);

                    if (intersects.length > 0) {
                        let obj = intersects[0].object;
                        while (obj.parent && !obj.userData.shelfData) {
                            obj = obj.parent;
                        }
                        if (obj.userData && obj.userData.shelfData) {
                            onSelectShelf(obj.userData.shelfData);
                        }
                    }
                };

                const domEl = renderer.domElement;
                domEl.addEventListener('mousedown', handleMouseDown);
                window.addEventListener('mousemove', handleMouseMove);
                window.addEventListener('mouseup', handleMouseUp);
                domEl.addEventListener('wheel', handleWheel, { passive: false });
                domEl.addEventListener('click', handleClick);

                const handleResize = () => {
                    if (!mountRef.current || !rendererRef.current || !cameraRef.current) return;
                    const w = mountRef.current.clientWidth;
                    const h = mountRef.current.clientHeight;
                    cameraRef.current.aspect = w / h;
                    cameraRef.current.updateProjectionMatrix();
                    rendererRef.current.setSize(w, h);
                };
                window.addEventListener('resize', handleResize);

                let time = 0;
                const animate = () => {
                    time += 0.03;
                    if (pinMeshRef.current && pinMeshRef.current.visible) {
                        pinMeshRef.current.position.y += Math.sin(time * 3) * 0.008;
                        pinMeshRef.current.rotation.y += 0.02;
                    }
                    if (rendererRef.current && sceneRef.current && cameraRef.current) {
                        rendererRef.current.render(sceneRef.current, cameraRef.current);
                    }
                    animFrameRef.current = requestAnimationFrame(animate);
                };
                animate();

                return () => {
                    window.removeEventListener('mousemove', handleMouseMove);
                    window.removeEventListener('mouseup', handleMouseUp);
                    window.removeEventListener('resize', handleResize);
                    if (animFrameRef.current) cancelAnimationFrame(animFrameRef.current);
                    if (domEl) {
                        domEl.removeEventListener('mousedown', handleMouseDown);
                        domEl.removeEventListener('wheel', handleWheel);
                        domEl.removeEventListener('click', handleClick);
                    }
                };
            }, [updateCameraPosition, onSelectShelf]);

            useEffect(() => {
                if (!sceneRef.current || !shelvesGroupRef.current || !warehouse) return;

                const scene = sceneRef.current;
                const shelvesGroup = shelvesGroupRef.current;

                while (shelvesGroup.children.length > 0) {
                    const child = shelvesGroup.children[0];
                    shelvesGroup.remove(child);
                }

                const oldFloor = scene.getObjectByName("warehouseFloor");
                if (oldFloor) scene.remove(oldFloor);

                const oldGrid = scene.getObjectByName("warehouseGrid");
                if (oldGrid) scene.remove(oldGrid);

                const floorGeo = new THREE.PlaneGeometry(warehouse.width, warehouse.depth);
                const floorMat = new THREE.MeshStandardMaterial({
                    color: 0xE6D5C3,
                    roughness: 0.8,
                    metalness: 0.1,
                    side: THREE.DoubleSide
                });
                const floorMesh = new THREE.Mesh(floorGeo, floorMat);
                floorMesh.rotation.x = Math.PI / 2;
                floorMesh.receiveShadow = true;
                floorMesh.name = "warehouseFloor";
                scene.add(floorMesh);

                const gridHelper = new THREE.GridHelper(Math.max(warehouse.width, warehouse.depth), 24, 0x8C5A2B, 0xC4B29E);
                gridHelper.position.y = 0.01;
                gridHelper.name = "warehouseGrid";
                scene.add(gridHelper);

                const wallGeo = new THREE.BoxGeometry(warehouse.width, 0.2, warehouse.depth);
                const wallWire = new THREE.LineSegments(
                    new THREE.EdgesGeometry(wallGeo),
                    new THREE.LineBasicMaterial({ color: 0x8C5A2B, linewidth: 2 })
                );
                wallWire.position.y = 0.1;
                shelvesGroup.add(wallWire);

                warehouse.shelves.forEach(shelf => {
                    const shelfGroup = new THREE.Group();
                    shelfGroup.position.set(shelf.x, 0, shelf.z);
                    shelfGroup.rotation.y = (shelf.rot * Math.PI) / 180;
                    shelfGroup.userData = { shelfData: shelf };

                    const isSelected = selectedShelf && selectedShelf.id === shelf.id;
                    const shelfHeight = 2.4;
                    const frameColor = isSelected ? 0xF39C12 : 0x4A3728;

                    const postGeo = new THREE.BoxGeometry(0.08, shelfHeight, 0.08);
                    const postMat = new THREE.MeshStandardMaterial({ color: frameColor, roughness: 0.4, metalness: 0.3 });

                    const hW = shelf.width / 2;
                    const hD = shelf.depth / 2;
                    const hH = shelfHeight / 2;

                    [[-hW, hD], [hW, hD], [-hW, -hD], [hW, -hD]].forEach(([px, pz]) => {
                        const post = new THREE.Mesh(postGeo, postMat);
                        post.position.set(px, hH, pz);
                        post.castShadow = true;
                        shelfGroup.add(post);
                    });

                    const tierCount = shelf.tiers || 4;
                    const tierGap = shelfHeight / tierCount;

                    for (let i = 0; i <= tierCount; i++) {
                        const plankGeo = new THREE.BoxGeometry(shelf.width, 0.05, shelf.depth);
                        const plankMat = new THREE.MeshStandardMaterial({
                            color: isSelected ? 0xF5B041 : 0x8C5A2B,
                            roughness: 0.6
                        });
                        const plank = new THREE.Mesh(plankGeo, plankMat);
                        const py = i * tierGap;
                        plank.position.set(0, py, 0);
                        plank.receiveShadow = true;
                        shelfGroup.add(plank);

                        if (i < tierCount) {
                            const bookStackGroup = new THREE.Group();
                            const booksInTier = 6 + Math.floor(Math.random() * 8);
                            let startX = -hW + 0.2;

                            for (let b = 0; b < booksInTier; b++) {
                                const bW = 0.08 + Math.random() * 0.06;
                                const bH = tierGap * 0.65 + Math.random() * 0.1;
                                const bD = shelf.depth * 0.7;

                                const bookGeo = new THREE.BoxGeometry(bW, bH, bD);
                                const bookColors = [0x8C5A2B, 0x2C241B, 0x1B4F72, 0x7D6608, 0x196F3D, 0x5B2C6F, 0x900C3F];
                                const bColor = bookColors[b % bookColors.length];

                                const bookMat = new THREE.MeshStandardMaterial({ color: bColor, roughness: 0.5 });
                                const bookMesh = new THREE.Mesh(bookGeo, bookMat);
                                bookMesh.position.set(startX + bW / 2, py + bH / 2 + 0.02, 0);
                                bookMesh.castShadow = true;
                                bookStackGroup.add(bookMesh);

                                startX += bW + 0.02;
                                if (startX > hW - 0.2) break;
                            }
                            shelfGroup.add(bookStackGroup);
                        }
                    }

                    const labelGeo = new THREE.BoxGeometry(shelf.width * 0.6, 0.25, 0.05);
                    const labelMat = new THREE.MeshStandardMaterial({ color: 0x2C241B, roughness: 0.2 });
                    const labelMesh = new THREE.Mesh(labelGeo, labelMat);
                    labelMesh.position.set(0, shelfHeight + 0.15, hD);
                    shelfGroup.add(labelMesh);

                    if (isSelected) {
                        const bboxGeo = new THREE.BoxGeometry(shelf.width + 0.2, shelfHeight + 0.3, shelf.depth + 0.2);
                        const bboxWire = new THREE.LineSegments(
                            new THREE.EdgesGeometry(bboxGeo),
                            new THREE.LineBasicMaterial({ color: 0xF39C12, linewidth: 3 })
                        );
                        bboxWire.position.y = shelfHeight / 2;
                        shelfGroup.add(bboxWire);
                    }

                    shelvesGroup.add(shelfGroup);
                });

                if (highlightedLocation && pinMeshRef.current) {
                    const targetShelf = warehouse.shelves.find(s => s.id === highlightedLocation.shelfId);
                    if (targetShelf) {
                        const shelfHeight = 2.4;
                        const tierGap = shelfHeight / (targetShelf.tiers || 4);
                        const tierY = (highlightedLocation.tier || 1) * tierGap;

                        pinMeshRef.current.position.set(targetShelf.x, tierY + 0.8, targetShelf.z);
                        pinMeshRef.current.visible = true;
                    } else {
                        pinMeshRef.current.visible = false;
                    }
                } else if (pinMeshRef.current) {
                    pinMeshRef.current.visible = false;
                }

            }, [warehouse, selectedShelf, highlightedLocation]);

            return (
                <div className="w-full h-full relative canvas-container">
                    <div ref={mountRef} className="w-full h-full cursor-grab active:cursor-grabbing" />
                    <div className="absolute bottom-4 left-4 glass-dark text-xs p-3 rounded-xl pointer-events-none flex flex-col gap-1 border border-white/10 font-sans shadow-lg">
                        <div className="font-bold text-amber-300 flex items-center gap-1.5 mb-0.5">
                            <Icon name="Compass" size={14} /> 3D 視角操作說明：
                        </div>
                        <div>• 按住滑鼠左鍵拖曳：旋轉視角</div>
                        <div>• 滾輪縮放：放大 / 縮小視野</div>
                        <div>• 點擊 3D 書架：選取並調整座標位置</div>
                    </div>
                </div>
            );
        };

        function App() {
            const [warehouses, setWarehouses] = useState(() => {
                const local = localStorage.getItem('lapen_warehouses_v2');
                return local ? JSON.parse(local) : INITIAL_WAREHOUSES;
            });
            const [books, setBooks] = useState(() => {
                const local = localStorage.getItem('lapen_books_v2');
                return local ? JSON.parse(local) : INITIAL_BOOKS;
            });

            const [activeWarehouseId, setActiveWarehouseId] = useState('WH-A');
            const [selectedShelf, setSelectedShelf] = useState(null);
            const [highlightedLocation, setHighlightedLocation] = useState(null);
            const [viewMode, setViewMode] = useState('3D');

            // Search & Filter State
            const [searchQuery, setSearchQuery] = useState('');
            const [selectedCategory, setSelectedCategory] = useState('全部');
            const [selectedWarehouseFilter, setSelectedCategoryWarehouseFilter] = useState('ALL');
            const [sortBy, setSortBy] = useState('code_asc');

            // Modals & Sync States
            const [isCsvModalOpen, setIsCsvModalOpen] = useState(false);
            const [csvTab, setCsvCsvTab] = useState('GOOGLE_SHEETS');
            const [googleSheetUrl, setGoogleSheetUrl] = useState('https://docs.google.com/spreadsheets/d/1WB8sWMkP-6RH23lUvP-JUl7JnzxSQKzkszGUzh4XS6s/edit?usp=drivesdk');
            const [isSyncingSheets, setIsSyncingSheets] = useState(false);

            const [isPrintModalOpen, setIsPrintModalOpen] = useState(false);
            const [isAddShelfModalOpen, setIsAddShelfModalOpen] = useState(false);
            const [isAddWarehouseModalOpen, setIsAddWarehouseModalOpen] = useState(false);
            const [isAssignBookModalOpen, setIsAssignBookModalOpen] = useState(false);
            const [assignBookId, setAssignBookId] = useState('');
            const [assignBookTier, setAssignBookTier] = useState(1);
            const [assignBookSearch, setAssignBookSearch] = useState('');
            const [csvText, setCsvText] = useState('');
            const [warehouseCsvText, setWarehouseCsvText] = useState('');
            const [toastMessage, setToastMessage] = useState(null);

            const activeWarehouse = useMemo(() => {
                return warehouses.find(w => w.id === activeWarehouseId) || warehouses[0];
            }, [warehouses, activeWarehouseId]);

            useEffect(() => {
                localStorage.setItem('lapen_warehouses_v2', JSON.stringify(warehouses));
            }, [warehouses]);

            useEffect(() => {
                localStorage.setItem('lapen_books_v2', JSON.stringify(books));
            }, [books]);

            const showToast = (msg) => {
                setToastMessage(msg);
                setTimeout(() => setToastMessage(null), 3800);
            };

            const extractSheetId = (input) => {
                if (!input) return '1WB8sWMkP-6RH23lUvP-JUl7JnzxSQKzkszGUzh4XS6s';
                const match = input.match(/\/d\/([a-zA-Z0-9_-]+)/);
                if (match) return match[1];
                if (/^[a-zA-Z0-9_-]{20,}$/.test(input.trim())) return input.trim();
                return '1WB8sWMkP-6RH23lUvP-JUl7JnzxSQKzkszGUzh4XS6s';
            };

            // Google Sheets Live Fetch (Book_ALL + 倉庫) with CORS Proxy Fallback
            const handleSyncFromGoogleSheets = async (showSuccessToast = true) => {
                setIsSyncingSheets(true);
                const sheetId = extractSheetId(googleSheetUrl);
                let importedBooksCount = 0;
                let importedWarehousesCount = 0;

                const fetchWithProxyFallback = async (targetUrl) => {
                    try {
                        const directResp = await fetch(targetUrl);
                        if (directResp.ok) {
                            const text = await directResp.text();
                            if (text && !text.includes('<!DOCTYPE html>')) return text;
                        }
                    } catch (e) {
                        // Direct fetch failed (CORS or sandboxed iframe restriction)
                    }

                    // Fallback proxies to try sequentially
                    const proxies = [
                        (u) => `https://api.allorigins.win/raw?url=${encodeURIComponent(u)}`,
                        (u) => `https://corsproxy.io/?${encodeURIComponent(u)}`,
                        (u) => `https://api.codetabs.com/v1/proxy?quest=${encodeURIComponent(u)}`
                    ];

                    for (const getProxyUrl of proxies) {
                        try {
                            const proxyUrl = getProxyUrl(targetUrl);
                            const proxyResp = await fetch(proxyUrl);
                            if (proxyResp.ok) {
                                const proxyText = await proxyResp.text();
                                if (proxyText && !proxyText.includes('<!DOCTYPE html>')) return proxyText;
                            }
                        } catch (err) {
                            // Quietly catch errors without outputting full console error traces
                        }
                    }
                    return null;
                };

                try {
                    // Fetch Book_ALL sheet
                    const bookUrl = `https://docs.google.com/spreadsheets/d/${sheetId}/gviz/tq?tqx=out:csv&sheet=${encodeURIComponent('Book_ALL')}`;
                    const csvData = await fetchWithProxyFallback(bookUrl);

                    if (csvData) {
                        const rows = parseCSVText(csvData);
                        if (rows.length > 1) {
                            const headers = rows[0];
                            const idxCode = getColIdx(headers, ['書碼', 'isbn', '編號', 'code', 'id']);
                            const idxTitle = getColIdx(headers, ['書名', 'title', '名稱']);
                            const idxAuthor = getColIdx(headers, ['作者', 'author']);
                            const idxYear = getColIdx(headers, ['出版年', '年份', 'year']);
                            const idxCategory = getColIdx(headers, ['類別', '叢書', 'category']);
                            const idxWh = getColIdx(headers, ['倉庫代碼', '倉庫代號', '倉庫編號', '倉庫', 'warehouse']);
                            const idxShelf = getColIdx(headers, ['書架編號', '書架代碼', '書架代號', '書架', 'shelf']);
                            const idxTier = getColIdx(headers, ['層數', '層', 'tier']);
                            const idxStock = getColIdx(headers, ['庫存數量', '庫存', '數量', 'stock']);
                            const idxPrice = getColIdx(headers, ['定價', '價格', '建議定價', 'price']);
                            const idxIntro = getColIdx(headers, ['簡介', '說明', 'intro']);

                            const newBooks = [];
                            for (let i = 1; i < rows.length; i++) {
                                const row = rows[i];
                                const title = idxTitle >= 0 ? row[idxTitle] : row[1];
                                if (!title || title.trim() === '') continue;

                                const code = idxCode >= 0 ? row[idxCode] : row[0] || `BK-${i}`;
                                const whCode = idxWh >= 0 ? row[idxWh] : '';
                                const shCode = idxShelf >= 0 ? row[idxShelf] : '';

                                const foundWh = warehouses.find(w => w.code === whCode || w.id === whCode);
                                const foundSh = foundWh ? foundWh.shelves.find(s => s.code === shCode || s.id === shCode) : null;

                                newBooks.push({
                                    id: `BK-GS-${i}-${Date.now().toString().slice(-4)}`,
                                    code: code,
                                    title: title,
                                    author: idxAuthor >= 0 ? row[idxAuthor] || '未知' : '未知',
                                    year: idxYear >= 0 ? row[idxYear] || '1971' : '1971',
                                    category: idxCategory >= 0 ? row[idxCategory] || '通用學術' : '通用學術',
                                    warehouseId: foundWh ? foundWh.id : (whCode ? whCode : ''),
                                    shelfId: foundSh ? foundSh.id : (shCode ? shCode : ''),
                                    tier: idxTier >= 0 ? parseInt(row[idxTier]) || 1 : 1,
                                    stock: idxStock >= 0 ? parseInt(row[idxStock]) || 10 : 10,
                                    price: idxPrice >= 0 ? parseInt(row[idxPrice]) || 300 : 300,
                                    intro: idxIntro >= 0 ? row[idxIntro] || '' : '從 Google 試算表 Book_ALL 分頁同步。'
                                });
                            }

                            if (newBooks.length > 0) {
                                newBooks.sort((a, b) => (a.code || '').localeCompare(b.code || '', undefined, { numeric: true }));
                                setBooks(newBooks);
                                importedBooksCount = newBooks.length;
                            }
                        }
                    }

                    // Fetch 倉庫 sheet
                    const whUrl = `https://docs.google.com/spreadsheets/d/${sheetId}/gviz/tq?tqx=out:csv&sheet=${encodeURIComponent('倉庫')}`;
                    const whCsvData = await fetchWithProxyFallback(whUrl);

                    if (whCsvData) {
                        const whRows = parseCSVText(whCsvData);
                        if (whRows.length > 1) {
                            const headers = whRows[0];
                            const idxWhCode = getColIdx(headers, ['倉庫代碼', '代碼', 'code']);
                            const idxWhName = getColIdx(headers, ['倉庫名稱', '名稱', 'name']);
                            const idxWhAddress = getColIdx(headers, ['地址', '位置', 'address']);
                            const idxWhWidth = getColIdx(headers, ['長度', '長', 'width']);
                            const idxWhDepth = getColIdx(headers, ['深度', '寬', 'depth']);
                            const idxWhHeight = getColIdx(headers, ['高度', '高', 'height']);
                            const idxWhShelves = getColIdx(headers, ['書架資料', '書架擺設', 'shelves']);

                            const newWarehouses = [];
                            for (let i = 1; i < whRows.length; i++) {
                                const row = whRows[i];
                                const code = idxWhCode >= 0 ? row[idxWhCode] : row[0];
                                const name = idxWhName >= 0 ? row[idxWhName] : row[1];
                                if (!code || !name) continue;

                                let parsedShelves = null;
                                if (idxWhShelves >= 0 && row[idxWhShelves]) {
                                    try {
                                        parsedShelves = JSON.parse(row[idxWhShelves]);
                                    } catch(e) {}
                                }

                                const existingWh = warehouses.find(w => w.code === code || w.id === code);
                                newWarehouses.push({
                                    id: existingWh ? existingWh.id : `WH-${code}`,
                                    code: code,
                                    name: name,
                                    address: idxWhAddress >= 0 ? row[idxWhAddress] || '台北市' : '台北市',
                                    width: idxWhWidth >= 0 ? parseFloat(row[idxWhWidth]) || 24 : 24,
                                    depth: idxWhDepth >= 0 ? parseFloat(row[idxWhDepth]) || 18 : 18,
                                    height: idxWhHeight >= 0 ? parseFloat(row[idxWhHeight]) || 4.5 : 4.5,
                                    shelves: parsedShelves || (existingWh ? existingWh.shelves : [
                                        { id: `SH-${code}-01`, code: `${code.slice(0, 1)}1架`, name: '主要典藏特區架', x: -5, z: -4, rot: 0, width: 3.2, depth: 0.9, tiers: 5, category: '綜合學術', color: '#8C5A2B' }
                                    ])
                                });
                            }

                            if (newWarehouses.length > 0) {
                                setWarehouses(newWarehouses);
                                importedWarehousesCount = newWarehouses.length;
                            }
                        }
                    }

                    if (importedBooksCount > 0) {
                        if (showSuccessToast) showToast(`⚡ 雲端同步完成！成功載入 ${importedBooksCount} 本圖書與 ${importedWarehousesCount} 個倉庫排架！`);
                    } else {
                        if (showSuccessToast) showToast(`⚠️ 雲端讀取失敗或權限未開啟。請確認 Google 試算表設定為『知道連結的任何人皆可檢視』，或直接點選上傳 CSV 檔案！`);
                    }
                } catch (err) {
                    if (showSuccessToast) {
                        showToast(`⚠️ 連線異常，請改用「上傳 CSV 檔案」匯入完整 Book_ALL 書籍！`);
                    }
                } finally {
                    setIsSyncingSheets(false);
                }
            };

            const handleFileUpload = (e, isWarehouseFile = false) => {
                const file = e.target.files[0];
                if (!file) return;

                const reader = new FileReader();
                reader.onload = (event) => {
                    const text = event.target.result;
                    if (isWarehouseFile) {
                        setWarehouseCsvText(text);
                        showToast("已載入倉庫 CSV 檔案，點擊『匯入並更新倉庫 3D 擺設』即可套用！");
                    } else {
                        setCsvText(text);
                        showToast("已載入 Book_ALL CSV 檔案，點擊『匯入並更新圖書儲位』即可一次載入全部書籍！");
                    }
                };
                reader.readAsText(file);
            };

            useEffect(() => {
                handleSyncFromGoogleSheets(false);
            }, []);

            const categories = useMemo(() => {
                const set = new Set(books.map(b => b.category).filter(Boolean));
                return ['全部', ...Array.from(set)];
            }, [books]);

            const filteredBooks = useMemo(() => {
                let list = books.filter(b => {
                    let matchWh = true;
                    if (selectedWarehouseFilter === 'CURRENT') {
                        matchWh = b.warehouseId === activeWarehouseId;
                    } else if (selectedWarehouseFilter === 'UNASSIGNED') {
                        matchWh = !b.warehouseId || b.warehouseId === '';
                    } else if (selectedWarehouseFilter !== 'ALL') {
                        matchWh = b.warehouseId === selectedWarehouseFilter;
                    }

                    const matchCat = selectedCategory === '全部' || b.category === selectedCategory;
                    const q = searchQuery.toLowerCase().trim();
                    const matchQ = !q || (
                        (b.title && b.title.toLowerCase().includes(q)) ||
                        (b.author && b.author.toLowerCase().includes(q)) ||
                        (b.code && b.code.toLowerCase().includes(q)) ||
                        (b.category && b.category.toLowerCase().includes(q))
                    );
                    return matchWh && matchCat && matchQ;
                });

                if (sortBy === 'code_asc') {
                    list.sort((a, b) => (a.code || '').localeCompare(b.code || '', undefined, { numeric: true }));
                } else if (sortBy === 'code_desc') {
                    list.sort((a, b) => (b.code || '').localeCompare(a.code || '', undefined, { numeric: true }));
                } else if (sortBy === 'title') {
                    list.sort((a, b) => (a.title || '').localeCompare(b.title || '', 'zh-Hant'));
                } else if (sortBy === 'warehouse') {
                    list.sort((a, b) => (a.warehouseId || 'ZZ').localeCompare(b.warehouseId || 'ZZ'));
                } else if (sortBy === 'category') {
                    list.sort((a, b) => (a.category || '').localeCompare(b.category || '', 'zh-Hant'));
                }

                return list;
            }, [books, activeWarehouseId, selectedWarehouseFilter, selectedCategory, searchQuery, sortBy]);

            const handleLocateBook = (book) => {
                if (!book.warehouseId || !book.shelfId) {
                    return showToast(`《${book.title}》目前為【待入庫/未排架】，請從右側挑選倉庫與書架為其分配！`);
                }

                const targetWh = warehouses.find(w => w.id === book.warehouseId || w.code === book.warehouseId);
                const targetShelf = targetWh ? targetWh.shelves.find(s => s.id === book.shelfId || s.code === book.shelfId) : null;

                if (targetWh && targetWh.id !== activeWarehouseId) {
                    setActiveWarehouseId(targetWh.id);
                    showToast(`已自動切換視角至【${targetWh.name}】！`);
                }

                setHighlightedLocation({
                    warehouseId: book.warehouseId,
                    shelfId: book.shelfId,
                    tier: book.tier
                });

                if (targetShelf) setSelectedShelf(targetShelf);
                showToast(`已 3D 聚焦至《${book.title}》位置：${targetWh ? targetWh.code : ''} - ${targetShelf ? targetShelf.code : '書架'} 第 ${book.tier} 層`);
            };

            const handleAddWarehouse = (e) => {
                e.preventDefault();
                const formData = new FormData(e.currentTarget);
                const newWhId = `WH-${Date.now().toString().slice(-4)}`;
                const newWhCode = (formData.get('code') || '').toUpperCase().trim();
                const newWhName = (formData.get('name') || '').trim();
                const newWhAddress = (formData.get('address') || '').trim() || '台北市中正區';
                const width = parseFloat(formData.get('width')) || 24;
                const depth = parseFloat(formData.get('depth')) || 18;
                const height = parseFloat(formData.get('height')) || 4.5;

                const defaultShelves = [
                    { id: `SH-${newWhCode}-01`, code: `${newWhCode.slice(0, 1)}1架`, name: '主要典藏特區架', x: -Math.floor(width/4), z: -Math.floor(depth/4), rot: 0, width: 3.2, depth: 0.9, tiers: 5, category: '綜合學術', color: '#8C5A2B' },
                    { id: `SH-${newWhCode}-02`, code: `${newWhCode.slice(0, 1)}2架`, name: '新品與熱銷待揀貨架', x: Math.floor(width/4), z: Math.floor(depth/4), rot: 0, width: 3.2, depth: 0.9, tiers: 5, category: '暢銷綜合', color: '#6A432D' },
                ];

                const newWarehouse = {
                    id: newWhId,
                    name: newWhName,
                    code: newWhCode,
                    address: newWhAddress,
                    width,
                    depth,
                    height,
                    shelves: defaultShelves
                };

                setWarehouses(prev => [...prev, newWarehouse]);
                setActiveWarehouseId(newWhId);
                setSelectedShelf(null);
                setIsAddWarehouseModalOpen(false);
                showToast(`成功建立新倉庫：${newWhName} (${newWhCode})！已切換至 3D 視角。`);
            };

            const handleUpdateShelf = (updatedShelf) => {
                setWarehouses(prev => prev.map(wh => {
                    if (wh.id !== activeWarehouseId) return wh;
                    return {
                        ...wh,
                        shelves: wh.shelves.map(s => s.id === updatedShelf.id ? updatedShelf : s)
                    };
                }));
                setSelectedShelf(updatedShelf);
            };

            const handleAddShelf = (e) => {
                e.preventDefault();
                const formData = new FormData(e.currentTarget);
                const newShelf = {
                    id: `SH-${Date.now().toString().slice(-4)}`,
                    code: formData.get('code') || '',
                    name: formData.get('name') || '',
                    x: parseFloat(formData.get('x')) || 0,
                    z: parseFloat(formData.get('z')) || 0,
                    rot: parseInt(formData.get('rot')) || 0,
                    width: parseFloat(formData.get('width')) || 3.0,
                    depth: parseFloat(formData.get('depth')) || 0.9,
                    tiers: parseInt(formData.get('tiers')) || 5,
                    category: formData.get('category') || '綜合',
                    color: '#8C5A2B'
                };

                setWarehouses(prev => prev.map(wh => {
                    if (wh.id !== activeWarehouseId) return wh;
                    return { ...wh, shelves: [...wh.shelves, newShelf] };
                }));

                setSelectedShelf(newShelf);
                setIsAddShelfModalOpen(false);
                showToast(`成功新增書架：${newShelf.code} (${newShelf.name})`);
            };

            const handleDeleteShelf = (shelfId) => {
                if (!window.confirm("確定要刪除此書架嗎？放置於此書架之書籍儲位設定將變更為待上架。")) return;
                setWarehouses(prev => prev.map(wh => {
                    if (wh.id !== activeWarehouseId) return wh;
                    return { ...wh, shelves: wh.shelves.filter(s => s.id !== shelfId) };
                }));
                setBooks(prev => prev.map(b => b.shelfId === shelfId ? { ...b, warehouseId: '', shelfId: '' } : b));
                setSelectedShelf(null);
                showToast("已刪除書架，原書架書籍已移至待上架清單。");
            };

            const handleAssignBookToShelf = (e) => {
                e.preventDefault();
                if (!assignBookId || !selectedShelf) return showToast("請選擇欲放入的圖書！");

                setBooks(prev => prev.map(b => {
                    if (b.id === assignBookId) {
                        return {
                            ...b,
                            warehouseId: activeWarehouseId,
                            shelfId: selectedShelf.id,
                            tier: parseInt(assignBookTier) || 1
                        };
                    }
                    return b;
                }));

                const targetBook = books.find(b => b.id === assignBookId);
                showToast(`已成功將《${targetBook ? targetBook.title : ''}》放入 ${selectedShelf.code} 第 ${assignBookTier} 層！`);
                setIsAssignBookModalOpen(false);
                setAssignBookId('');
            };

            const handleRemoveBookFromShelf = (bookId) => {
                setBooks(prev => prev.map(b => b.id === bookId ? { ...b, warehouseId: '', shelfId: '', tier: 1 } : b));
                showToast("已將圖書移出此書架（變更為待入庫）。");
            };

            const handleChangeBookTier = (bookId, newTier) => {
                setBooks(prev => prev.map(b => b.id === bookId ? { ...b, tier: parseInt(newTier) || 1 } : b));
                showToast(`已調整圖書儲位至第 ${newTier} 層。`);
            };

            const handleOpenExportCsv = () => {
                let bookCsv = "書碼,書名,作者,出版年,叢書類別,倉庫代碼,書架編號,層數,庫存數量,建議定價,書籍簡介\n";
                const sortedExportBooks = [...books].sort((a, b) => (a.code || '').localeCompare(b.code || '', undefined, { numeric: true }));
                sortedExportBooks.forEach(b => {
                    const wh = warehouses.find(w => w.id === b.warehouseId || w.code === b.warehouseId);
                    const sh = wh ? wh.shelves.find(s => s.id === b.shelfId || s.code === b.shelfId) : null;
                    bookCsv += `"${b.code}","${b.title}","${b.author}","${b.year}","${b.category}","${wh ? wh.code : ''}","${sh ? sh.code : ''}","${b.tier || 1}","${b.stock}","${b.price}","${(b.intro || '').replace(/"/g, '""')}"\n`;
                });
                setCsvText(bookCsv);

                let whCsv = "倉庫代碼,倉庫名稱,地址,長度(m),深度(m),高度(m),書架擺設設定(JSON)\n";
                warehouses.forEach(w => {
                    whCsv += `"${w.code}","${w.name}","${w.address}","${w.width}","${w.depth}","${w.height}","${JSON.stringify(w.shelves).replace(/"/g, '""')}"\n`;
                });
                setWarehouseCsvText(whCsv);

                setIsCsvModalOpen(true);
            };

            const handleImportCsvText = () => {
                try {
                    const lines = parseCSVText(csvText);
                    if (lines.length <= 1) return showToast("Book_ALL CSV 內容無有效資料列！");

                    const newBooks = [];
                    for (let i = 1; i < lines.length; i++) {
                        const row = lines[i];
                        if (row.length >= 2 && row[1]) {
                            const whCode = row[5];
                            const shCode = row[6];
                            const foundWh = warehouses.find(w => w.code === whCode || w.id === whCode);
                            const foundSh = foundWh ? foundWh.shelves.find(s => s.code === shCode || s.id === shCode) : null;

                            newBooks.push({
                                id: `BK-IMP-${i}-${Date.now().toString().slice(-4)}`,
                                code: row[0] || `IMP-${i}`,
                                title: row[1],
                                author: row[2] || '未知',
                                year: row[3] || '1971',
                                category: row[4] || '通用學術',
                                warehouseId: foundWh ? foundWh.id : '',
                                shelfId: foundSh ? foundSh.id : '',
                                tier: parseInt(row[7]) || 1,
                                stock: parseInt(row[8]) || 10,
                                price: parseInt(row[9]) || 300,

                                            目前所選倉庫：{activeWarehouse.name} ({activeWarehouse.code})
                                        </p>
                                    </div>
                                    <button type="button" onClick={() => setIsAssignBookModalOpen(false)} className="p-1 rounded-full hover:bg-paper">
                                        <Icon name="X" size={18} />
                                    </button>
                                </div>

                                <div className="space-y-3 text-xs">
                                    <div>
                                        <label className="block text-amber-900 font-bold mb-1">1. 搜尋圖書 (書名、作者或 ISBN 書碼)：</label>
                                        <div className="relative">
                                            <input 
                                                type="text"
                                                value={assignBookSearch}
                                                onChange={(e) => setAssignBookSearch(e.target.value)}
                                                placeholder="輸入關鍵字快速過濾圖書..."
                                                className="w-full pl-8 pr-3 py-2 rounded-xl border border-borderwood bg-white font-bold text-amber-900 outline-none"
                                            />
                                            <Icon name="Search" size={15} className="absolute left-2.5 top-2.5 text-amber-800/60" />
                                        </div>
                                    </div>

                                    <div>
                                        <label className="block text-amber-900 font-bold mb-1">2. 選擇欲擺放入架之圖書：</label>
                                        <select 
                                            required
                                            value={assignBookId}
                                            onChange={(e) => setAssignBookId(e.target.value)}
                                            className="w-full p-2.5 rounded-xl border border-borderwood bg-white font-bold text-amber-900 outline-none cursor-pointer max-h-40"
                                        >
                                            <option value="">-- 請挑選圖書 --</option>
                                            {books
                                                .filter(b => {
                                                    const q = assignBookSearch.toLowerCase().trim();
                                                    if (!q) return true;
                                                    return (b.title && b.title.toLowerCase().includes(q)) ||
                                                           (b.author && b.author.toLowerCase().includes(q)) ||
                                                           (b.code && b.code.toLowerCase().includes(q));
                                                })
                                                .map(b => {
                                                    const isUnassigned = !b.warehouseId || !b.shelfId;
                                                    return (
                                                        <option key={b.id} value={b.id}>
                                                            {isUnassigned ? "【待入庫】" : "【已在上架】"} 《{b.title}》 - {b.author} (#{b.code})
                                                        </option>
                                                    );
                                                })
                                            }
                                        </select>
                                    </div>

                                    <div>
                                        <label className="block text-amber-900 font-bold mb-1">3. 擺放於此書架之層數 (Tier)：</label>
                                        <select 
                                            value={assignBookTier}
                                            onChange={(e) => setAssignBookTier(parseInt(e.target.value))}
                                            className="w-full p-2.5 rounded-xl border border-borderwood bg-white font-bold text-amber-900 outline-none cursor-pointer"
                                        >
                                            {Array.from({ length: selectedShelf.tiers || 5 }, (_, idx) => (
                                                <option key={idx + 1} value={idx + 1}>
                                                    第 {idx + 1} 層 (由下至上)
                                                </option>
                                            ))}
                                        </select>
                                    </div>
                                </div>

                                <div className="flex justify-end gap-2 pt-2 border-t border-borderwood">
                                    <button type="button" onClick={() => setIsAssignBookModalOpen(false)} className="px-4 py-2 rounded-xl text-xs font-bold bg-paper text-amber-900">
                                        取消
                                    </button>
                                    <button type="submit" className="px-5 py-2 rounded-xl text-xs font-bold bg-amber-800 text-white hover:bg-amber-900 shadow-sm flex items-center gap-1">
                                        <Icon name="CheckCircle2" size={15} />
                                        確認一鍵入架擺放
                                    </button>
                                </div>
                            </form>
                        </div>
                    )}

                    {}
                    {/* Modal 1: Google Sheets & CSV Multi-Tab Sync Modal */}
                    {isCsvModalOpen && (
                        <div className="fixed inset-0 bg-black/60 backdrop-blur-sm z-50 flex items-center justify-center p-4">
                            <div className="bg-cream border-2 border-borderwood w-full max-w-3xl rounded-3xl shadow-2xl p-6 flex flex-col gap-4 font-sans animate-in">
                                <div className="flex justify-between items-center border-b border-borderwood pb-3">
                                    <h3 className="text-lg font-bold font-serif-title text-amber-900 flex items-center gap-2">
                                        <Icon name="FileSpreadsheet" size={20} className="text-amber-800" />
                                        Google 試算表 (Book_ALL & 倉庫) 雙向同步
                                    </h3>
                                    <button onClick={() => setIsCsvModalOpen(false)} className="p-1 rounded-full hover:bg-paper">
                                        <Icon name="X" size={20} />
                                    </button>
                                </div>

                                <div className="flex gap-2 border-b border-borderwood/80 pb-2">
                                    <button 
                                        onClick={() => setCsvCsvTab('GOOGLE_SHEETS')}
                                        className={`px-4 py-2 rounded-xl text-xs font-bold transition ${
                                            csvTab === 'GOOGLE_SHEETS' 
                                                ? 'bg-amber-800 text-white shadow-xs' 
                                                : 'bg-paper text-amber-900 border border-borderwood'
                                        }`}
                                    >
                                        ☁️ 雲端即時連線同步
                                    </button>
                                    <button 
                                        onClick={() => setCsvCsvTab('BOOKS_CSV')}
                                        className={`px-4 py-2 rounded-xl text-xs font-bold transition ${
                                            csvTab === 'BOOKS_CSV' 
                                                ? 'bg-amber-800 text-white shadow-xs' 
                                                : 'bg-paper text-amber-900 border border-borderwood'
                                        }`}
                                    >
                                        📚 Book_ALL 試算表 CSV (剪貼)
                                    </button>
                                    <button 
                                        onClick={() => setCsvCsvTab('WAREHOUSES_CSV')}
                                        className={`px-4 py-2 rounded-xl text-xs font-bold transition ${
                                            csvTab === 'WAREHOUSES_CSV' 
                                                ? 'bg-amber-800 text-white shadow-xs' 
                                                : 'bg-paper text-amber-900 border border-borderwood'
                                        }`}
                                    >
                                        🏢 倉庫分頁 CSV (剪貼)
                                    </button>
                                </div>

                                {csvTab === 'GOOGLE_SHEETS' && (
                                    <div className="space-y-4 py-2">
                                        <div className="text-xs text-amber-900/90 leading-relaxed bg-paper p-4 rounded-xl border border-borderwood space-y-2">
                                            <div className="font-bold text-amber-900 text-sm flex items-center gap-1.5">
                                                <Icon name="AlertCircle" size={16} className="text-amber-800" />
                                                如何確保成功讀取 Google 試算表中的所有書籍？
                                            </div>
                                            <div>1. 請確保 Google 試算表右上角【共用】按鈕，權限已改為<strong>「知道連結的任何人」</strong>。</div>
                                            <div>2. 試算表內部需包含名稱為 <strong>Book_ALL</strong> 與 <strong>倉庫</strong> 的兩個工作表分頁。</div>
                                            <div>3. 若設定權限後仍受阻，可於下欄選擇 <strong>Book_ALL 試算表 CSV (剪貼)</strong> 頁籤直接選擇檔案一次匯入！</div>
                                        </div>

                                        <div>
                                            <label className="block text-xs font-bold text-amber-900 mb-1">
                                                Google 試算表網址：
                                            </label>
                                            <input 
                                                type="text"
                                                value={googleSheetUrl}
                                                onChange={(e) => setGoogleSheetUrl(e.target.value)}
                                                className="w-full p-3 rounded-xl border border-borderwood bg-white text-xs font-mono font-bold text-amber-900 outline-none focus:border-amber-800 shadow-inner"
                                            />
                                        </div>

                                        <div className="flex justify-end gap-2 pt-2">
                                            <button 
                                                onClick={() => handleSyncFromGoogleSheets(true)}
                                                disabled={isSyncingSheets}
                                                className="w-full py-3.5 rounded-xl text-xs font-bold bg-amber-800 text-white hover:bg-amber-900 transition shadow-md flex items-center justify-center gap-2 text-sm"
                                            >
                                                <Icon name="RefreshCw" size={16} className={isSyncingSheets ? 'animate-spin' : ''} />
                                                <span>{isSyncingSheets ? "正在連線下載雲端全社資料..." : "⚡ 立即從 Google 試算表同步 (Book_ALL + 倉庫)"}</span>
                                            </button>
                                        </div>
                                    </div>
                                )}

                                {csvTab === 'BOOKS_CSV' && (
                                    <div className="space-y-3">
                                        <div className="flex justify-between items-center bg-paper p-3 rounded-xl border border-borderwood">
                                            <span className="text-xs text-amber-900 font-bold">📂 直接選擇試算表 CSV 檔案上傳：</span>
                                            <input 
                                                type="file" 
                                                accept=".csv"
                                                onChange={(e) => handleFileUpload(e, false)}
                                                className="text-xs text-amber-900 font-bold file:mr-3 file:py-1.5 file:px-3 file:rounded-lg file:border-0 file:text-xs file:font-bold file:bg-amber-800 file:text-white hover:file:bg-amber-900 cursor-pointer"
                                            />
                                        </div>
                                        <textarea 
                                            value={csvText}
                                            onChange={(e) => setCsvText(e.target.value)}
                                            rows="8"
                                            className="w-full p-3 rounded-xl border border-borderwood bg-white text-xs font-mono text-amber-900 outline-none focus:border-amber-800 leading-relaxed"
                                            placeholder="貼上 Book_ALL CSV 內容..."
                                        />
                                        <div className="flex justify-between items-center">
                                            <button 
                                                onClick={() => {
                                                    document.execCommand('copy');
                                                    showToast("已複製 Book_ALL CSV 數據到剪貼簿！");
                                                }}
                                                className="px-4 py-2 rounded-xl text-xs font-bold bg-white border border-borderwood text-amber-900 hover:bg-paper transition flex items-center gap-1.5"
                                            >
                                                <Icon name="Copy" size={15} /> 複製 Book_ALL CSV 數據
                                            </button>
                                            <button 
                                                onClick={handleImportCsvText}
                                                className="px-5 py-2 rounded-xl text-xs font-bold bg-amber-800 text-white hover:bg-amber-900 shadow-sm"
                                            >
                                                一鍵匯入並更新圖書儲位
                                            </button>
                                        </div>
                                    </div>
                                )}

                                {csvTab === 'WAREHOUSES_CSV' && (
                                    <div className="space-y-3">
                                        <div className="flex justify-between items-center bg-paper p-3 rounded-xl border border-borderwood">
                                            <span className="text-xs text-amber-900 font-bold">🏢 直接選擇倉庫 CSV 檔案上傳：</span>
                                            <input 
                                                type="file" 
                                                accept=".csv"
                                                onChange={(e) => handleFileUpload(e, true)}
                                                className="text-xs text-amber-900 font-bold file:mr-3 file:py-1.5 file:px-3 file:rounded-lg file:border-0 file:text-xs file:font-bold file:bg-amber-800 file:text-white hover:file:bg-amber-900 cursor-pointer"
                                            />
                                        </div>
                                        <textarea 
                                            value={warehouseCsvText}
                                            onChange={(e) => setWarehouseCsvText(e.target.value)}
                                            rows="8"
                                            className="w-full p-3 rounded-xl border border-borderwood bg-white text-xs font-mono text-amber-900 outline-none focus:border-amber-800 leading-relaxed"
                                            placeholder="貼上 倉庫分頁 CSV 內容..."
                                        />
                                        <div className="flex justify-between items-center">
                                            <button 
                                                onClick={() => {
                                                    document.execCommand('copy');
                                                    showToast("已複製 倉庫分頁 CSV 數據到剪貼簿！");
                                                }}
                                                className="px-4 py-2 rounded-xl text-xs font-bold bg-white border border-borderwood text-amber-900 hover:bg-paper transition flex items-center gap-1.5"
                                            >
                                                <Icon name="Copy" size={15} /> 複製倉庫分頁 CSV 數據
                                            </button>
                                            <button 
                                                onClick={handleImportWarehouseCsvText}
                                                className="px-5 py-2 rounded-xl text-xs font-bold bg-amber-800 text-white hover:bg-amber-900 shadow-sm"
                                            >
                                                一鍵匯入並更新倉庫 3D 擺設
                                            </button>
                                        </div>
                                    </div>
                                )}
                            </div>
                        </div>
                    )}

                    {/* Modal 2: Print Blueprint Report */}
                    {isPrintModalOpen && (
                        <div className="fixed inset-0 bg-black/60 backdrop-blur-sm z-50 flex items-center justify-center p-4">
                            <div className="bg-white border-2 border-borderwood w-full max-w-2xl rounded-3xl shadow-2xl p-8 flex flex-col gap-5 font-sans animate-in">
                                <div className="text-center border-b border-borderwood pb-4">
                                    <h2 className="text-2xl font-black text-amber-900 font-serif-title">
                                        文史哲出版社 - 倉庫擺設明細與揀貨藍圖
                                    </h2>
                                    <p className="text-xs text-amber-800 font-bold mt-1">
                                        {activeWarehouse.name} ({activeWarehouse.code}) ‧ {new Date().toLocaleDateString()}
                                    </p>
                                </div>

                                <div className="space-y-4 max-h-96 overflow-y-auto pr-2">
                                    <h3 className="font-bold text-amber-900 text-sm flex items-center gap-1.5">
                                        <Icon name="Grid" size={16} className="text-amber-800" />
                                        目前書架佈局對照表：
                                    </h3>
                                    <table className="w-full text-left text-xs border-collapse">
                                        <thead>
                                            <tr className="bg-paper border-b border-borderwood text-amber-900 font-bold">
                                                <th className="p-2">書架代號</th>
                                                <th className="p-2">書架名稱</th>
                                                <th className="p-2">X, Z 座標</th>
                                                <th className="p-2">層數</th>
                                                <th className="p-2">擺放書籍種數</th>
                                            </tr>
                                        </thead>
                                        <tbody>
                                            {activeWarehouse.shelves.map(sh => (
                                                <tr key={sh.id} className="border-b border-borderwood/50">
                                                    <td className="p-2 font-mono font-bold text-amber-800">{sh.code}</td>
                                                    <td className="p-2 font-bold text-amber-900">{sh.name}</td>
                                                    <td className="p-2 font-mono">({sh.x}, {sh.z})</td>
                                                    <td className="p-2">{sh.tiers} 層</td>
                                                    <td className="p-2 font-bold">{books.filter(b => b.shelfId === sh.id || b.shelfId === sh.code).length} 種</td>
                                                </tr>
                                            ))}
                                        </tbody>
                                    </table>
                                </div>

                                <div className="flex justify-end gap-3 pt-4 border-t border-borderwood">
                                    <button 
                                        onClick={() => setIsPrintModalOpen(false)}
                                        className="px-4 py-2 rounded-xl text-xs font-bold bg-paper border border-borderwood text-amber-900"
                                    >
                                        關閉
                                    </button>
                                    <button 
                                        onClick={() => window.print()}
                                        className="px-5 py-2 rounded-xl text-xs font-bold bg-amber-800 text-white hover:bg-amber-900 shadow-sm flex items-center gap-1.5"
                                    >
                                        <Icon name="Printer" size={15} /> 列印此藍圖報表
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* Modal 3: Add New Shelf Modal */}
                    {isAddShelfModalOpen && (
                        <div className="fixed inset-0 bg-black/60 backdrop-blur-sm z-50 flex items-center justify-center p-4">
                            <form onSubmit={handleAddShelf} className="bg-cream border-2 border-borderwood w-full max-w-md rounded-3xl shadow-2xl p-6 flex flex-col gap-4 font-sans animate-in">
                                <div className="flex justify-between items-center border-b border-borderwood pb-3">
                                    <h3 className="text-base font-bold font-serif-title text-amber-900 flex items-center gap-2">
                                        <Icon name="PlusCircle" size={18} className="text-amber-800" />
                                        新增書架至 {activeWarehouse.name}
                                    </h3>
                                    <button type="button" onClick={() => setIsAddShelfModalOpen(false)} className="p-1 rounded-full hover:bg-paper">
                                        <Icon name="X" size={18} />
                                    </button>
                                </div>

                                <div className="space-y-3 text-xs">
                                    <div>
                                        <label className="block text-amber-900 font-bold mb-1">書架代號 (如: A9架)</label>
                                        <input name="code" required defaultValue={`A${activeWarehouse.shelves.length + 1}架`} className="w-full p-2.5 rounded-xl border border-borderwood bg-white font-bold outline-none" />
                                    </div>
                                    <div>
                                        <label className="block text-amber-900 font-bold mb-1">書架區塊名稱</label>
                                        <input name="name" required placeholder="例如：臺灣文學特藏區" className="w-full p-2.5 rounded-xl border border-borderwood bg-white font-bold outline-none" />
                                    </div>
                                    <div className="grid grid-cols-2 gap-2">
                                        <div>
                                            <label className="block text-amber-900 font-bold mb-1">X 軸座標 (公尺)</label>
                                            <input name="x" type="number" step="0.5" defaultValue="0" className="w-full p-2.5 rounded-xl border border-borderwood bg-white font-bold outline-none" />
                                        </div>
                                        <div>
                                            <label className="block text-amber-900 font-bold mb-1">Z 軸座標 (公尺)</label>
                                            <input name="z" type="number" step="0.5" defaultValue="0" className="w-full p-2.5 rounded-xl border border-borderwood bg-white font-bold outline-none" />
                                        </div>
                                    </div>
                                    <div className="grid grid-cols-3 gap-2">
                                        <div>
                                            <label className="block text-amber-900 font-bold mb-1">旋轉角度</label>
                                            <select name="rot" className="w-full p-2.5 rounded-xl border border-borderwood bg-white font-bold outline-none">
                                                <option value="0">0°</option>
                                                <option value="90">90°</option>
                                                <option value="180">180°</option>
                                                <option value="270">270°</option>
                                            </select>
                                        </div>
                                        <div>
                                            <label className="block text-amber-900 font-bold mb-1">層數</label>
                                            <input name="tiers" type="number" min="2" max="8" defaultValue="5" className="w-full p-2.5 rounded-xl border border-borderwood bg-white font-bold outline-none" />
                                        </div>
                                        <div>
                                            <label className="block text-amber-900 font-bold mb-1">寬度(m)</label>
                                            <input name="width" type="number" step="0.2" defaultValue="3.2" className="w-full p-2.5 rounded-xl border border-borderwood bg-white font-bold outline-none" />
                                        </div>
                                    </div>
                                    <div>
                                        <label className="block text-amber-900 font-bold mb-1">主要書籍類別</label>
                                        <input name="category" defaultValue="文學叢刊" className="w-full p-2.5 rounded-xl border border-borderwood bg-white font-bold outline-none" />
                                    </div>
                                </div>

                                <div className="flex justify-end gap-2 pt-2 border-t border-borderwood">
                                    <button type="button" onClick={() => setIsAddShelfModalOpen(false)} className="px-4 py-2 rounded-xl text-xs font-bold bg-paper text-amber-900">
                                        取消
                                    </button>
                                    <button type="submit" className="px-5 py-2 rounded-xl text-xs font-bold bg-amber-800 text-white hover:bg-amber-900 shadow-sm">
                                        確認新增
                                    </button>
                                </div>
                            </form>
                        </div>
                    )}

                    {/* Modal 4: Add New Warehouse Modal */}
                    {isAddWarehouseModalOpen && (
                        <div className="fixed inset-0 bg-black/60 backdrop-blur-sm z-50 flex items-center justify-center p-4">
                            <form onSubmit={handleAddWarehouse} className="bg-cream border-2 border-borderwood w-full max-w-md rounded-3xl shadow-2xl p-6 flex flex-col gap-4 font-sans animate-in">
                                <div className="flex justify-between items-center border-b border-borderwood pb-3">
                                    <h3 className="text-base font-bold font-serif-title text-amber-900 flex items-center gap-2">
                                        <Icon name="Building2" size={18} className="text-amber-800" />
                                        建立新文史哲圖書倉庫
                                    </h3>
                                    <button type="button" onClick={() => setIsAddWarehouseModalOpen(false)} className="p-1 rounded-full hover:bg-paper">
                                        <Icon name="X" size={18} />
                                    </button>
                                </div>

                                <div className="space-y-3 text-xs">
                                    <div>
                                        <label className="block text-amber-900 font-bold mb-1">倉庫名稱</label>
                                        <input name="name" required placeholder="例如：羅斯福路二倉 (D倉)" className="w-full p-2.5 rounded-xl border border-borderwood bg-white font-bold outline-none" />
                                    </div>
                                    <div>
                                        <label className="block text-amber-900 font-bold mb-1">倉庫代碼 (如: D-MAIN)</label>
                                        <input name="code" required defaultValue={`WH-D`} className="w-full p-2.5 rounded-xl border border-borderwood bg-white font-bold outline-none uppercase" />
                                    </div>
                                    <div>
                                        <label className="block text-amber-900 font-bold mb-1">倉庫地址/位置</label>
                                        <input name="address" required placeholder="例如：臺北市中正區羅斯福路一段72巷8號B1" className="w-full p-2.5 rounded-xl border border-borderwood bg-white font-bold outline-none" />
                                    </div>
                                    <div className="grid grid-cols-3 gap-2">
                                        <div>
                                            <label className="block text-amber-900 font-bold mb-1">長度 (m)</label>
                                            <input name="width" type="number" step="1" defaultValue="25" className="w-full p-2.5 rounded-xl border border-borderwood bg-white font-bold outline-none" />
                                        </div>
                                        <div>
                                            <label className="block text-amber-900 font-bold mb-1">深度/寬 (m)</label>
                                            <input name="depth" type="number" step="1" defaultValue="18" className="w-full p-2.5 rounded-xl border border-borderwood bg-white font-bold outline-none" />
                                        </div>
                                        <div>
                                            <label className="block text-amber-900 font-bold mb-1">屋頂高度 (m)</label>
                                            <input name="height" type="number" step="0.5" defaultValue="4.5" className="w-full p-2.5 rounded-xl border border-borderwood bg-white font-bold outline-none" />
                                        </div>
                                    </div>
                                </div>

                                <div className="flex justify-end gap-2 pt-2 border-t border-borderwood">
                                    <button type="button" onClick={() => setIsAddWarehouseModalOpen(false)} className="px-4 py-2 rounded-xl text-xs font-bold bg-paper text-amber-900">
                                        取消
                                    </button>
                                    <button type="submit" className="px-5 py-2 rounded-xl text-xs font-bold bg-amber-800 text-white hover:bg-amber-900 shadow-sm">
                                        建立新倉庫
                                    </button>
                                </div>
                            </form>
                        </div>
                    )}

                    {/* Toast Notification */}
                    {toastMessage && (
                        <div className="fixed bottom-6 left-1/2 -translate-x-1/2 bg-amber-900 text-white px-5 py-3 rounded-2xl shadow-2xl z-50 text-xs font-bold flex items-center gap-2 border border-white/20 animate-in">
                            <Icon name="CheckCircle2" size={16} className="text-amber-300" />
                            <span>{toastMessage}</span>
                        </div>
                    )}
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
